<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Book Club Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Creepster&family=Baloo+2:wght@700;800&display=swap">
<style>
/* Book Club Vote: ten trailers across genres, the club picks one. Silent. No names. */
:root{--bg:#14121c;--card:#201c2c;--ink:#efeaf8;--muted:#b3abc8;--line:#3a3350;--glow:#ffb453;--glow-soft:#3a2b17;--win:#7fd6a8;--win-soft:#1c3329;
  --display:"Creepster","Baloo 2",system-ui,sans-serif;--head:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"Lexend","Segoe UI",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:2.8rem;font-weight:400;margin:0;color:var(--glow);letter-spacing:.03em;line-height:1.1}
h2{font-family:var(--head);font-size:1.4rem;margin:0}
p{margin:0}.small{font-size:.9rem;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.win{border-color:var(--win);box-shadow:0 0 0 3px var(--win-soft)}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top .ic{font-size:2.4rem;line-height:1}
.meta{font-size:.85rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;color:var(--glow)}
details p{white-space:pre-line;margin-top:8px;font-size:1.05rem}
.last{font-weight:700}
.vote{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:8px 16px;cursor:pointer;border:2px solid var(--glow);background:var(--glow-soft);color:var(--glow)}
.btn.small{padding:4px 12px;font-size:.9rem}
.count{font-family:var(--head);font-size:1.6rem;min-width:2ch;text-align:center}
.bar{position:sticky;bottom:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.winner{font-family:var(--head);font-size:1.3rem;color:var(--win)}
button:focus-visible{outline:3px solid var(--win);outline-offset:2px}
</style>
</head>
<body>
<main>
  <header style="display:flex;flex-direction:column;gap:6px">
    <h1>Pick Our Book</h1>
    <p>Ten stories: mystery, humor, fantasy, an epic, adventure, horse stories and more. Read each trailer out loud. Then everyone picks their top 2!</p>
  </header>
  <section class="cards" id="cards"></section>
  <div class="bar"><span class="winner" id="winner">Votes: 0</span><span><button type="button" class="btn" id="reveal">🏆 Show the winner</button> <button type="button" class="btn small" id="reset">Start over</button></span></div>
</main>
<script>
(function(){
"use strict";
var B=[{"id":"hound","ic":"🔍","g":"Mystery","t":"The Hound of the Baskervilles","by":"Arthur Conan Doyle, 1902","tr":"For two hundred years, the Baskerville family has whispered about a curse.\nA giant hound. Eyes that glow. A howl across the foggy moor at night.\nNow Sir Charles is gone, and next to his path in the mud…\nare the footprints of an enormous dog.\nIs it a ghost? Or is someone using the legend to hide a crime?","last":"Only Sherlock Holmes can find out. Do you dare walk onto the moor?"},{"id":"canterville","ic":"😂","g":"Humor","t":"The Canterville Ghost","by":"Oscar Wilde, 1887","tr":"The Canterville ghost has been scaring people for three hundred years.\nHe rattles chains. He moans. He leaves a spooky stain on the floor that never goes away.\nThen a new family moves in… and they are NOT scared.\nThey scrub away his stain. They oil his squeaky chains. The twins set traps for him!\nNow the ghost is the one who's terrified.","last":"Can a ghost who can't scare anyone ever get some peace?"},{"id":"psammead","ic":"🧞","g":"Fantasy","t":"Five Children and It","by":"E. Nesbit, 1902","tr":"Five kids are digging in a sandpit when they find something strange.\nIt has eyes on stalks like a snail, ears like a bat, and a VERY bad temper.\nIt's a sand fairy, and it grants one wish every day.\nThere's just one problem.\nEvery wish goes wrong. Wings that vanish at sunset. Gold nobody will take.","last":"What would YOU wish for… and how would it go wrong?"},{"id":"odyssey","ic":"⚔️","g":"Epic","t":"The Odyssey","by":"Homer, about 2,700 years old","tr":"The war is over, and the hero Odysseus just wants to sail home.\nBut the sea has other plans.\nA one-eyed giant traps his crew in a cave.\nSingers on the rocks try to pull his ship onto the stones.\nA witch turns his sailors into pigs!\nIt will take him ten whole years.","last":"Can one clever hero outsmart monsters, storms, and gods to get home?"},{"id":"treasure","ic":"🏴‍☠️","g":"Adventure","t":"Treasure Island","by":"Robert Louis Stevenson, 1883","tr":"Jim works at his family's inn by the sea.\nOne stormy night, an old sailor with a scar arrives… and he's hiding something.\nA map. An X. A treasure buried on a faraway island.\nSoon Jim is sailing across the ocean, and the friendly cook with one leg and a parrot\nmight be the most dangerous pirate of all.","last":"Who can Jim trust when everyone wants the gold?"},{"id":"leagues","ic":"🦑","g":"Science adventure","t":"Twenty Thousand Leagues Under the Sea","by":"Jules Verne, 1870","tr":"Ships are disappearing. Sailors say a giant sea monster is to blame.\nA scientist joins the hunt… and gets thrown overboard!\nHe's rescued by the monster itself, which isn't a monster at all.\nIt's a secret submarine called the Nautilus, and its captain never wants to go back to land.\nUnderwater forests. Lost cities. A giant squid.","last":"Will they ever get back to the surface?"},{"id":"toad","ic":"🐸","g":"Animal comedy","t":"The Wind in the Willows","by":"Kenneth Grahame, 1908","tr":"Mr. Toad is rich, loud, and VERY excited about his new hobbies.\nFirst it was boats. Then it was a horse and cart.\nNow it's motorcars, and he crashes every single one.\nHis friends Mole, Rat, and Badger try to stop him.\nBut Toad has a plan… and a disguise.","last":"Can anyone save Toad from himself?"},{"id":"beauty","ic":"🐎","g":"Horse story","t":"Black Beauty","by":"Anna Sewell, 1877","tr":"I am a horse, and this is my story, told by me.\nI grew up in a green meadow, running beside my mother.\nThen I was sold. And sold again.\nSome of my owners were kind. Some were not.\nOne stormy night, I refused to cross a bridge… and I was right.","last":"A horse tells his own life story. Will he ever find a home where someone treats him right?"},{"id":"smoky","ic":"🤠","g":"Western","t":"Smoky the Cowhorse","by":"Will James, 1926","tr":"Smoky was born wild on the open range, a mouse-gray colt who was afraid of nothing.\nA cowboy named Clint wanted to tame him, not by force, but by earning his trust.\nTogether they worked cattle across the West.\nThen one night, Smoky was stolen.","last":"Years later, can one cowboy find the horse he lost?"},{"id":"painting","ic":"🖼️","g":"Original mystery","t":"The Painting That Blinked","by":"Written for our book club","tr":"The old museum on Hollow Street has a painting of a girl with a gray cat in her lap.\nNobody pays much attention to it.\nUntil the night two friends stay late… and the girl in the painting blinks.\nThe next morning, the cat in the painting is gone.\nAnd a gray cat is sitting on the museum steps, waiting for them.","last":"What happened to the girl in the frame? And why does the cat want our help?"}];
var votes={}; B.forEach(function(b){votes[b.id]=0;});
try{ var s=JSON.parse(localStorage.getItem("bookclub.votes")||"null"); if(s) Object.keys(votes).forEach(function(k){ if(typeof s[k]==="number") votes[k]=s[k]; }); }catch(e){}
var shown=false;
function $(id){return document.getElementById(id);}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function save(){ try{ localStorage.setItem("bookclub.votes",JSON.stringify(votes)); }catch(e){} }
function top(){ var m=Math.max.apply(null,B.map(function(b){return votes[b.id];})); return m? B.filter(function(b){return votes[b.id]===m;}) : []; }
function render(){
  var w=shown?top():[];
  $("cards").innerHTML=B.map(function(b){ var isW=w.some(function(x){return x.id===b.id;});
    return '<article class="card'+(isW?" win":"")+'"><div class="top"><span class="ic">'+b.ic+'</span><div><h2>'+esc(b.t)+'</h2><div class="meta"><b>'+esc(b.g)+'</b> · '+esc(b.by)+'</div></div></div>'+
      '<details><summary>Read the trailer</summary><p>'+esc(b.tr)+'</p><p class="last">'+esc(b.last)+'</p></details>'+
      '<div class="vote"><button type="button" class="btn small" data-m="'+b.id+'" aria-label="Remove a vote">−</button><span class="count">'+votes[b.id]+'</span><button type="button" class="btn" data-p="'+b.id+'">+ Vote</button>'+(isW?' <span class="winner">🏆 Our book!</span>':'')+'</div></article>'; }).join("");
  var total=B.reduce(function(a,b){return a+votes[b.id];},0);
  $("winner").textContent = shown ? (w.length===1 ? "🏆 We're reading: "+w[0].t : (w.length>1 ? "It's a tie! Decide together." : "No votes yet")) : "Votes: "+total;
  Array.prototype.forEach.call(document.querySelectorAll("[data-p]"),function(x){ x.addEventListener("click",function(){ votes[x.getAttribute("data-p")]++; save(); render(); }); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-m]"),function(x){ x.addEventListener("click",function(){ var k=x.getAttribute("data-m"); if(votes[k]>0) votes[k]--; save(); render(); }); });
}
$("reveal").addEventListener("click",function(){ shown=true; render(); });
$("reset").addEventListener("click",function(){ Object.keys(votes).forEach(function(k){votes[k]=0;}); shown=false; save(); render(); });
render();
})();
</script>
</body>
</html>
