/* ============================== MINIGAME ============================== */
let mini = null;
function startMini(kind) {
  openOverlay(kind === "arcade" ? "Blip Arcade" : S.games[S.games.length - 1], kind === "arcade" ? "Star Catcher cabinet" : "On the TV in your room", kind === "arcade" ? "#5b2c8c" : "#7c4b3a");
  const body = document.getElementById("cardBody");
  body.innerHTML =
    '<div id="miniStat"><span>Score <b id="mScore">0</b></span><span>Time <b id="mTime">30</b></span>' +
    (kind === "arcade" ? "<span>Best <b>" + S.bestArcade + "</b></span>" : "") + "</div>" +
    '<canvas id="miniCanvas" width="560" height="420"></canvas>' +
    '<p class="hint">Move the basket with the arrow keys, your mouse, or your finger. Catch the stars, dodge the rocks.</p>' +
    '<button id="miniQuit" class="primary" type="button">Stop playing</button>';
  document.getElementById("miniQuit").addEventListener("click", () => endMini(kind));

  const c = document.getElementById("miniCanvas"), g = c.getContext("2d");
  const fast = kind === "arcade" ? 1.35 : 1;
  mini = { mode: kind, g: g, c: c, score: 0, t: 30, last: performance.now(), basket: 280, items: [], spawn: 0, raf: 0, over: false };
  mini.end = () => endMini(kind);

  const move = cx => { const r = c.getBoundingClientRect(); mini.basket = clamp(((cx - r.left) / r.width) * 560, 40, 520); };
  c.addEventListener("mousemove", e => move(e.clientX));
  c.addEventListener("touchmove", e => { e.preventDefault(); move(e.touches[0].clientX); }, { passive: false });

  function frame(now) {
    if (!mini || mini.over) return;
    const dt = Math.min(50, now - mini.last); mini.last = now; mini.t -= dt / 1000;
    if (keys.ArrowLeft || keys.KeyA) mini.basket = clamp(mini.basket - dt * .55, 40, 520);
    if (keys.ArrowRight || keys.KeyD) mini.basket = clamp(mini.basket + dt * .55, 40, 520);

    mini.spawn -= dt;
    if (mini.spawn <= 0) {
      mini.spawn = 380 / fast;
      mini.items.push({ x: 30 + Math.random() * 500, y: -20, v: (.13 + Math.random() * .09) * fast, rock: Math.random() < (kind === "arcade" ? .32 : .2) });
    }

    g.fillStyle = "#0d1020"; g.fillRect(0, 0, 560, 420);
    for (let i = 0; i < 26; i++) {
      g.fillStyle = "rgba(255,255,255," + (.06 + (i % 5) * .03) + ")";
      g.fillRect((i * 97) % 560, (i * 53 + Math.floor(now / 40)) % 420, 2, 2);
    }
    mini.items.forEach(it => {
      it.y += it.v * dt;
      if (it.rock) { g.fillStyle = "#7c7f96"; g.beginPath(); g.arc(it.x, it.y, 13, 0, Math.PI * 2); g.fill(); }
      else star(g, it.x, it.y, 13, "#ffd166");
      if (it.y > 350 && it.y < 386 && Math.abs(it.x - mini.basket) < 46 && !it.hit) {
        it.hit = true;
        if (it.rock) { mini.score = Math.max(0, mini.score - 15); beep(140, .12, "square"); }
        else { mini.score += 10; beep(880 + (mini.score % 5) * 60, .06); }
      }
    });
    mini.items = mini.items.filter(it => it.y < 440 && !it.hit);

    g.fillStyle = "#ff7a3c";
    g.beginPath(); g.moveTo(mini.basket - 46, 366); g.lineTo(mini.basket + 46, 366);
    g.lineTo(mini.basket + 34, 398); g.lineTo(mini.basket - 34, 398); g.closePath(); g.fill();
    g.fillStyle = "#ffd166"; g.fillRect(mini.basket - 46, 360, 92, 7);

    const sEl = document.getElementById("mScore"), tEl = document.getElementById("mTime");
    if (!sEl || !tEl) { endMini(kind); return; }
    sEl.textContent = mini.score; tEl.textContent = Math.max(0, Math.ceil(mini.t));
    if (mini.t <= 0) { endMini(kind); return; }
    mini.raf = requestAnimationFrame(frame);
  }
  mini.raf = requestAnimationFrame(frame);
}

function star(g, cx, cy, r, color) {
  g.fillStyle = color; g.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 ? r * .45 : r, a = (Math.PI / 5) * i - Math.PI / 2;
    const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
    i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.closePath(); g.fill();
}

function endMini(kind) {
  if (!mini) return;
  mini.over = true; cancelAnimationFrame(mini.raf);
  const score = mini.score; mini = null;
  if (kind === "arcade") {
    const tickets = Math.round(score * .9);
    S.tickets += tickets;
    if (score > S.bestArcade) S.bestArcade = score;
    S.needs.fun = clamp(S.needs.fun + 14, 0, 100);
    S.needs.energy = clamp(S.needs.energy - 5, 0, 100);
    advance(30); toast("Scored " + score + " — won " + tickets + " tickets.", "win");
  } else {
    const bonus = 8 + S.games.length * 4;
    S.needs.fun = clamp(S.needs.fun + bonus + Math.min(14, score / 20), 0, 100);
    S.needs.energy = clamp(S.needs.energy - 10, 0, 100);
    advance(45); toast("Scored " + score + " in " + S.games[S.games.length - 1] + ".", "win");
  }
  checkGoals(); save();
  paused = false;
  document.getElementById("overlay").classList.remove("show");
}

/* ========================= SHOWTIME: dance =========================
   Four lanes, shapes falling on the beat. Nothing to read: the shape
   on the note is the key you press, and the lanes are tappable too. */
const LANES = [
  { code: "ArrowLeft",  sign: "\u25C0", c: "#ff5d8f" },
  { code: "ArrowUp",    sign: "\u25B2", c: "#ffd166" },
  { code: "ArrowDown",  sign: "\u25BC", c: "#3ad1c0" },
  { code: "ArrowRight", sign: "\u25B6", c: "#7ac6e0" }
];

function startDance(paid) {
  const total = 28, gap = 460, lead = 1800, travel = 1500, hitY = 322;
  openOverlay(paid ? "Tonight's show" : "Run the routine",
    paid ? "Every seat out there is full" : "Nobody watching. Just the mirror.", "#b02f74");
  const body = document.getElementById("cardBody");
  body.innerHTML =
    '<div id="miniStat"><span>Hits <b id="dHit">0</b> / ' + total + '</span><span>In a row <b id="dRun">0</b></span></div>' +
    '<canvas id="miniCanvas" width="560" height="420"></canvas>' +
    '<div class="lanebtns">' + LANES.map((l, i) => '<button type="button" data-lane="' + i + '" style="color:' + l.c + '">' + l.sign + '</button>').join("") + '</div>' +
    '<p class="hint">Press the arrow key the moment the shape touches the line. Tap the big arrows instead if you like.</p>' +
    '<button id="miniQuit" class="primary" type="button">Stop the music</button>';

  const c = document.getElementById("miniCanvas"), g = c.getContext("2d");
  const notes = [];
  for (let i = 0; i < total; i++) notes.push({ t: lead + i * gap, lane: (i * 3 + Math.floor(i / 4)) % 4, hit: false, dead: false });
  const t0 = performance.now();
  mini = { mode: "dance", hits: 0, run: 0, over: false, raf: 0, flash: [0, 0, 0, 0] };
  mini.end = () => finishDance(paid, mini ? mini.hits : 0, total);
  mini.onKey = code => { const i = LANES.findIndex(l => l.code === code); if (i >= 0) press(i); };
  document.getElementById("miniQuit").addEventListener("click", () => { if (mini) mini.end(); });
  body.querySelectorAll(".lanebtns button").forEach(b => b.addEventListener("click", () => press(+b.dataset.lane)));

  function press(lane) {
    if (!mini || mini.over) return;
    mini.flash[lane] = 1;
    const now = performance.now() - t0;
    let best = null, bd = 9999;
    notes.forEach(nt => {
      if (nt.lane !== lane || nt.hit || nt.dead) return;
      const d = Math.abs((nt.t + travel) - now);
      if (d < bd) { bd = d; best = nt; }
    });
    if (best && bd < 200) {
      best.hit = true; mini.hits++; mini.run++;
      beep(620 + Math.min(7, mini.run) * 50, .06);
    } else { mini.run = 0; beep(150, .08, "square"); }
  }

  function frame(now) {
    if (!mini || mini.over) return;
    const t = now - t0;
    g.fillStyle = "#1a1030"; g.fillRect(0, 0, 560, 420);
    for (let i = 0; i < 4; i++) {
      g.fillStyle = "rgba(255,255,255,.035)";
      g.beginPath(); g.moveTo(70 + i * 140, 0); g.lineTo(14 + i * 140, 420); g.lineTo(126 + i * 140, 420); g.fill();
    }
    g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 4;
    g.beginPath(); g.moveTo(8, hitY); g.lineTo(552, hitY); g.stroke();
    LANES.forEach((l, i) => {
      const cx = 70 + i * 140;
      g.globalAlpha = .22 + mini.flash[i] * .65;
      g.fillStyle = l.c; g.beginPath(); g.arc(cx, hitY, 31, 0, Math.PI * 2); g.fill();
      g.globalAlpha = 1;
      g.fillStyle = "rgba(255,255,255,.9)"; g.font = '700 26px "Baloo 2", sans-serif'; g.textAlign = "center";
      g.fillText(l.sign, cx, hitY + 10);
      mini.flash[i] = Math.max(0, mini.flash[i] - .06);
    });
    notes.forEach(nt => {
      if (nt.hit || nt.dead) return;
      const y = hitY - ((nt.t + travel) - t) / travel * (hitY + 70);
      if (y > hitY + 56) { nt.dead = true; mini.run = 0; return; }
      if (y < -40) return;
      const cx = 70 + nt.lane * 140;
      g.fillStyle = LANES[nt.lane].c;
      g.beginPath(); g.arc(cx, y, 25, 0, Math.PI * 2); g.fill();
      g.fillStyle = "rgba(20,10,30,.8)"; g.font = '700 23px "Baloo 2", sans-serif'; g.textAlign = "center";
      g.fillText(LANES[nt.lane].sign, cx, y + 9);
    });
    const hEl = document.getElementById("dHit"), rEl = document.getElementById("dRun");
    if (!hEl || !rEl) { mini.end(); return; }
    hEl.textContent = mini.hits; rEl.textContent = mini.run;
    if (t > lead + total * gap + travel + 500) { mini.end(); return; }
    mini.raf = requestAnimationFrame(frame);
  }
  mini.raf = requestAnimationFrame(frame);
}

function finishDance(paid, hits, total) {
  if (!mini) return;
  mini.over = true; cancelAnimationFrame(mini.raf); mini = null;
  const pct = Math.round(hits / total * 100);
  S.stage.bestShow = Math.max(S.stage.bestShow, pct);
  if (paid) {
    const pay = 40 + Math.round(pct * 1.1) + S.stage.practice * 6;
    S.doneToday.job_stage = true; S.jobsEver.stage = (S.jobsEver.stage || 0) + 1;
    S.money += pay; S.stage.shows++;
    S.needs.energy = clamp(S.needs.energy - 14, 0, 100);
    S.needs.fun = clamp(S.needs.fun + 20, 0, 100);
    advance(90); completeGoal("firstShow"); checkJobsGoal(); sfxGood();
    if (pct >= 85) {
      S.stage.ovations++; completeGoal("ovation"); challengeDone("ovation");
      toast("STANDING OVATION. " + pct + "% and they would not sit down. +" + money(pay), "win");
    } else toast("You hit " + pct + "% of it. The house paid you " + money(pay) + ".", "win");
  } else {
    if (pct >= 60) S.stage.practice = Math.min(6, S.stage.practice + 1);
    if (pct >= 85) challengeDone("ovation");        // rehearsing it perfectly counts
    S.needs.energy = clamp(S.needs.energy - 8, 0, 100);
    S.needs.fun = clamp(S.needs.fun + 10, 0, 100);
    advance(45);
    toast("Rehearsal: " + pct + "%." + (pct >= 60 ? " Practice level " + S.stage.practice + "." : " Run it again."), pct >= 60 ? "win" : "");
  }
  checkGoals(); save();
  paused = false;
  document.getElementById("overlay").classList.remove("show");
}

/* ======================= SHOWTIME: acrobatics =======================
   Three tricks. A marker slides; stop it on the green. The stripe gets
   narrower each trick and wider the more you have practised. */
function startAcro(paid) {
  openOverlay(paid ? "Acrobatics show" : "Tumbling practice",
    paid ? "Three tricks. One go at each." : "Chalk on your hands, nobody watching.", "#2f8f86");
  const body = document.getElementById("cardBody");
  body.innerHTML =
    '<div id="miniStat"><span>Trick <b id="aTrick">1</b> of 3</span><span>Landed <b id="aLand">0</b></span></div>' +
    '<canvas id="miniCanvas" width="560" height="420"></canvas>' +
    '<div class="lanebtns"><button id="aGo" type="button" style="color:#ffd166">STOP IT</button></div>' +
    '<p class="hint">The yellow marker slides back and forth. Stop it inside the green stripe — press the space bar, or tap the big button.</p>' +
    '<button id="miniQuit" class="primary" type="button">Come down</button>';
  const c = document.getElementById("miniCanvas"), g = c.getContext("2d");
  const zones = [];
  for (let i = 0; i < 3; i++) {
    const zw = clamp(.28 - i * .05 + S.stage.acro * .018, .09, .36);
    zones.push({ c: clamp(.16 + Math.random() * .68, zw / 2 + .02, .98 - zw / 2), w: zw });
  }
  mini = { mode: "acro", trick: 0, landed: 0, pos: 0, dir: 1, locked: false, over: false, raf: 0, msg: "", msgT: 0 };
  mini.end = () => finishAcro(paid, mini ? mini.landed : 0);
  mini.onKey = code => { if (code === "Space" || code === "Enter") stop(); };
  document.getElementById("aGo").addEventListener("click", stop);
  document.getElementById("miniQuit").addEventListener("click", () => { if (mini) mini.end(); });

  function stop() {
    if (!mini || mini.locked || mini.over) return;
    const z = zones[Math.min(2, mini.trick)];
    const ok = Math.abs(mini.pos - z.c) <= z.w / 2;
    if (ok) { mini.landed++; mini.msg = "LANDED IT"; sfxGood(); } else { mini.msg = "WOBBLE"; sfxNope(); }
    mini.msgT = performance.now() + 1200;
    mini.locked = true;
    setTimeout(() => {
      if (!mini || mini.over) return;
      mini.trick++; mini.locked = false; mini.pos = 0; mini.dir = 1; mini.msg = "";
      if (mini.trick >= 3) mini.end();
    }, 1200);
  }

  let last = performance.now();
  function frame(now) {
    if (!mini || mini.over) return;
    const dt = Math.min(50, now - last); last = now;
    if (!mini.locked) {
      mini.pos += mini.dir * (.00055 + mini.trick * .00022) * dt;
      if (mini.pos > 1) { mini.pos = 1; mini.dir = -1; }
      if (mini.pos < 0) { mini.pos = 0; mini.dir = 1; }
    }
    g.fillStyle = "#1c2440"; g.fillRect(0, 0, 560, 420);
    g.fillStyle = "rgba(255,214,102,.09)";
    g.beginPath(); g.ellipse(280, 175, 160, 120, 0, 0, Math.PI * 2); g.fill();

    const won = mini.locked && mini.msg === "LANDED IT";
    g.save();
    g.translate(280, won ? 130 : 175);
    g.rotate(won ? (performance.now() % 650) / 650 * Math.PI * 2 : 0);
    g.strokeStyle = S.look.skin; g.lineWidth = 7; g.lineCap = "round";
    g.beginPath(); g.moveTo(-10, -10); g.lineTo(-28, -30); g.stroke();
    g.beginPath(); g.moveTo(10, -10); g.lineTo(28, -30); g.stroke();
    g.beginPath(); g.moveTo(-7, 24); g.lineTo(-17, 50); g.stroke();
    g.beginPath(); g.moveTo(7, 24); g.lineTo(17, 50); g.stroke();
    g.fillStyle = worn("top") ? worn("top").c : "#e0538f";
    g.beginPath(); g.ellipse(0, 2, 15, 26, 0, 0, Math.PI * 2); g.fill();
    if (S.look.long) { g.fillStyle = S.look.hair; g.beginPath(); g.ellipse(0, -34, 14, 18, 0, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = S.look.skin;
    g.beginPath(); g.arc(0, -35, 13, 0, Math.PI * 2); g.fill();
    g.fillStyle = S.look.hair;
    g.beginPath(); g.arc(0, -38, 13, Math.PI, Math.PI * 2); g.fill();
    g.restore();

    const bx = 60, bw = 440, by = 326;
    g.fillStyle = "#0d1020"; g.fillRect(bx, by, bw, 34);
    const z = zones[Math.min(2, mini.trick)];
    g.fillStyle = "#3ad1c0"; g.fillRect(bx + (z.c - z.w / 2) * bw, by + 4, z.w * bw, 26);
    g.fillStyle = "#ffd166"; g.fillRect(bx + mini.pos * bw - 4, by - 9, 9, 52);
    g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 3; g.strokeRect(bx, by, bw, 34);

    if (mini.msg && performance.now() < mini.msgT) {
      g.fillStyle = mini.msg === "LANDED IT" ? "#92e46f" : "#ff5d8f";
      g.font = '800 36px "Baloo 2", sans-serif'; g.textAlign = "center";
      g.fillText(mini.msg, 280, 290);
    }
    const tEl = document.getElementById("aTrick"), lEl = document.getElementById("aLand");
    if (!tEl || !lEl) { mini.end(); return; }
    tEl.textContent = Math.min(3, mini.trick + 1); lEl.textContent = mini.landed;
    mini.raf = requestAnimationFrame(frame);
  }
  mini.raf = requestAnimationFrame(frame);
}

function finishAcro(paid, landed) {

/* ===================== THE TOURNAMENT: three matches ====================
   A grip battle. Left, right, left, right pulls the rope your way; the
   other one pulls steadily back. Drilling and your belt make you stronger. */
function startBout() {
  openOverlay("Today's tournament", "Three people to beat, one after the other", "#2b4468");
  const body = document.getElementById("cardBody");
  body.innerHTML =
    '<div id="miniStat"><span>Match <b id="tRound">1</b> of 3</span><span>Won <b id="tWon">0</b></span></div>' +
    '<canvas id="miniCanvas" width="560" height="420"></canvas>' +
    '<div class="lanebtns"><button type="button" data-p="L" style="color:#ff5d8f">\u25C0</button>' +
    '<button type="button" data-p="R" style="color:#7ac6e0">\u25B6</button></div>' +
    '<p class="hint">Pull the rope by pressing left, right, left, right as fast as you can. Tap the two big arrows instead if you like.</p>' +
    '<button id="miniQuit" class="primary" type="button">Give up</button>';
  const c = document.getElementById("miniCanvas"), g = c.getContext("2d");
  const grip = .045 + S.dojo.skill * .004 + beltIndex() * .003;
  mini = { mode: "bout", round: 0, won: 0, m: .5, side: "", t: 0, pause: false, note: "", over: false, raf: 0 };
  mini.end = () => finishBout(mini ? mini.won : 0);
  mini.onKey = code => { if (code === "ArrowLeft") hit("L"); else if (code === "ArrowRight") hit("R"); };
  body.querySelectorAll(".lanebtns button").forEach(b => b.addEventListener("click", () => hit(b.dataset.p)));
  document.getElementById("miniQuit").addEventListener("click", () => { if (mini) mini.end(); });

  function hit(sd) {
    if (!mini || mini.over || mini.pause) return;
    const good = sd !== mini.side;
    mini.side = sd;
    mini.m = clamp(mini.m + grip * (good ? 1 : .4), 0, 1);
    beep(good ? 520 : 290, .04);
  }
  function endRound(win) {
    if (!mini || mini.pause) return;
    mini.pause = true;
    mini.note = win ? "YOU WON!" : "THEY GOT YOU";
    if (win) { mini.won++; sfxGood(); } else sfxNope();
    setTimeout(() => {
      if (!mini || mini.over) return;
      mini.round++; mini.m = .5; mini.t = 0; mini.side = ""; mini.pause = false; mini.note = "";
      if (mini.round >= 3) mini.end();
    }, 1600);
  }

  let last = performance.now();
  function frame(now) {
    if (!mini || mini.over) return;
    const dt = Math.min(50, now - last); last = now;
    const f = FIGHTERS[Math.min(2, mini.round)];
    if (!mini.pause) {
      mini.t += dt;
      mini.m = clamp(mini.m - f.pull * dt / 1000, 0, 1);
      if (mini.m >= 1) endRound(true);
      else if (mini.m <= 0) endRound(false);
      else if (mini.t > 22000) endRound(mini.m > .5);
    }
    g.fillStyle = "#101828"; g.fillRect(0, 0, 560, 420);
    g.fillStyle = "#1b2740"; g.fillRect(0, 300, 560, 120);

    g.font = "64px sans-serif"; g.textAlign = "center";
    g.fillText("\uD83E\uDD4B", 120, 150);
    g.fillText(f.pic, 440, 150);
    g.fillStyle = beltColor(); g.fillRect(86, 160, 68, 10);
    g.fillStyle = "#fff4e2"; g.font = '700 19px "Baloo 2", sans-serif';
    g.fillText(who(), 120, 198); g.fillText(f.name, 440, 198);

    g.fillStyle = "#2a3350"; g.fillRect(50, 235, 460, 42);
    g.fillStyle = "#92e46f"; g.fillRect(50, 235, 460 * mini.m, 42);
    g.fillStyle = "#fff4e2"; g.fillRect(50 + 460 * mini.m - 4, 222, 9, 68);
    g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 3; g.strokeRect(50, 235, 460, 42);

    if (mini.note) {
      g.fillStyle = mini.note.charAt(0) === "Y" ? "#92e46f" : "#ff5d8f";
      g.font = '800 33px "Baloo 2", sans-serif';
      g.fillText(mini.note, 280, 350);
    } else {
      g.fillStyle = "rgba(255,244,226,.6)"; g.font = '600 15px "Figtree", sans-serif';
      g.fillText("left \u2192 right \u2192 left \u2192 right", 280, 350);
    }
    const rEl = document.getElementById("tRound"), wEl = document.getElementById("tWon");
    if (!rEl || !wEl) { mini.end(); return; }
    rEl.textContent = Math.min(3, mini.round + 1); wEl.textContent = mini.won;
    mini.raf = requestAnimationFrame(frame);
  }
  mini.raf = requestAnimationFrame(frame);
}

function finishBout(won) {
  if (!mini) return;
  mini.over = true; cancelAnimationFrame(mini.raf); mini = null;
  const before = beltIndex();
  S.dojo.wins += won; S.dojo.entries++;
  S.doneToday.job_dojo = true; S.jobsEver.dojo = (S.jobsEver.dojo || 0) + 1;
  const pay = won >= 3 ? 200 : won === 2 ? 80 : won === 1 ? 40 : 20;
  S.money += pay;
  S.needs.energy = clamp(S.needs.energy - 20, 0, 100);
  S.needs.fun = clamp(S.needs.fun + 16, 0, 100);
  S.needs.clean = clamp(S.needs.clean - 14, 0, 100);
  advance(120); checkJobsGoal();
  if (won >= 1) challengeDone("belt");   // one win is enough for the Friday card
  if (won >= 3) {
    S.dojo.cups = (S.dojo.cups || 0) + 1;
    if (S.prizes.indexOf("Jujitsu trophy") < 0) S.prizes.push("Jujitsu trophy");
    completeGoal("champion"); sfxGood();
    toast("CHAMPION. Three matches, three wins, and a cup. +" + money(pay), "win");
  } else toast("You won " + won + " of 3. +" + money(pay), won ? "win" : "bad");
  const after = beltIndex();
  if (after > before) {
    sfxGood(); toast("New belt: " + BELTS[after].name + "!", "win");
    if (after >= BELTS.length - 1) completeGoal("blackBelt");
  }
  checkGoals(); save();
  paused = false;
  document.getElementById("overlay").classList.remove("show");
}

/* ======================= EVERYBODY ON EVERYBODY'S SCREEN =======================
   Each person still plays their own Northgate — their own money, their own
   pets, their own day. The only thing that travels is where they are
   standing, so you see each other walking round the same town.

   Nothing that arrives from the relay is allowed to change this game. It is
   only ever drawn. A stranger on a public broker can make a cartoon walk
   across the screen and nothing else. And if nothing connects, the game is
   exactly as it was — a Friday call must never be wrecked by a relay having
   a bad day. */
const RELAY = "wss://broker.emqx.io:8084/mqtt";     // free, no account needed
const TOPIC = "northgate-city/room/";
const MEID = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const PEERS = Object.create(null);
let roomCode = null, sock = null, bc = null, netState = "off", lastBeat = 0, lastSent = "";

function codeOf() {
  const L = "BCDFGHJKLMNPRSTVWXZ";                  // no vowels, so it never spells anything
  let c = "";
  for (let i = 0; i < 4; i++) c += L[Math.floor(Math.random() * L.length)];
  return c;
}

const HEXOK = /^#[0-9a-fA-F]{3,8}$/;
function colourOr(v, fallback) { return (typeof v === "string" && HEXOK.test(v)) ? v : fallback; }
function cleanName(v) {
  return String(v == null ? "" : v).replace(/[^\p{L}\p{N} '\-]/gu, "").trim().slice(0, 12) || "Someone";
}

/* Everything a peer sends is treated as decoration and clamped into range. */
function takePeer(m) {
  if (!m || typeof m !== "object" || typeof m.i !== "string" || m.i === MEID) return;
  if (m.bye) { delete PEERS[m.i]; return; }
  const where = (m.r === "city" || ROOMS[m.r]) ? m.r : "city";
  const lim = where === "city" ? WORLD : ROOMS[where];
  const x = clamp(Number(m.x) || 0, 0, lim.w), y = clamp(Number(m.y) || 0, 0, lim.h);
  const p = PEERS[m.i] || (PEERS[m.i] = { rx: x, ry: y });
  if (p.r !== where) { p.rx = x; p.ry = y; }         // they walked into another building
  p.r = where; p.x = x; p.y = y;
  p.n = cleanName(m.n);
  p.k = colourOr(m.k, "#f0c08a");
  p.h = colourOr(m.h, "#4a3526");
  p.t = colourOr(m.t, "#ff7a3c");
  p.l = !!m.l;
  p.d = ["up", "down", "left", "right"].indexOf(m.d) >= 0 ? m.d : "down";
  p.mv = !!m.m;
  p.car = typeof m.c === "string" ? m.c : null;
  p.cc = colourOr(m.cc, "#ff7a3c");
  p.ct = colourOr(m.ct, "#2b2f3e");
  p.a = Number(m.a) || 0;
  p.at = performance.now();
}

function peerCount() {
  const now = performance.now();
  let k = 0;
  for (const id in PEERS) { if (now - PEERS[id].at > 6000) delete PEERS[id]; else k++; }
  return k;
}

function myPacket() {
  const driving = mode === "drive";
  const mc = myCar();
  return {
    i: MEID, n: S.name || "Someone",
    k: S.look.skin, h: S.look.hair, l: S.look.long ? 1 : 0,
    t: worn("top") ? worn("top").c : "#ff7a3c",
    r: (mode === "inside" && room) ? roomId(room) : "city",
    x: Math.round(driving ? car.x : hero.x),
    y: Math.round(driving ? car.y : hero.y),
    d: hero.dir, m: hero.moving ? 1 : 0,
    c: driving ? mc.shape : null, cc: driving ? mc.color : null, ct: driving ? mc.trim : null,
    a: driving ? +car.a.toFixed(2) : 0
  };
}

function netSend(obj) {
  const txt = JSON.stringify(obj);
  try { if (bc) bc.postMessage(txt); } catch (e) {}
  try { if (sock && sock.connected) sock.publish(TOPIC + roomCode, txt, { qos: 0 }); } catch (e) {}
}

function netTick() {
  if (!roomCode) return;
  const now = performance.now();
  const pkt = myPacket();
  const sig = pkt.r + "|" + pkt.x + "|" + pkt.y + "|" + pkt.d + "|" + pkt.m + "|" + pkt.c;
  if (sig !== lastSent || now - lastBeat > 900) {
    lastSent = sig; lastBeat = now;
    netSend(pkt);
  }
}

function netReceive(raw) {
  let m = null;
  try { m = JSON.parse(String(raw)); } catch (e) { return; }
  takePeer(m);
}

function joinRoom(c) {
  leaveRoom(true);
  roomCode = c;
  netState = "connecting";
  try {
    bc = new BroadcastChannel("northgate-" + c);     // two windows on one computer
    bc.onmessage = e => netReceive(e.data);
  } catch (e) {}
  if (typeof mqtt === "undefined") { netState = "blocked"; paintTogether(); return; }
  try {
    sock = mqtt.connect(RELAY, {
      clientId: "ng_" + MEID.slice(0, 12),
      clean: true, reconnectPeriod: 4000, connectTimeout: 8000, keepalive: 30
    });
    sock.on("connect", () => {
      sock.subscribe(TOPIC + c, { qos: 0 }, err => {
        netState = err ? "blocked" : "open";
        paintTogether();
        if (!err) netSend(myPacket());
      });
    });
    sock.on("message", (t, payload) => netReceive(payload.toString()));
    sock.on("error", () => { netState = "blocked"; paintTogether(); });
    sock.on("close", () => { if (netState === "open") netState = "closed"; paintTogether(); });
  } catch (e) { netState = "blocked"; }
  setTimeout(() => { if (netState === "connecting") { netState = "blocked"; paintTogether(); } }, 10000);
  paintTogether();
}

function leaveRoom(quiet) {
  if (roomCode) { try { netSend({ i: MEID, bye: 1 }); } catch (e) {} }
  try { if (bc) bc.close(); } catch (e) {}
  try { if (sock) sock.end(true); } catch (e) {}
  bc = null; sock = null; roomCode = null; netState = "off"; lastSent = "";
  for (const id in PEERS) delete PEERS[id];
  if (!quiet) paintTogether();
}
window.addEventListener("pagehide", () => leaveRoom(true));

function netWord() {
  if (netState === "open") return peerCount() ? "" : "Nobody else yet. Read the four letters out.";
  if (netState === "connecting") return "Connecting\u2026";
  if (netState === "blocked") return "This network is blocking it. Everyone can still play on their own.";
  if (netState === "closed") return "The connection dropped. It will try again by itself.";
  return "";
}

function paintTogether() {
  const btn = document.getElementById("togetherBtn");
  if (btn) {
    const k = peerCount();
    btn.textContent = roomCode ? "\uD83D\uDC65 " + roomCode + (k ? " \u00b7 " + (k + 1) : "") : "\uD83D\uDC65 Together";
  }
  const st = document.getElementById("netStatus");
  if (st) st.textContent = netWord();
  const list = document.getElementById("hereList");
  if (list) list.innerHTML = hereHTML();
}

function hereHTML() {
  const names = ['<span class="me">' + esc(S.name || "You") + "</span>"];
  const now = performance.now();
  for (const id in PEERS) if (now - PEERS[id].at <= 6000) names.push("<span>" + esc(PEERS[id].n) + "</span>");
  return names.join("");
}

function showTogether() {
  openOverlay("Play together", "Everybody walks round the same town", "#2f6b3c");
  const b = document.getElementById("cardBody");
  if (roomCode) {
    b.innerHTML =
      '<p class="rowlabel">Your four letters</p>' +
      '<div class="codebox">' + roomCode + "</div>" +
      '<p class="hint">Everybody else opens the same link, taps Together, and types these four letters.</p>' +
      '<p class="rowlabel">Who is here</p>' +
      '<div class="herelist" id="hereList">' + hereHTML() + "</div>" +
      '<p class="hint" id="netStatus">' + netWord() + "</p>" +
      '<button id="leaveRoom" type="button">Play on my own again</button>';
    document.getElementById("leaveRoom").addEventListener("click", () => { leaveRoom(); closeOverlay(); });
  } else {
    b.innerHTML =
      '<p class="hint">You still play your own Northgate — your own money, your own animals, your own day. This just lets you see each other walking round.</p>' +
      '<button id="startRoom" class="primary" type="button">Start a room</button>' +
      '<p class="rowlabel">Or join one</p>' +
      '<div class="namebox"><input id="joinCode" class="codein" type="text" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE"></div>' +
      '<button id="doJoin" type="button">Join</button>';
    document.getElementById("startRoom").addEventListener("click", () => { joinRoom(codeOf()); showTogether(); });
    const field = document.getElementById("joinCode");
    const go = () => {
      const c = field.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
      if (c.length === 4) { joinRoom(c); showTogether(); } else field.focus();
    };
    document.getElementById("doJoin").addEventListener("click", go);
    field.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    setTimeout(() => { try { field.focus(); } catch (e) {} }, 120);
  }
}

/* ---- drawing the others ---- */
function nameTag(x, y, text) {
  ctx.font = '700 12px "Baloo 2", sans-serif';
  ctx.textAlign = "center";
  const w = Math.min(130, ctx.measureText(text).width + 16);
  ctx.fillStyle = "rgba(22,28,48,.82)";
  rr(x - w / 2, y - 56, w, 19, 9); ctx.fill();
  ctx.fillStyle = "#fff4e2";
  ctx.fillText(text, x, y - 42);
}

function drawPeers(where) {
  if (!roomCode) return;
  const now = performance.now();
  for (const id in PEERS) {
    const p = PEERS[id];
    if (now - p.at > 6000) { delete PEERS[id]; continue; }
    if (p.r !== where) continue;
    p.rx += (p.x - p.rx) * .22;
    p.ry += (p.y - p.ry) * .22;
    if (p.car) {
      drawCar(p.rx, p.ry, p.a, p.cc, false, p.car, p.ct, [], 0);
      nameTag(p.rx, p.ry - 8, p.n);
    } else {
      ctx.globalAlpha = .95;
      drawPerson(p.rx, p.ry, p.d, p.mv ? now / 70 : 0, p.t, p.k, p.h, false, null, p.l);
      ctx.globalAlpha = 1;
      nameTag(p.rx, p.ry, p.n);
    }
  }
}

/* ============================== INPUT ============================== */
window.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;      // they are typing their name
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].indexOf(e.code) >= 0) e.preventDefault();
  keys[e.code] = true;
  if (e.code === "Escape") { if (paused) closeOverlay(); return; }
  if (mini && mini.onKey && !e.repeat) { mini.onKey(e.code); return; }
  if (e.code === "KeyE" || e.code === "Space") { if (!paused) interact(); }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

let musicArmed = false;
function armMusic() {
  if (musicArmed) return;
  musicArmed = true;
  if (S.song != null && audioOn) musicPlay(S.song);
}
window.addEventListener("keydown", armMusic, { once: false });
window.addEventListener("pointerdown", armMusic, { once: false });

function hold(btn, code) {
  const down = e => { e.preventDefault(); keys[code] = true; };
  const up = e => { e.preventDefault(); keys[code] = false; };
  btn.addEventListener("mousedown", down);
  btn.addEventListener("touchstart", down, { passive: false });
  ["mouseup", "mouseleave", "touchend", "touchcancel"].forEach(ev => btn.addEventListener(ev, up));
}
document.querySelectorAll(".pad button").forEach(b => hold(b, b.dataset.key));
document.getElementById("useBtn").addEventListener("click", () => interact());
document.getElementById("goalsBtn").addEventListener("click", showGoals);
document.getElementById("fridayBtn").addEventListener("click", showChallenges);
document.getElementById("lookBtn").addEventListener("click", () => showLook());
document.getElementById("gearBtn").addEventListener("click", showSettings);
document.getElementById("togetherBtn").addEventListener("click", showTogether);

function toggleSound(btn) {
  audioOn = !audioOn;
  try { localStorage.setItem(SOUND_KEY, audioOn ? "yes" : "no"); } catch (err) {}
  if (!audioOn) musicStop(); else if (S.song != null) musicPlay(S.song);
  if (btn) { btn.textContent = audioOn ? "Sound on" : "Sound off"; btn.setAttribute("aria-pressed", String(audioOn)); }
  if (audioOn) toast("Sound on. Radio picks a track.");
}

/* A tab left open in the background must not keep playing to itself. */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) musicStop();
  else if (audioOn && S.song != null) musicPlay(S.song);
});
function resetGame() {
  if (confirm("Start a brand new life? Your money, pet and goals will be gone.")) {
    S = freshState();
    car.x = 420; car.y = 545; car.a = -Math.PI / 2; car.sp = 0;
    hero.x = 470; hero.y = 560; mode = "drive"; room = null;
    document.getElementById("banner").textContent = "Northgate";
    save(); closeOverlay(); drawHud();
    toast("New game. Day 1, 7:00 AM.", "win");
  }
}
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay" && !mini) closeOverlay(); });

/* ============================== LOOP ============================== */
let last = performance.now();
function loop(now) {
  const dt = Math.min(60, now - last); last = now; T = now / 1000;
  if (!paused) {
    if (mode === "drive") stepCar(dt);
    else stepWalk(dt, mode === "inside");
    updateFocus();
  }
  if (mode === "inside" && room) drawRoom(); else drawCityScene();
  drawHud(); drawPrompt();
  netTick();
  requestAnimationFrame(loop);
}

rebuildHome();
buildHud(); fit(); updateMusicBtn();

requestAnimationFrame(loop);

if (S.firstBoot) {
  S.firstBoot = false; save();
  setTimeout(() => toast("Press E to hop out of the car, then walk to the door of your house.", "win"), 500);
  setTimeout(() => toast("Need money? The crane at the build site pays $160 a shift.", "win"), 3200);
  setTimeout(() => toast("Your animals ride with you — heads out the window, or the sidecar.", "win"), 6200);
} else {
  setTimeout(() => toast("Welcome back. It's day " + S.day + ".", "win"), 500);
}
if (!S.name && !S.askedName) {
  S.askedName = true; save();
  setTimeout(() => { if (!paused) showLook(true); }, 400);
}
if (!S.seenStudio) {
  S.seenStudio = true; save();
  setTimeout(() => toast("New in town: bunnies at Pet Palace, and two new places east past the roller rink.", "win"), 2400);
  setTimeout(() => toast("Spotlight Studio pays you to dance and do acrobatics. The dojo runs a tournament every day.", "win"), 5600);
}
setInterval(save, 15000);
</script>
