<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Northgate City Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
  /* ---------------------------------------------------------------
     Northgate City Life — one committed daylight-to-dusk world.
     Every colour is painted explicitly; the page does not follow the
     viewer's theme, because the city carries its own time of day.
     --------------------------------------------------------------- */
  :root {
    --night:      #161c30;
    --deep:       #1e2740;
    --panel:      #27314f;
    --panel-2:    #303c5e;
    --line:       #43507a;
    --cream:      #fff4e2;
    --muted:      #a8b2d2;
    --tangerine:  #ff7a3c;
    --tangerine-d:#e35f26;
    --teal:       #3ad1c0;
    --cash:       #92e46f;
    --sun:        #ffd166;
    --berry:      #ff5d8f;
    --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
    --mono: "DM Mono", "Consolas", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--night);
    color: var(--cream);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100%; }

  /* ------------------------------ HUD ------------------------------ */
  #hud {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 10px 16px;
    background: linear-gradient(180deg, var(--deep), var(--night));
    border-bottom: 3px solid var(--line);
    z-index: 5;
  }

  .clockbox { display: flex; align-items: baseline; gap: 10px; }
  .clockbox .time {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 24px; letter-spacing: -0.5px; color: var(--sun);
  }
  .clockbox .day {
    font-family: var(--display); font-weight: 700; font-size: 15px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em;
  }

  .meters { display: flex; gap: 14px; flex-wrap: wrap; flex: 1 1 320px; }
  .meter { min-width: 92px; flex: 1 1 92px; }
  .meter .lbl {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
  }
  .meter .lbl b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; color: var(--cream); }
  .bar { height: 9px; border-radius: 99px; background: #1a2138; overflow: hidden; border: 1px solid #364268; }
  .bar > i { display: block; height: 100%; border-radius: 99px; transition: width .25s ease; }
  .bar.low > i { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  .money {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 21px;
    color: var(--cash); background: #16351f; border: 2px solid #2f6b3c;
    border-radius: 10px; padding: 4px 12px; white-space: nowrap;
  }

  .hudbtns { display: flex; gap: 8px; }

  button {
    font-family: var(--display); font-weight: 700; font-size: 15px;
    color: var(--cream); background: var(--panel-2);
    border: 2px solid var(--line); border-radius: 10px;
    padding: 7px 13px; cursor: pointer;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  button:hover:not(:disabled) { background: #3a4770; border-color: #5b6aa0; }
  button:active:not(:disabled) { transform: translateY(2px); }
  button:disabled { opacity: .42; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  button.primary { background: var(--tangerine); border-color: var(--tangerine-d); color: #2a1206; }
  button.primary:hover:not(:disabled) { background: #ff8f5b; }

  /* ----------------------------- STAGE ----------------------------- */
  #stage { position: relative; flex: 1 1 auto; overflow: hidden; background: #2c3a24; }
  #city { display: block; width: 100%; height: 100%; touch-action: none; }

  #prompt {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: rgba(22,28,48,.94); border: 2px solid var(--sun); border-radius: 14px;
    padding: 9px 16px; display: none; max-width: min(460px, 84vw);
    box-shadow: 0 10px 28px rgba(0,0,0,.45);
  }
  #prompt.show { display: block; }
  #prompt .row { display: flex; align-items: center; gap: 9px; }
  #prompt .title { font-family: var(--display); font-weight: 700; font-size: 17.5px; }
  #prompt kbd {
    font-family: var(--mono); font-size: 13px;
    background: var(--sun); color: #34240a; border-radius: 6px; padding: 2px 8px;
  }
  #prompt .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  #prompt .why { margin-top: 5px; font-size: 12.5px; color: #ffb0b0; }

  .chip {
    font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
    border-radius: 99px; padding: 2px 8px;
    background: #1d2643; border: 1px solid #3d4a75; color: var(--muted);
  }
  .chip.cost { color: #ffb0b0; border-color: #6d3a44; background: #331d24; }
  .chip.earn { color: var(--cash); border-color: #2f6b3c; background: #16351f; }
  .chip.good { color: var(--teal); border-color: #226a63; background: #12332f; }
  .chip.time { color: var(--sun); border-color: #6a5726; background: #2e2712; }

  #banner {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(22,28,48,.86); border: 2px solid var(--line); border-radius: 99px;
    padding: 5px 18px; font-family: var(--display); font-weight: 700; font-size: 14px;
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  }

  #touch {
    position: absolute; inset: auto 0 0 0;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 14px; pointer-events: none;
  }
  .pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 54px); gap: 6px; pointer-events: auto; }
  .pad button { width: 54px; height: 54px; border-radius: 14px; font-size: 20px; background: rgba(39,49,79,.82); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  #useBtn { pointer-events: auto; width: 104px; height: 104px; border-radius: 50%; font-size: 15px; line-height: 1.15; padding: 6px; }

  /* ---------------------------- OVERLAY ---------------------------- */
  #overlay {
    position: fixed; inset: 0; z-index: 20; background: rgba(12,16,28,.72);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  #overlay.show { display: flex; }

  .card {
    width: min(700px, 100%); max-height: 92vh;
    display: flex; flex-direction: column;
    background: var(--panel); border: 3px solid var(--line); border-radius: 20px;
    overflow: hidden; box-shadow: 0 26px 60px rgba(0,0,0,.55);
    animation: rise .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes rise { from { transform: translateY(26px) scale(.97); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .bar.low > i { animation: none; }
  }

  .card-top {
    display: flex; align-items: center; gap: 14px; padding: 14px 18px;
    background: var(--head, var(--panel-2)); border-bottom: 3px solid rgba(0,0,0,.25);
  }
  .card-top h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 25px; line-height: 1.05; }
  .card-top p { margin: 3px 0 0; font-size: 13.5px; color: rgba(255,255,255,.8); }
  .card-top .spacer { flex: 1; }
  .card-body { padding: 16px 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; align-items: center; }

  #miniCanvas {
    width: 100%; max-width: 560px; aspect-ratio: 4 / 3;
    border-radius: 14px; border: 3px solid var(--line); background: #0d1020; touch-action: none;
  }
  #miniStat { font-family: var(--mono); font-size: 15px; display: flex; gap: 22px; }
  #miniStat b { color: var(--sun); }
  .hint { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin: 0; text-align: center; max-width: 60ch; }

  ul.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; width: 100%; }
  ul.goals li {
    display: flex; gap: 11px; align-items: center; font-size: 14.5px;
    background: #1d2643; border: 2px solid var(--line); border-radius: 12px; padding: 10px 13px;
  }
  ul.goals li.done { border-color: #2f6b3c; background: #16351f; color: var(--cash); }
  ul.goals li .box {
    width: 22px; height: 22px; flex: none; border-radius: 7px; border: 2px solid var(--line);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px; color: var(--cash);
  }
  ul.goals li.done .box { border-color: #2f6b3c; }
  ul.goals li .rw { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--sun); }

  /* ----------------------------- TOASTS ----------------------------- */
  #toasts {
    position: fixed; right: 14px; top: 78px; z-index: 40;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none;
  }
  .toast {
    background: rgba(22,28,48,.95); border: 2px solid var(--line); border-left: 6px solid var(--sun);
    border-radius: 12px; padding: 9px 14px; max-width: 300px; font-size: 14px; font-weight: 600;
    box-shadow: 0 10px 26px rgba(0,0,0,.45); animation: slidein .2s ease;
  }
  .toast.win { border-left-color: var(--cash); }
  .toast.bad { border-left-color: var(--berry); }
  @keyframes slidein { from { transform: translateX(24px); opacity: 0; } }

  /* --- Friday challenge, the look picker, and the show minigames --- */
  .quest {
    font-family: var(--display); font-weight: 700; font-size: 13px;
    background: #3a2a12; border: 2px solid #6a5726; color: var(--sun);
    border-radius: 99px; padding: 4px 12px; display: none; white-space: nowrap;
  }
  .quest.on { display: inline-block; }

  .lanebtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .lanebtns button { min-width: 86px; font-size: 26px; padding: 10px 18px; }

  .picks { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }
  .pick { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 162px; padding: 12px 10px; text-align: center; }
  .pick .pic { font-size: 40px; line-height: 1.1; }
  .pick .lab { font-family: var(--display); font-size: 16.5px; font-weight: 800; }
  .pick .line { font-family: var(--body); font-size: 11.5px; font-weight: 500; color: var(--muted); line-height: 1.4; }
  .pick .mins { font-family: var(--mono); font-size: 11px; color: var(--sun); }
  .pick .tick { font-family: var(--mono); font-size: 11px; color: var(--cash); }
  .picks.small button { padding: 7px; min-width: 0; }
  .face { width: 46px; height: 46px; border-radius: 50%; display: block; position: relative; overflow: hidden; }
  .face i { position: absolute; left: 0; right: 0; top: 0; height: 38%; border-radius: 23px 23px 7px 7px; }
  .face.long i { height: 66%; border-radius: 23px 23px 16px 16px; }
  .rowlabel { font-family: var(--display); font-weight: 700; font-size: 13px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 2px 0 -6px; }

  .namebox { width: min(330px, 100%); display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .namebox input {
    width: 100%; font-family: var(--display); font-weight: 800; font-size: 26px; text-align: center;
    color: var(--cream); background: #1d2643; border: 3px solid var(--line);
    border-radius: 14px; padding: 10px 14px;
  }
  .namebox input:focus { outline: none; border-color: var(--sun); }
  .namebox input::placeholder { color: #6b77a3; font-weight: 700; }

  .codebox {
    font-family: var(--mono); font-weight: 500; font-size: 46px; letter-spacing: .22em;
    color: var(--sun); background: #2e2712; border: 3px solid #6a5726;
    border-radius: 16px; padding: 10px 6px 10px 26px; text-align: center; width: min(320px, 100%);
  }
  .codein {
    font-family: var(--mono); font-size: 30px; letter-spacing: .2em; text-transform: uppercase;
    width: min(260px, 100%); text-align: center; color: var(--cream); background: #1d2643;
    border: 3px solid var(--line); border-radius: 14px; padding: 9px 10px 9px 22px;
  }
  .codein:focus { outline: none; border-color: var(--sun); }
  .herelist { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .herelist span {
    font-family: var(--display); font-weight: 700; font-size: 14px;
    border-radius: 99px; padding: 4px 12px; background: #1d2643; border: 2px solid var(--line);
  }
  .herelist span.me { border-color: var(--cash); color: var(--cash); }

  .winbig { font-size: 78px; line-height: 1; }
  .winname { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; color: var(--cash); text-align: center; line-height: 1.1; }
  .winlabel { margin: 0; font-family: var(--display); font-weight: 800; font-size: 27px; text-align: center; }

  @media (max-width: 720px) {
    .clockbox .time { font-size: 20px; }
    .money { font-size: 17px; }
    #useBtn { width: 84px; height: 84px; font-size: 13px; }
    .meter { min-width: 74px; flex: 1 1 74px; }
  }
</style>

<div id="app">
  <header id="hud">
    <div class="clockbox">
      <span class="time" id="clock">6:00 AM</span>
      <span class="day" id="dayLabel">Day 1</span>
    </div>
    <div class="meters" id="meters"></div>
    <span class="money" id="money">$60.00</span>
    <span class="quest" id="quest"></span>
    <div class="hudbtns">
      <button id="fridayBtn" type="button">&#127881; Challenge</button>
      <button id="togetherBtn" type="button">&#128101; Together</button>
      <button id="lookBtn" type="button">&#128578; Me</button>
      <button id="goalsBtn" type="button">Goals</button>
      <button id="gearBtn" type="button" aria-label="Sound and settings">&#9881;</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="city"></canvas>
    <div id="banner">Northgate</div>
    <div id="prompt"></div>

      <div class="pad">
        <button class="up" data-key="ArrowUp" type="button" aria-label="Up">▲</button>

      </div>
      <button id="useBtn" class="primary" type="button">Get out</button>
    </div>
  </main>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-label="Screen">
  <div class="card">
    <div class="card-top" id="cardTop"></div>
    <div class="card-body" id="cardBody"></div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script defer src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
"use strict";

/* =================================================================
   NORTHGATE CITY LIFE
   Drive the city, park, get out, walk inside, and walk up to the
   actual thing you want to use. Nothing is a menu of words: the bed
   is a bed, the sushi plates are plates, the puppy is in a pen.
   ================================================================= */

const SAVE_KEY = "northgate-city-life-v4";
const DAY_START = 6 * 60;        // you're up at 6
const DAY_END = 25 * 60;         // you can stay out until 1 in the morning
const MIN_PER_SECOND = 0.65;     // the clock crawls while you drive and walk

/* ------------------------------ state ------------------------------ */
function freshState() {
  return {
    day: 1, minutes: DAY_START, money: 60,
    needs: { energy: 100, food: 80, fun: 65, clean: 95 },
    fuel: 7.5, maxFuel: 12,
    pantry: { cereal: 0, lunchstuff: 0, petfood: 0, snacks: 0 },
    pet: null, pets: [],
    car: "hatchback", ownedCars: ["hatchback"],
    built: {}, jobsEver: {}, otterShifts: 0,
    wardrobe: {}, outfit: { hat: null, top: null, shoes: null, chain: null, pack: null, shades: null },
    song: null,
    games: ["Star Catcher"], bestArcade: 0, tickets: 0, prizes: [],
    rollsTried: [], sushiBought: 0,
    doneToday: {}, goals: {}, carWashed: false, bedMade: false,
    name: "", askedName: false,
    look: { skin: "#f0c08a", hair: "#4a3526", long: false },
    stage: { practice: 0, acro: 0, shows: 0, bestShow: 0, ovations: 0 },
    dojo: { skill: 0, wins: 0, entries: 0, cups: 0 },
    challenge: null, challengeDone: {}, challengeFrom: 0,
    firstBoot: true
  };
}
let S = load() || freshState();

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw), base = freshState();
    const out = Object.assign(base, d, {
      needs: Object.assign(base.needs, d.needs || {}),
      pantry: Object.assign(base.pantry, d.pantry || {}),
      built: Object.assign({}, d.built || {}),
      jobsEver: Object.assign({}, d.jobsEver || {}),
      wardrobe: Object.assign({}, d.wardrobe || {}),
      outfit: Object.assign(base.outfit, d.outfit || {}),
      look: Object.assign(base.look, d.look || {}),
      stage: Object.assign(base.stage, d.stage || {}),
      dojo: Object.assign(base.dojo, d.dojo || {}),
      challengeDone: Object.assign({}, d.challengeDone || {}),
      pets: (d.pets && d.pets.length) ? d.pets : (d.pet ? [d.pet] : [])
    });
    out.pet = out.pets[0] || null;
    return out;
  } catch (e) { return null; }
}

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
/* Whatever a child types about themselves stays on their own computer and
   never leaves the page, but it does get written into HTML, so escape it. */
function esc(t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, ch =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function who() { return S.name || "You"; }
function money(n) { return "$" + n.toFixed(2); }
function afford(c) { return S.money >= c; }
function pay(c) { S.money -= c; sfxBuy(); }
function eat(f, fun) {
  S.needs.food = clamp(S.needs.food + f, 0, 100);
  if (fun) S.needs.fun = clamp(S.needs.fun + fun, 0, 100);
}

/* ------------------------------- cars ------------------------------- */
const CARS = [
  { id: "hatchback", name: "Rusty Hatchback", price: 0, color: "#ff7a3c", trim: "#a8481c",
    top: 4.6, accel: .17, turn: .048, tank: 11, grip: 1, seats: 1, shape: "hatch",
    blurb: "Short, dented, and it always starts. Usually." },
  { id: "speedster", name: "Blue Speedster", price: 600, color: "#3f8fd1", trim: "#f4f7fa",
    top: 6.4, accel: .24, turn: .054, tank: 13, grip: 1, seats: 1, shape: "racer",
    blurb: "White racing stripes and a little spoiler." },
  { id: "bike", name: "Sidecar Motorbike", price: 850, color: "#2f7d4f", trim: "#d9c39a",
    top: 7.2, accel: .3, turn: .078, tank: 6, grip: .9, seats: 1, sidecar: true, shape: "bike",
    blurb: "Turns on a dime. Your animal rides in the sidecar with goggles." },
  { id: "pickup", name: "Pickup Truck", price: 1000, color: "#c9483f", trim: "#7d2a24",
    top: 5.2, accel: .16, turn: .036, tank: 20, grip: 1.35, seats: 3, bed: true, shape: "truck",
    blurb: "Wide turns, big tank, and three animals fit in the back." },
  { id: "convertible", name: "Convertible", price: 1200, color: "#ffd166", trim: "#8a1e3c",
    top: 6.8, accel: .26, turn: .058, tank: 12, grip: 1, seats: 2, open: true, shape: "convert",
    blurb: "No roof at all. Everybody's ears flap." },
  { id: "icecream", name: "Ice Cream Van", price: 1500, color: "#f4f8fa", trim: "#e0538f",
    top: 4.2, accel: .12, turn: .032, tank: 26, grip: 1.1, seats: 4, jingle: true, shape: "van",
    blurb: "Slow and enormous. Four animals, a striped awning, and a jingle." },
  { id: "sports", name: "Sports Car", price: 2200, color: "#e0344f", trim: "#1b1b22",
    top: 9.2, accel: .34, turn: .062, tank: 14, grip: .8, seats: 1, shape: "sport",
    blurb: "Absurd on pavement. Bogs down the second you touch grass." },
  { id: "monster", name: "Monster Truck", price: 3000, color: "#7a3bb5", trim: "#ffd166",
    top: 6.6, accel: .2, turn: .044, tank: 24, grip: 2.2, seats: 2, shape: "monster",
    blurb: "Grass, dirt, front lawns — it genuinely does not care." }
];
function myCar() { return CARS.find(c => c.id === S.car) || CARS[0]; }

/* ------------------------------ sound ------------------------------ */
/* Silent on load, always. A shared screen should never start making
   noise by itself; the button turns it on and that choice is kept. */
const SOUND_KEY = "northgate-sound-on";
let audioOn = false, actx = null;
try { audioOn = localStorage.getItem(SOUND_KEY) === "yes"; } catch (e) { audioOn = false; }
function beep(freq, len, type) {
  if (!audioOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();

let musicTimer = null, musicStep = 0, lastJingle = -99;

function midiHz(n) { return 440 * Math.pow(2, (n - 69) / 12); }

function playNote(n, dur, type, gain) {
  if (!audioOn || n == null) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = midiHz(n);
    g.gain.setValueAtTime(gain, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + .02);
  } catch (e) {}
}

function musicStop() {
  if (musicTimer) clearInterval(musicTimer);
  musicTimer = null;
}

function musicPlay(i) {
  musicStop();
  S.song = i;
  save();
  if (i == null || !audioOn) { updateMusicBtn(); return; }
  const song = SONGS[i];
  musicStep = 0;
  const stepMs = 60000 / song.bpm / 2;
  musicTimer = setInterval(() => {
    if (!audioOn) return;
    const k = musicStep % 16;
    playNote(song.lead[k], stepMs / 1000 * 1.6, "square", .028);
    playNote(song.bass[k], stepMs / 1000 * 1.9, "triangle", .05);
    musicStep++;
  }, stepMs);
  updateMusicBtn();
}

function musicNext() {
  if (!audioOn) { toast("Sound is off. Turn it on up in the top bar first."); return; }
  const i = S.song == null ? 0 : (S.song + 1 >= SONGS.length ? null : S.song + 1);
  musicPlay(i);
  if (i != null) toast("Now playing: " + SONGS[i].name, "win");
  else toast("Radio off.");
}

function updateMusicBtn() {
  const b = document.getElementById("musicBtn");
  if (b) b.textContent = S.song == null ? "♪ Radio" : "♪ " + SONGS[S.song].name;
}

function vanJingle() {
  if (!audioOn || T - lastJingle < 22) return;
  lastJingle = T;
  [76, 72, 69, 72, 76, 79, 76].forEach((n, i) => setTimeout(() => playNote(n, .22, "triangle", .05), i * 150));
}

/* ------------------------- jobs you can take ------------------------- */
function checkJobsGoal() { if (Object.keys(S.jobsEver).length >= 5) completeGoal("fiveJobs"); }

function jobProp(cfg) {
  return {
    id: cfg.id, kind: cfg.kind, x: cfg.x, y: cfg.y, w: cfg.w, h: cfg.h,
    color: cfg.color, caption: cfg.caption,
    info() {
      const chips = [{ t: "+" + money(cfg.pay), cls: "earn" }, { t: (cfg.mins / 60) + " hr", cls: "time" }];
      if (cfg.energy) chips.push({ t: "-" + cfg.energy + " Energy", cls: "cost" });
      if (cfg.fun) chips.push({ t: "+" + cfg.fun + " Fun", cls: "good" });
      let why = "";
      if (S.doneToday["job_" + cfg.id]) why = cfg.doneMsg || "You already worked this shift today.";
      else if (S.needs.energy < (cfg.energy || 10) + 4) why = "You're too tired for this shift.";
      else if (cfg.need && !cfg.need()) why = cfg.needWhy;
      return { title: cfg.title, chips: chips, why: why };
    },
    use() {
      S.doneToday["job_" + cfg.id] = true;
      S.jobsEver[cfg.id] = (S.jobsEver[cfg.id] || 0) + 1;
      S.money += cfg.pay;
      if (cfg.energy) S.needs.energy = clamp(S.needs.energy - cfg.energy, 0, 100);
      if (cfg.fun) S.needs.fun = clamp(S.needs.fun + cfg.fun, 0, 100);
      if (cfg.clean) S.needs.clean = clamp(S.needs.clean + cfg.clean, 0, 100);
      advance(cfg.mins);
      if (cfg.after) cfg.after();
      sfxGood();
      toast(cfg.done || ("Shift done. +" + money(cfg.pay)), "win");
      checkJobsGoal();
    }
  };
}

function plotSign(plot) {
  return {
    id: "plot_" + plot.id, kind: "plot", plot: plot, walkable: true,
    x: plot.sec.x, y: plot.sec.y, w: plot.sec.w, h: plot.sec.h,
    info() {
      return {
        title: "Build the " + plot.name + " here",
        chips: [{ t: money(plot.price), cls: "cost" }, { t: "3 hr", cls: "time" }, { t: "yours forever", cls: "good" }],
        why: afford(plot.price) ? "" : "You need " + money(plot.price - S.money) + " more. Try a shift at the build site."
      };
    },
    use() {
      pay(plot.price);
      S.built[plot.id] = true;
      S.needs.energy = clamp(S.needs.energy - 18, 0, 100);
      advance(180);
      rebuildHome();
      completeGoal("buildRoom");
      if (plot.id === "pool") completeGoal("poolBuilt");
      sfxGood();
      toast("You built the " + plot.name + "! Go have a look.", "win");
    }
  };
}

function rebuildHome() {
  const h = ROOMS.home;
  h.sections = [HOME_BASE_SECTION].concat(HOME_PLOTS.filter(p => S.built[p.id]).map(p => p.sec));
  let props = HOME_BASE_PROPS.slice();
  HOME_PLOTS.forEach(p => {
    props = props.concat(S.built[p.id] ? p.props() : [plotSign(p)]);
  });
  h.props = props;
}

/* ============================ TIME + NEEDS ============================ */
let starving = false;
function advance(mins) {
  if (mins <= 0) return;
  S.minutes += mins;
  const h = mins / 60;
  S.needs.energy = clamp(S.needs.energy - h * (S.needs.food <= 0 ? 9 : 4), 0, 100);
  S.needs.food = clamp(S.needs.food - h * 5.5, 0, 100);
  S.needs.fun = clamp(S.needs.fun - h * 3.5, 0, 100);
  S.needs.clean = clamp(S.needs.clean - h * 2.5, 0, 100);
  if (S.needs.food <= 0 && !starving) { starving = true; toast("You're really hungry. Nu's counter is at Sprouts.", "bad"); }
  if (S.needs.food > 20) starving = false;
  if (S.minutes >= DAY_END) collapse(false);
  else if (S.needs.energy <= 0) collapse(true);
}

function collapse(tired) {
  toast(tired ? "You were exhausted and fell asleep." : "One in the morning! You finally crashed.", "bad");
  sleepNight(60);
}

function sleepNight(cap) {
  S.day += 1; S.minutes = DAY_START;
  S.needs.energy = cap || 100;
  S.needs.clean = clamp(S.needs.clean - 10, 0, 100);
  S.needs.food = clamp(S.needs.food - 10, 0, 100);
  S.doneToday = {}; S.carWashed = false; S.bedMade = false;
  const starved = [];
  S.pets.forEach(pt => {
    pt.hunger = clamp(pt.hunger - 34, 0, 100);
    pt.walked = false;
    if (pt.hunger < 30) { pt.happy = clamp(pt.happy - 22, 0, 100); starved.push(pt.name); }
    else { pt.happy = clamp(pt.happy + 4, 0, 100); S.needs.fun = clamp(S.needs.fun + 4, 0, 100); }
  });
  if (starved.length) toast(starved.join(" and ") + " went hungry! Fill the bowl.", "bad");
  if (S.day % 7 === 6) { S.money += 15; toast("Allowance day — Mom gave you $15.", "win"); }
  // wake up at home
  mode = "inside"; room = ROOMS.home;
  hero.x = ROOMS.home.props[0].x + 150; hero.y = ROOMS.home.props[0].y + 60;
  save();
  toast("Day " + S.day + ". Good morning!", "win");
}

function clockText() {
  const t = Math.floor(S.minutes) % (24 * 60);
  let h = Math.floor(t / 60); const m = Math.floor(t % 60);
  const ap = h >= 12 ? "PM" : "AM"; h = h % 12; if (h === 0) h = 12;
  return h + ":" + String(m).padStart(2, "0") + " " + ap;
}

/* ============================== CANVAS ============================== */
const cv = document.getElementById("city");
const ctx = cv.getContext("2d");
let VW = 900, VH = 600;
function fit() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  VW = Math.max(320, Math.round(r.width)); VH = Math.max(240, Math.round(r.height));
  cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", fit);

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function box(x, y, w, h, c, r) { ctx.fillStyle = c; rr(x, y, w, h, r === undefined ? 6 : r); ctx.fill(); }
function shadow(x, y, w, h) { ctx.fillStyle = "rgba(0,0,0,.18)"; rr(x + 5, y + 7, w, h, 8); ctx.fill(); }

function darkness() {
  const h = S.minutes / 60;
  if (h < 7.5) return clamp((7.5 - h) / 1.5, 0, 1) * 0.55;
  if (h > 19.5) return clamp((h - 19.5) / 3, 0, 1) * 0.78;
  return 0;
}
function glow(x, y, r, c) {
  const g = ctx.createRadialGradient(x, y, 2, x, y, r);
  g.addColorStop(0, c); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

/* ---------------------------- people ---------------------------- */
const DIRV = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] };

function drawPerson(x, y, dir, step, shirt, skin, hair, chefHat, fit, longHair) {
  const bob = Math.sin(step) * 2, sw = Math.sin(step) * 4;
  const dv = DIRV[dir] || DIRV.down;
  const top = fit && fit.top ? fit.top : null;
  const shoe = fit && fit.shoes ? fit.shoes : null;
  const cap = fit && fit.hat ? fit.hat : null;
  const chain = fit && fit.chain ? fit.chain : null;
  const pack = fit && fit.pack ? fit.pack : null;
  const shades = fit && fit.shades ? fit.shades : null;
  const body = top ? top.c : shirt;

  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.beginPath(); ctx.ellipse(x, y + 20, 13, 6, 0, 0, Math.PI * 2); ctx.fill();

  // backpack rides behind him
  if (pack) {
    const bx = x - dv[0] * 13, by = y - dv[1] * 7 - 2;
    box(bx - 10, by - 8, 20, 22, pack.c, 6);
    ctx.fillStyle = "rgba(255,255,255,.3)"; ctx.fillRect(bx - 7, by - 4, 14, 4);
    if (pack.style === "rocket") {
      ctx.fillStyle = "#e0344f";
      ctx.beginPath(); ctx.moveTo(bx - 10, by + 14); ctx.lineTo(bx - 14, by + 22); ctx.lineTo(bx - 4, by + 16); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx + 10, by + 14); ctx.lineTo(bx + 14, by + 22); ctx.lineTo(bx + 4, by + 16); ctx.fill();
      ctx.fillStyle = "#ffd166";
      ctx.beginPath(); ctx.arc(bx, by + 20 + Math.abs(Math.sin(T * 9)) * 3, 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  // legs
  ctx.fillStyle = "#3a4a6b";
  ctx.fillRect(x - 8, y + 6, 6, 12 + sw);
  ctx.fillRect(x + 2, y + 6, 6, 12 - sw);
  // shoes
  if (shoe) {
    ctx.fillStyle = shoe.c;
    const hi = shoe.style === "hightop" ? 6 : shoe.style === "boot" ? 4 : 0;
    rr(x - 9.5, y + 16 + sw - hi, 9, 7 + hi, 3); ctx.fill();
    rr(x + 1.5, y + 16 - sw - hi, 9, 7 + hi, 3); ctx.fill();
    if (shoe.style === "sneaker") {
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.fillRect(x - 9.5, y + 21 + sw, 9, 2); ctx.fillRect(x + 1.5, y + 21 - sw, 9, 2);
    }
  }

  // torso
  box(x - 12, y - 10 + bob * .3, 24, 20, body, 7);
  if (top && top.style === "jersey") {
    ctx.fillStyle = "#2b2f3e";
    ctx.font = '800 12px "Baloo 2", sans-serif'; ctx.textAlign = "center";
    ctx.fillText("8", x, y + 4 + bob * .3);
    ctx.fillStyle = "#e0344f";
    ctx.fillRect(x - 12, y - 10 + bob * .3, 24, 3);
  }
  if (top && top.style === "hoodie") {
    ctx.fillStyle = top.c;
    ctx.beginPath(); ctx.arc(x - dv[0] * 9, y - dv[1] * 5 - 10, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 4, y - 4); ctx.lineTo(x - 3, y + 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 4, y - 4); ctx.lineTo(x + 3, y + 4); ctx.stroke();
  }
  if (top && top.style === "leo") {                       // leotard, with a little skirt
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.moveTo(x - 8, y - 10 + bob * .3); ctx.lineTo(x, y - 1 + bob * .3); ctx.lineTo(x + 8, y - 10 + bob * .3); ctx.fill();
    ctx.fillStyle = top.c;
    ctx.beginPath(); ctx.ellipse(x, y + 9 + bob * .3, 17, 6, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (top && top.style === "gi") {                        // the belt is the one you earned
    ctx.fillStyle = "rgba(0,0,0,.13)";
    ctx.beginPath(); ctx.moveTo(x - 12, y - 10 + bob * .3); ctx.lineTo(x, y + 2 + bob * .3); ctx.lineTo(x + 12, y - 10 + bob * .3); ctx.fill();
    ctx.fillStyle = beltColor();
    ctx.fillRect(x - 13, y + 4 + bob * .3, 26, 5);
  }

  // chain
  if (chain && dir !== "up") {
    ctx.strokeStyle = chain.c; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(x, y - 9 + bob * .3, 9, .25 * Math.PI, .75 * Math.PI); ctx.stroke();
    if (chain.style === "medal") {
      ctx.fillStyle = chain.c;
      ctx.beginPath(); ctx.arc(x, y + 1 + bob * .3, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.beginPath(); ctx.arc(x, y + 1 + bob * .3, 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  // arms
  ctx.fillStyle = body;
  ctx.fillRect(x - 16, y - 8 + sw * .5, 5, 14);
  ctx.fillRect(x + 11, y - 8 - sw * .5, 5, 14);

  // head
  if (longHair) { ctx.fillStyle = hair; rr(x - 12, y - 31 + bob * .3, 24, 31, 11); ctx.fill(); }
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(x, y - 20 + bob * .3, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hair;
  ctx.beginPath(); ctx.arc(x, y - 23 + bob * .3, 11, Math.PI * (dir === "up" ? 0 : 1), Math.PI * 2); ctx.fill();

  if (chefHat) { box(x - 12, y - 34 + bob * .3, 24, 10, "#fff8ea", 5); box(x - 9, y - 42 + bob * .3, 18, 10, "#fff8ea", 6); }

  // hat
  if (cap) {
    const hy = y - 24 + bob * .3;
    if (cap.style === "capback") {
      ctx.fillStyle = cap.c;
      ctx.beginPath(); ctx.arc(x, hy, 11.5, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillRect(x - 11.5, hy, 23, 4);
      ctx.fillStyle = cap.c;                                   // brim points backwards
      rr(x - dv[0] * 15 - 7, hy - dv[1] * 9 - 2, 14, 8, 4); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.fillRect(x - 4, hy - 9, 8, 4);
    } else if (cap.style === "beanie") {
      ctx.fillStyle = cap.c;
      ctx.beginPath(); ctx.arc(x, hy - 1, 12, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillRect(x - 12, hy - 1, 24, 6);
      ctx.fillStyle = "rgba(255,255,255,.3)"; ctx.fillRect(x - 12, hy + 1, 24, 3);
      ctx.fillStyle = cap.c;
      ctx.beginPath(); ctx.arc(x, hy - 13, 4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = cap.c;                                    // bucket
      ctx.beginPath(); ctx.ellipse(x, hy + 4, 17, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x, hy, 11, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillRect(x - 11, hy, 22, 4);
    }
  }

  // face
  if (dir !== "up") {
    const ox = dir === "left" ? -3 : dir === "right" ? 3 : 0;
    if (shades) {
      ctx.fillStyle = shades.c;
      rr(x - 9 + ox, y - 24 + bob * .3, 18, 6, 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.3)";
      ctx.fillRect(x - 7 + ox, y - 23 + bob * .3, 4, 2);
    } else {
      ctx.fillStyle = "#2b2018";
      ctx.beginPath(); ctx.arc(x - 4 + ox, y - 21 + bob * .3, 1.7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 4 + ox, y - 21 + bob * .3, 1.7, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function heroFit() {
  return {
    hat: worn("hat"), top: worn("top"), shoes: worn("shoes"),
    chain: worn("chain"), pack: worn("pack"), shades: worn("shades")
  };
}
function drawHero() {
  if (hero.swim) {

    ripple(hero.x, hero.y + 8, 13 + Math.sin(T * 3 + 1) * 2, .35);

    ctx.beginPath(); ctx.ellipse(hero.x, hero.y + 4 + bob, 15, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = S.look.skin;
    ctx.beginPath(); ctx.arc(hero.x, hero.y - 6 + bob, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = S.look.hair;
    ctx.beginPath(); ctx.arc(hero.x, hero.y - 9 + bob, 10, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = S.look.skin;
    const arm = Math.sin(T * 5) * 6;
    ctx.beginPath(); ctx.ellipse(hero.x - 15, hero.y + arm, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hero.x + 15, hero.y - arm, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2b2018";
    ctx.beginPath(); ctx.arc(hero.x - 4, hero.y - 6 + bob, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(hero.x + 4, hero.y - 6 + bob, 1.7, 0, Math.PI * 2); ctx.fill();

function waterUnderfoot() {
  if (!room) return null;
  for (const pr of room.props) {

    if (hero.x > pr.x + 6 && hero.x < pr.x + pr.w - 6 && hero.y > pr.y + 6 && hero.y < pr.y + pr.h - 6) return pr;
  }
  return null;
}

function drawPetAt(x, y, pet) { drawPetBody(x, y, pet); }
function drawPetBody(x, y, pet) {
  if (!pet) return;
  const c = PET_FUR[pet.id] || "#c98a4b";
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.ellipse(x, y + 10, 11, 5, 0, 0, Math.PI * 2); ctx.fill();
  if (pet.id === "bunny") {                                   // round, ears up, cotton tail
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.ellipse(x - 2, y + 1, 13, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 10, y - 6, 8, 0, Math.PI * 2); ctx.fill();
    [[-4, "#e8dccb"], [4, "#e8dccb"]].forEach(e2 => {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(x + 8 + e2[0], y - 20, 3.4, 10, e2[0] * .04, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f2b8c6";
      ctx.beginPath(); ctx.ellipse(x + 8 + e2[0], y - 20, 1.6, 6.5, e2[0] * .04, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = "#fff8ea";
    ctx.beginPath(); ctx.arc(x - 14, y + 2, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2b2018";
    ctx.beginPath(); ctx.arc(x + 13, y - 7, 1.7, 0, Math.PI * 2); ctx.fill();
    return;
  }
  box(x - 12, y - 6, 24, 15, c, 7);
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(x + 12, y - 8, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 7, y - 15); ctx.lineTo(x + 11, y - 22); ctx.lineTo(x + 15, y - 14); ctx.fill();
  ctx.fillStyle = "#2b2018";
  ctx.beginPath(); ctx.arc(x + 15, y - 9, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = c; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x - 12, y - 4); ctx.lineTo(x - 19, y - 12); ctx.stroke();
}

/* ---------------------------- city draw ---------------------------- */
function drawCityScene() {
  const cx = mode === "drive" ? car.x : hero.x, cy = mode === "drive" ? car.y : hero.y;
  const camX = clamp(cx - VW / 2, 0, Math.max(0, WORLD.w - VW));
  const camY = clamp(cy - VH / 2, 0, Math.max(0, WORLD.h - VH));
  ctx.save(); ctx.translate(-camX, -camY);

  ctx.fillStyle = "#87ab63"; ctx.fillRect(camX, camY, VW, VH);
  ctx.fillStyle = "rgba(255,255,255,.05)";
  for (let gx = Math.floor(camX / 90) * 90; gx < camX + VW; gx += 90)
    for (let gy = Math.floor(camY / 90) * 90; gy < camY + VH; gy += 90)
      if (((gx / 90) + (gy / 90)) % 2 === 0) ctx.fillRect(gx, gy, 90, 90);

  const park = PLACES.find(p => p.id === "park");
  ctx.fillStyle = "#6fa855"; rr(park.x, park.y, park.w, park.h, 20); ctx.fill();
  ctx.fillStyle = "#4f97c9";
  ctx.beginPath(); ctx.ellipse(park.x + 340, park.y + 190, 78, 46, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "#4b4f5c";
  ROADS_H.forEach(y => ctx.fillRect(0, y - ROAD_W / 2, WORLD.w, ROAD_W));
  ROADS_V.forEach(x => ctx.fillRect(x - ROAD_W / 2, 0, ROAD_W, WORLD.h));

  ctx.fillStyle = "#cfc9b8";
  ROADS_H.forEach(y => { ctx.fillRect(0, y - ROAD_W / 2 - 12, WORLD.w, 12); ctx.fillRect(0, y + ROAD_W / 2, WORLD.w, 12); });
  ROADS_V.forEach(x => { ctx.fillRect(x - ROAD_W / 2 - 12, 0, 12, WORLD.h); ctx.fillRect(x + ROAD_W / 2, 0, 12, WORLD.h); });

  ctx.strokeStyle = "#f2d857"; ctx.lineWidth = 4; ctx.setLineDash([26, 24]);
  ROADS_H.forEach(y => { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD.w, y); ctx.stroke(); });
  ROADS_V.forEach(x => { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.h); ctx.stroke(); });
  ctx.setLineDash([]);

  ctx.fillStyle = "rgba(255,255,255,.72)";
  ROADS_H.forEach(y => ROADS_V.forEach(x => {
    for (let i = -2; i <= 2; i++) {
      ctx.fillRect(x - ROAD_W / 2 - 26, y + i * 18 - 5, 20, 10);
      ctx.fillRect(x + ROAD_W / 2 + 6, y + i * 18 - 5, 20, 10);
      ctx.fillRect(x + i * 18 - 5, y - ROAD_W / 2 - 26, 10, 20);
      ctx.fillRect(x + i * 18 - 5, y + ROAD_W / 2 + 6, 10, 20);
    }
  }));

  HOUSES.forEach(h => drawBuilding(h.x, h.y, h.w, h.h, h.wall, h.roof, null, null));
  PLACES.forEach(p => { if (!p.isPark) drawBuilding(p.x, p.y, p.w, p.h, p.wall, p.roof, p.name, p.head); });

  ctx.fillStyle = "#3f6b33"; rr(park.x + park.w / 2 - 92, park.y + park.h + 4, 184, 34, 10); ctx.fill();
  ctx.fillStyle = "#fff4e2"; ctx.font = '700 17px "Baloo 2", sans-serif'; ctx.textAlign = "center";
  ctx.fillText("Riverside Park", park.x + park.w / 2, park.y + park.h + 28);

  TREES.forEach(t => {
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.beginPath(); ctx.ellipse(t.x + 5, t.y + 8, t.r, t.r * .68, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3f7a34";
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.14)";
    ctx.beginPath(); ctx.arc(t.x - t.r * .3, t.y - t.r * .3, t.r * .45, 0, Math.PI * 2); ctx.fill();
  });

  // door mats so it's obvious where you walk in
  PLACES.forEach(p => {
    ctx.fillStyle = focus && focus.place === p ? "#ffd166" : "#c9a06a";
    rr(p.door.x - 34, p.door.y - 14, 68, 26, 8); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.font = '700 11px "Baloo 2", sans-serif'; ctx.textAlign = "center";
    ctx.fillText("ENTER", p.door.x, p.door.y + 4);
  });

  traffic.forEach(t => drawCar(t.x, t.y, t.vx !== 0 ? (t.vx > 0 ? 0 : Math.PI) : (t.vy > 0 ? Math.PI / 2 : -Math.PI / 2), t.c, false));
  drawPeers("city");
  const mc0 = myCar();
  drawCar(car.x, car.y, car.a, mc0.color, true, mc0.shape, mc0.trim, S.pets.slice(0, mc0.seats), Math.abs(car.sp));
  if (mode === "walk") { S.pets.forEach((pt, i) => { if (petTrail[i]) drawPetBody(petTrail[i].x, petTrail[i].y, pt); }); drawHero(); }

  const d = darkness();
  if (d > .01) {
    ctx.fillStyle = "rgba(18,24,58," + d + ")"; ctx.fillRect(camX, camY, VW, VH);
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    ROADS_H.forEach(y => { for (let x = 120; x < WORLD.w; x += 320) glow(x, y - ROAD_W / 2 - 12, 90, "rgba(255,214,110,.35)"); });
    PLACES.concat(HOUSES).forEach(p => { if (!p.isPark) glow(p.x + p.w / 2, p.y + p.h - 10, 80, "rgba(255,196,120,.28)"); });
    if (mode === "drive") glow(car.x + Math.cos(car.a) * 46, car.y + Math.sin(car.a) * 46, 78, "rgba(255,246,210,.4)");
    else glow(hero.x, hero.y, 60, "rgba(255,246,210,.25)");
    ctx.restore();
  }
  ctx.restore();
}

function drawBuilding(x, y, w, h, wall, roof, name, signColor) {
  ctx.fillStyle = "rgba(0,0,0,.22)"; rr(x + 7, y + 10, w, h, 12); ctx.fill();
  ctx.fillStyle = roof; rr(x, y, w, h, 12); ctx.fill();
  const band = Math.min(46, h * .34);
  ctx.fillStyle = wall; rr(x + 6, y + h - band, w - 12, band - 4, 8); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.22)";
  const cols = Math.max(2, Math.floor(w / 62));
  for (let i = 0; i < cols; i++) ctx.fillRect(x + 14 + i * ((w - 28) / cols), y + 14, ((w - 28) / cols) - 12, 16);
  ctx.fillStyle = "#5b4632"; ctx.fillRect(x + w / 2 - 15, y + h - 24, 30, 22);
  ctx.fillStyle = "#ffd166"; ctx.fillRect(x + w / 2 + 6, y + h - 15, 4, 4);
  if (name) {
    ctx.fillStyle = signColor;
    rr(x + w / 2 - Math.max(60, name.length * 6.4), y + h - band - 22, Math.max(120, name.length * 12.8), 26, 8); ctx.fill();
    ctx.fillStyle = "#fff4e2"; ctx.font = '700 16px "Baloo 2", sans-serif'; ctx.textAlign = "center";
    ctx.fillText(name, x + w / 2, y + h - band - 3);
  }
}

/* ---------------------------------------------------------------------
   Eight vehicles, eight silhouettes. Drawn in car space: +x is forward,
   so ears, scarves and exhaust all trail toward -x.
   --------------------------------------------------------------------- */
const PET_FUR = { dog: "#c98a4b", cat: "#8a8a8a", fish: "#ff8c42", hamster: "#e0b06a", parrot: "#5bc46b", bunny: "#e8dccb" };

function drawRider(px, py, pet, speed, opts) {
  opts = opts || {};
  const fur = PET_FUR[pet.id] || "#c98a4b";
  const flap = clamp(speed / 6, 0, 1);
  const bob = Math.sin(T * 6 + px) * 1.2;
  ctx.save();
  ctx.translate(px, py + bob);
  ctx.scale(.72, .72);

  if (opts.scarf) {                                  // scarf streams out behind
    ctx.strokeStyle = "#e0344f"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-3, 3);
    for (let i = 1; i <= 3; i++) {
      ctx.lineTo(-3 - i * (5 + flap * 4), 3 + Math.sin(T * 9 + i) * (1.5 + flap * 3));
    }
    ctx.stroke();
  }

  if (pet.id === "fish") {                            // travels in his bowl
    ctx.fillStyle = "rgba(140,200,225,.85)";
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff8c42";
    ctx.beginPath(); ctx.ellipse(1, 1, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore(); return;
  }

  ctx.fillStyle = fur;                                // ears, swept back at speed
  const ear = (pet.id === "bunny" ? 14 : 7) + flap * 9;
  ctx.beginPath(); ctx.moveTo(-1, -6); ctx.lineTo(-1 - ear, -9 - flap * 4); ctx.lineTo(1, -1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-1, 6); ctx.lineTo(-1 - ear, 9 + flap * 4); ctx.lineTo(1, 1); ctx.fill();

  ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();   // head
  ctx.fillStyle = "rgba(255,255,255,.18)";
  ctx.beginPath(); ctx.arc(2, -2, 5, 0, Math.PI * 2); ctx.fill();

  if (pet.id === "parrot") { ctx.fillStyle = "#e0a63f"; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(15, 2); ctx.lineTo(7, 5); ctx.fill(); }

  if (opts.goggles) {
    ctx.strokeStyle = "#5b4632"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-8, 4); ctx.stroke();
    ctx.fillStyle = "#2b2f3e";
    ctx.beginPath(); ctx.arc(3, -4.5, 4.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, 4.5, 4.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#bfe0ff";
    ctx.beginPath(); ctx.arc(4.4, -5.5, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4.4, 3.5, 1.8, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = "#2b2018";
    ctx.beginPath(); ctx.arc(4, -3.5, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, 3.5, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, 0, 2.2, 0, Math.PI * 2); ctx.fill();
  }
  if (speed > 3.2) {                                   // tongue out, obviously
    ctx.fillStyle = "#ff9ab0";
    ctx.beginPath(); ctx.ellipse(6, 4 + flap, 3, 5, .5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawCar(x, y, a, color, isPlayer, shape, trim, pets, speed) {
  const sh = shape || "sedan", tr = trim || "#2b2f3e";
  const sp = speed || 0;
  const L = { hatch: 42, racer: 48, bike: 40, truck: 60, convert: 48, van: 62, sport: 54, monster: 52, sedan: 44 }[sh] || 44;
  const W = { hatch: 26, racer: 26, bike: 16, truck: 30, convert: 28, van: 34, sport: 30, monster: 34, sedan: 26 }[sh] || 26;
  const riders = pets || [];

  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = "rgba(0,0,0,.25)";
  rr(-L / 2 + 3, -W / 2 + 4, L, W, 8); ctx.fill();

  // ---- wheels ----
  const wr = sh === "monster" ? 13 : sh === "van" || sh === "truck" ? 7 : sh === "bike" ? 7 : 5.5;
  ctx.fillStyle = "#1d1f27";
  const axle = [[-L * .3, 1], [L * .3, 1]];
  if (sh === "bike") {
    axle.forEach(w => { ctx.beginPath(); ctx.ellipse(w[0], 0, wr + 3, wr - 1, 0, 0, Math.PI * 2); ctx.fill(); });
  } else {
    axle.forEach(w => {
      ctx.beginPath(); ctx.ellipse(w[0], -W / 2 - wr + 3, wr + 3, wr, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(w[0], W / 2 + wr - 3, wr + 3, wr, 0, 0, Math.PI * 2); ctx.fill();
    });
    if (sh === "monster") {
      ctx.fillStyle = "#4a4d5c";
      axle.forEach(w => {
        ctx.beginPath(); ctx.arc(w[0], -W / 2 - wr + 3, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(w[0], W / 2 + wr - 3, 5, 0, Math.PI * 2); ctx.fill();
      });
    }
  }

  // ---- body ----
  if (sh === "bike") {
    ctx.fillStyle = tr;                                   // sidecar pod on the right
    rr(-10, W / 2 - 2, 30, 22, 10); ctx.fill();
    ctx.fillStyle = "#1d1f27";
    ctx.beginPath(); ctx.ellipse(-8, W / 2 + 20, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.25)"; rr(-6, W / 2 + 1, 22, 15, 7); ctx.fill();
    ctx.fillStyle = color; rr(-L / 2, -W / 2, L, W, 8); ctx.fill();
    ctx.fillStyle = "#2b2f3e"; rr(-6, -W / 2 + 2, 16, W - 4, 5); ctx.fill();   // seat
    ctx.strokeStyle = "#c8ccd6"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(L * .28, -W / 2 - 5); ctx.lineTo(L * .28, W / 2 + 5); ctx.stroke();
    ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(L / 2 - 2, 0, 4, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = color;
    rr(-L / 2, -W / 2, L, W, sh === "sport" ? 13 : sh === "van" ? 5 : 8); ctx.fill();
  }

  if (sh === "hatch") {
    ctx.fillStyle = "rgba(255,255,255,.6)"; rr(-4, -W / 2 + 4, 14, W - 8, 4); ctx.fill();
    ctx.fillStyle = tr;
    rr(-L / 2 + 3, -W / 2 + 3, 7, W - 6, 3); ctx.fill();
    [[-12, -6, 5], [6, 7, 4], [14, -9, 3]].forEach(d => {     // rust patches
      ctx.beginPath(); ctx.arc(d[0], d[1], d[2], 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = "#8d6a4a"; ctx.fillRect(-L / 2 - 3, -W / 2 + 6, 4, W - 12);
  } else if (sh === "racer") {
    ctx.fillStyle = tr;
    ctx.fillRect(-L / 2, -6, L, 4); ctx.fillRect(-L / 2, 2, L, 4);
    ctx.fillStyle = "rgba(255,255,255,.62)"; rr(-4, -W / 2 + 4, 15, W - 8, 4); ctx.fill();
    ctx.fillStyle = color; rr(-L / 2 - 6, -W / 2 + 3, 8, W - 6, 3); ctx.fill();   // spoiler
    ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.lineWidth = 2; ctx.strokeRect(-L / 2 - 6, -W / 2 + 3, 8, W - 6);
  } else if (sh === "truck") {
    ctx.fillStyle = tr; rr(L * .04, -W / 2 + 2, L * .42, W - 4, 5); ctx.fill();      // cab roof
    ctx.fillStyle = "rgba(255,255,255,.62)"; rr(L * .1, -W / 2 + 5, 13, W - 10, 4); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.3)"; rr(-L / 2 + 4, -W / 2 + 4, L * .42, W - 8, 4); ctx.fill();  // open bed
    ctx.fillStyle = "#ffd166"; ctx.fillRect(L * .06, -W / 2 - 3, 16, 4);            // roof light bar
  } else if (sh === "convert") {
    ctx.fillStyle = "#2b2018"; rr(-14, -W / 2 + 4, 26, W - 8, 5); ctx.fill();        // open cabin
    ctx.fillStyle = tr; rr(-12, -W / 2 + 6, 10, W - 12, 4); ctx.fill();              // seats
    ctx.strokeStyle = "rgba(220,240,255,.85)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(13, -W / 2 + 4); ctx.lineTo(13, W / 2 - 4); ctx.stroke();
    ctx.fillStyle = "#f4f4f4"; ctx.fillRect(-L / 2 + 2, -W / 2 + 4, 5, W - 8);
  } else if (sh === "van") {
    ctx.fillStyle = tr;                                                              // awning stripes
    for (let i = 0; i < 5; i++) ctx.fillRect(-L / 2 + 8 + i * 11, -W / 2 - 5, 6, 6);
    ctx.fillStyle = "rgba(255,255,255,.7)"; rr(L * .18, -W / 2 + 4, 13, W - 8, 3); ctx.fill();
    ctx.fillStyle = "#bfe0ff"; rr(-L / 2 + 10, W / 2 - 9, 24, 7, 3); ctx.fill();     // serving window
    ctx.fillStyle = tr;                                                              // cone on the roof
    ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(2, 0); ctx.lineTo(-6, 4); ctx.fill();
    ctx.fillStyle = "#fff4e2"; ctx.beginPath(); ctx.arc(-8, 0, 5, 0, Math.PI * 2); ctx.fill();
  } else if (sh === "sport") {
    ctx.fillStyle = tr;
    rr(-L / 2 - 7, -W / 2 + 2, 9, W - 4, 3); ctx.fill();                              // big rear wing
    ctx.fillRect(-4, -W / 2 + 1, 10, 4); ctx.fillRect(-4, W / 2 - 5, 10, 4);          // side vents
    ctx.fillStyle = "rgba(255,255,255,.55)"; rr(-2, -W / 2 + 6, 16, W - 12, 6); ctx.fill();
    ctx.fillStyle = "#fff6d2"; ctx.fillRect(L / 2 - 6, -W / 2 + 5, 5, 6); ctx.fillRect(L / 2 - 6, W / 2 - 11, 5, 6);
  } else if (sh === "monster") {
    ctx.fillStyle = tr;
    ctx.beginPath(); ctx.moveTo(-L / 2 + 2, -W / 2 + 4); ctx.lineTo(4, -2); ctx.lineTo(-L / 2 + 2, 4); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.6)"; rr(2, -W / 2 + 6, 14, W - 12, 4); ctx.fill();
    ctx.strokeStyle = "#c8ccd6"; ctx.lineWidth = 4;                                   // roll bar
    ctx.beginPath(); ctx.moveTo(-2, -W / 2 + 3); ctx.lineTo(-2, W / 2 - 3); ctx.stroke();
  } else {
    ctx.fillStyle = "rgba(255,255,255,.62)"; rr(-6, -W / 2 + 4, 15, W - 8, 4); ctx.fill();
    ctx.fillStyle = tr; rr(-L / 2 + 3, -W / 2 + 3, 8, W - 6, 3); ctx.fill();
  }

  if (isPlayer && sh !== "sport") {
    ctx.fillStyle = "#fff6d2";
    ctx.fillRect(L / 2 - 3, -W / 2 + 4, 4, 5); ctx.fillRect(L / 2 - 3, W / 2 - 9, 4, 5);
  }

  // ---- the animals ----
  if (riders.length) {
    if (sh === "bike") {
      drawRider(3, W / 2 + 8, riders[0], sp, { goggles: true, scarf: true });
    } else if (sh === "truck") {
      riders.slice(0, 3).forEach((pet, i) => drawRider(-L * .34 + i * 11, (i - 1) * 8, pet, sp, {}));
    } else if (sh === "van") {
      riders.slice(0, 4).forEach((pet, i) => drawRider(-L * .24 + Math.floor(i / 2) * 16, (i % 2 ? 1 : -1) * (W / 2 - 4), pet, sp, {}));
    } else if (sh === "convert") {
      riders.slice(0, 2).forEach((pet, i) => drawRider(-9 + i * 10, (i % 2 ? 1 : -1) * 6, pet, sp, {}));
    } else {
      riders.slice(0, 2).forEach((pet, i) => drawRider(-3 - i * 11, (i % 2 ? -1 : 1) * (W / 2 - 3), pet, sp, {}));
    }
  }
  ctx.restore();
}
/* ------------------------------- water -------------------------------
   One water renderer for the pool, the zoo lagoon, the dolphin cove,
   the pond and the indoor pool at home: a depth gradient, drifting
   ripple bands, moving sparkles, and a wet coping edge. */
function drawWater(x, y, w, h, o) {
  o = o || {};
  ctx.save();
  ctx.beginPath();
  if (o.round) ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
  else rr(x, y, w, h, o.radius === undefined ? 24 : o.radius);
  ctx.clip();

  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, o.shallow || "#8fe0ee");
  g.addColorStop(.4, o.mid || "#3fa8d8");
  g.addColorStop(1, o.deep || "#1c5f96");
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);

  // ripple bands
  ctx.globalAlpha = .16; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.lineJoin = "round";
  for (let i = 0; i < 10; i++) {
    const yy = y + ((i * 41 + T * 13) % (h + 60)) - 30;
    ctx.beginPath();
    for (let xx = x - 10; xx <= x + w + 10; xx += 14) {
      const off = Math.sin(xx * .028 + T * 1.3 + i) * 5 + Math.sin(xx * .011 - T * .7) * 3;
      xx <= x - 10 ? ctx.moveTo(xx, yy + off) : ctx.lineTo(xx, yy + off);
    }
    ctx.stroke();
  }
  // deeper shimmer
  ctx.globalAlpha = .12; ctx.strokeStyle = "#0b3d63"; ctx.lineWidth = 6;
  for (let i = 0; i < 5; i++) {
    const yy = y + ((i * 83 - T * 9) % (h + 80)) - 20;
    ctx.beginPath();
    for (let xx = x - 10; xx <= x + w + 10; xx += 18) {
      const off = Math.sin(xx * .019 - T * .9 + i * 2) * 7;
      xx <= x - 10 ? ctx.moveTo(xx, yy + off) : ctx.lineTo(xx, yy + off);
    }
    ctx.stroke();
  }
  // sparkles
  for (let i = 0; i < 16; i++) {
    const sx = x + ((i * 97.3 + Math.sin(T * .6 + i) * 26 + w) % w);
    const sy = y + ((i * 61.7 + T * 7 + Math.cos(T * .5 + i * 1.3) * 18 + h) % h);
    ctx.globalAlpha = .35 + Math.abs(Math.sin(T * 1.7 + i)) * .4;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.ellipse(sx, sy, 7, 2.2, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (o.lanes) {
    ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 5; ctx.setLineDash([16, 12]);
    for (let i = 1; i < 5; i++) {
      const ly = y + (h / 5) * i;
      ctx.beginPath(); ctx.moveTo(x + 10, ly); ctx.lineTo(x + w - 10, ly); ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  ctx.restore();

  ctx.strokeStyle = o.rim || "#eef4f7"; ctx.lineWidth = 9;
  ctx.beginPath();
  if (o.round) ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
  else rr(x, y, w, h, o.radius === undefined ? 24 : o.radius);
  ctx.stroke();
}

function ripple(x, y, r, a) {
  ctx.strokeStyle = "rgba(255,255,255," + a + ")"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(x, y, r, r * .42, 0, 0, Math.PI * 2); ctx.stroke();
}

function drawDolphin(cx, cy, rx, ry, phase, speed) {
  const t = T * speed + phase;
  const x = cx + Math.cos(t) * rx, y = cy + Math.sin(t) * ry;
  const ang = Math.atan2(Math.cos(t) * ry, -Math.sin(t) * rx);
  const jump = Math.max(0, Math.sin(t * 1.0 + phase * 2) - .93) * 14;   // an arc now and then
  ctx.save(); ctx.translate(x, y - jump * 3); ctx.rotate(ang);
  if (jump > 0) { ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(0, jump * 3, 22, 7, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = "rgba(255,255,255,.22)";
  ctx.beginPath(); ctx.ellipse(-30, 0, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3d5f7d";
  ctx.beginPath(); ctx.ellipse(0, 0, 27, 10.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#6d90ac";
  ctx.beginPath(); ctx.ellipse(-1, -3, 23, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#dbe7ef";
  ctx.beginPath(); ctx.ellipse(3, 5, 18, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3d5f7d";
  ctx.beginPath(); ctx.moveTo(-2, -6); ctx.lineTo(-12, -20); ctx.lineTo(4, -7); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(-36, -9); ctx.lineTo(-33, 0); ctx.lineTo(-36, 9); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(20, 2); ctx.quadraticCurveTo(31, 4, 30, 8); ctx.quadraticCurveTo(24, 8, 20, 6); ctx.fill();
  ctx.restore();
  if (jump < .3) ripple(x, y + 4, 26 + Math.sin(T * 3 + phase) * 3, .32);
}

function drawOtter(x, y, phase) {
  const bob = Math.sin(T * 1.4 + phase) * 3, roll = Math.sin(T * .7 + phase) * .25;
  ctx.save(); ctx.translate(x, y + bob); ctx.rotate(roll);
  ctx.fillStyle = "#7b5232";
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 9, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "#a47b52";
  ctx.beginPath(); ctx.ellipse(2, 2, 17, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#7b5232";
  ctx.beginPath(); ctx.arc(19, -3, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(15, -9, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(23, -9, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#2b2018";
  ctx.beginPath(); ctx.arc(17, -4, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(23, -4, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#5e3c22";
  ctx.beginPath(); ctx.ellipse(-2, -6, 5, 3, 0, 0, Math.PI * 2); ctx.fill();   // little paws
  ctx.beginPath(); ctx.ellipse(-2, 6, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ripple(x, y + bob + 3, 24, .28);
}

function drawPenguin(x, y, phase) {
  const wob = Math.sin(T * 2 + phase) * 2;
  ctx.save(); ctx.translate(x + wob, y);
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.ellipse(0, 16, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#23262f";
  ctx.beginPath(); ctx.ellipse(0, 0, 12, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#f4f1e8";
  ctx.beginPath(); ctx.ellipse(0, 3, 8, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#23262f";
  ctx.beginPath(); ctx.arc(0, -14, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#e0a63f";
  ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(9, -10); ctx.lineTo(0, -8); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(-3, -16, 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(3, -16, 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* -------------------------- interior draw -------------------------- */
let speech = null;   // { who, text, until }
function say(who, text) { speech = { who: who, text: text, until: performance.now() + 3600 }; }

function drawRoom() {
  const camX = room.w > VW ? clamp(hero.x - VW / 2, 0, room.w - VW) : -(VW - room.w) / 2;
  const camY = room.h > VH ? clamp(hero.y - VH / 2, 0, room.h - VH) : -(VH - room.h) / 2;
  ctx.save(); ctx.translate(-camX, -camY);

  ctx.fillStyle = "#11162a"; ctx.fillRect(camX, camY, VW, VH);
  ctx.fillStyle = room.ground || room.floor;
  ctx.fillRect(0, 0, room.w, room.h);

  // floors — one per section, so a house can grow room by room
  const secs = room.sections || [{ x: 0, y: 0, w: room.w, h: room.h, floor: room.floor, floorAlt: room.floorAlt }];
  secs.forEach(sec => {
    ctx.save();
    ctx.beginPath(); rr(sec.x, sec.y, sec.w, sec.h, 10); ctx.clip();
    for (let x = sec.x; x < sec.x + sec.w; x += 60) {
      for (let y = sec.y; y < sec.y + sec.h; y += 60) {
        ctx.fillStyle = (Math.round(x / 60) + Math.round(y / 60)) % 2 === 0 ? (sec.floor || room.floor) : (sec.floorAlt || room.floorAlt);
        ctx.fillRect(x, y, 60, 60);
      }
    }
    ctx.restore();
    if (room.sections) {
      ctx.strokeStyle = room.wall; ctx.lineWidth = 9;
      rr(sec.x, sec.y, sec.w, sec.h, 10); ctx.stroke();
      if (sec.label) {
        ctx.fillStyle = "rgba(0,0,0,.32)";
        ctx.font = '700 13px "Baloo 2", sans-serif';
        ctx.textAlign = "left";
        ctx.fillText(sec.label, sec.x + 14, sec.y + 24);
      }
    }
  });
  // zone rugs
  (room.zones || []).forEach(z => {
    ctx.globalAlpha = .42; box(z.x, z.y, z.w, z.h, z.c, 16); ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.font = '700 13px "Baloo 2", sans-serif'; ctx.textAlign = "left";
    ctx.fillText(z.label, z.x + 12, z.y + 22);
  });
  // park trees
  (room.trees || []).forEach(t => {
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.beginPath(); ctx.ellipse(t[0] + 5, t[1] + 8, 26, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3f7a34"; ctx.beginPath(); ctx.arc(t[0], t[1], 26, 0, Math.PI * 2); ctx.fill();
  });

  // walls (single-room places only — a growing house draws its own outlines)
  if (!room.sections) {
    ctx.fillStyle = room.wall;
    ctx.fillRect(0, 0, room.w, 18); ctx.fillRect(0, room.h - 18, room.w, 18);
    ctx.fillRect(0, 0, 18, room.h); ctx.fillRect(room.w - 18, 0, 18, room.h);
  }

  // exit mat
  const e = room.exit;
  ctx.fillStyle = focus && focus.exit ? "#ffd166" : "#c9a06a";
  rr(e.x, e.y, e.w, e.h, 8); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.font = '700 12px "Baloo 2", sans-serif'; ctx.textAlign = "center";
  ctx.fillText("WAY OUT", e.x + e.w / 2, e.y + e.h / 2 + 4);

  room.props.forEach(p => drawProp(p, focus && focus.prop === p));
  if (room.npc) { drawNu(room.npc.x, room.npc.y); }
  drawPeers(roomId(room));

  if (room === ROOMS.home) S.pets.forEach((pt, i) => { if (petTrail[i]) drawPetBody(petTrail[i].x, petTrail[i].y, pt); });
  drawHero();

  // speech bubble over Nu
  if (speech && performance.now() < speech.until && room.npc) {
    bubble(room.npc.x, room.npc.y - 34, speech.text);
  } else if (speech && performance.now() >= speech.until) speech = null;

  const d = darkness();
  if (d > .01 && room.outdoor) { ctx.fillStyle = "rgba(18,24,58," + d + ")"; ctx.fillRect(camX, camY, VW, VH); }
  ctx.restore();
}

function bubble(x, tipY, text) {
  ctx.font = '600 14px "Figtree", sans-serif'; ctx.textAlign = "center";
  const maxW = 260, words = text.split(" "), lines = [];
  let cur = "";
  words.forEach(word => {
    const t = cur ? cur + " " + word : word;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = word; } else cur = t;
  });
  if (cur) lines.push(cur);
  let wide = 0;
  lines.forEach(l => { wide = Math.max(wide, ctx.measureText(l).width); });
  const w = wide + 26, h = lines.length * 19 + 18;
  const top = Math.max(8, tipY - 12 - h);
  const bx = clamp(x - w / 2, 8, Math.max(8, room.w - w - 8));
  ctx.fillStyle = "rgba(255,244,226,.96)";
  rr(bx, top, w, h, 12); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 8, top + h - 1); ctx.lineTo(x + 8, top + h - 1); ctx.lineTo(x, top + h + 12); ctx.fill();
  ctx.fillStyle = "#27314f";
  lines.forEach((l, i) => ctx.fillText(l, bx + w / 2, top + 25 + i * 19));
}

/* ------------------------- prop illustrations ------------------------- */
function drawProp(p, hot) {
  const x = p.x, y = p.y, w = p.w, h = p.h;
  if (!p.walkable && !p.slim) shadow(x, y, w, h);
  switch (p.kind) {
    case "bed":
      box(x, y, w, h, "#a3673f", 10);
      box(x + 6, y + h * .42, w - 12, h * .54, S.bedMade ? "#7ac6e0" : "#c9c2b4", 8);
      box(x + 10, y + 10, w - 20, h * .3, "#fff4e2", 8);
      break;
    case "tv":
      box(x, y + h - 14, w, 14, "#4a3526", 4);
      box(x, y, w, h - 10, "#1b2138", 8);
      box(x + 8, y + 8, w - 16, h - 30, "#2f7fb0", 5);
      ctx.fillStyle = "#ffd166"; ctx.fillRect(x + 18, y + 20, 10, 10); ctx.fillRect(x + w - 34, y + 34, 10, 10);
      box(x + w / 2 - 16, y + h - 12, 32, 10, "#e05a5a", 4);
      break;
    case "demotv":
      box(x, y, w, h, "#1b2138", 8); box(x + 8, y + 8, w - 16, h - 16, "#3ad1c0", 6);
      break;
    case "fridge":
      box(x, y, w, h, "#dfe6ee", 10);
      ctx.fillStyle = "#b8c2cc"; ctx.fillRect(x, y + h * .45, w, 4);
      box(x + w - 16, y + 14, 6, 22, "#8a97a5", 3); box(x + w - 16, y + h * .55, 6, 22, "#8a97a5", 3);
      break;
    case "pantry":
      box(x, y, w, h, "#a3673f", 8);
      ctx.fillStyle = "#e0b84f"; ctx.fillRect(x + 12, y + 12, 24, 30);
      ctx.fillStyle = "#e07a9a"; ctx.fillRect(x + 44, y + 16, 20, 26);
      ctx.fillStyle = "#8ad16a"; ctx.fillRect(x + 72, y + 14, 22, 28);
      break;
    case "sink":
      box(x, y, w, h, "#cfd6de", 8);
      box(x + 10, y + 10, w - 20, h - 20, "#9fb0be", 6);
      ctx.strokeStyle = "#8a97a5"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x + w / 2, y + 6); ctx.lineTo(x + w / 2, y - 10); ctx.lineTo(x + w / 2 + 16, y - 10); ctx.stroke();
      break;
    case "table":
      box(x, y, w, h, "#b5793f", 12);
      box(x + w / 2 - 26, y + h / 2 - 18, 52, 36, "#e9d9b8", 8);
      ctx.fillStyle = "#e07a9a"; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 11, 0, Math.PI * 2); ctx.fill();
      break;
    case "shower":
      box(x, y, w, h, "#bfe0e8", 10);
      ctx.strokeStyle = "#8fb8c4"; ctx.lineWidth = 3;
      for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(x + i * w / 5, y + 20); ctx.lineTo(x + i * w / 5, y + h - 10); ctx.stroke(); }
      box(x + w / 2 - 14, y + 6, 28, 12, "#8a97a5", 5);
      break;
    case "trash":
      box(x, y + 10, w, h - 10, "#6d7b8a", 6);
      box(x - 4, y, w + 8, 12, "#5a6774", 4);
      break;
    case "couch":
      box(x, y, w, h, "#5f7fa8", 12);
      box(x + 8, y + 8, (w - 24) / 2, h - 20, "#7a99bf", 8);
      box(x + w / 2 + 4, y + 8, (w - 24) / 2, h - 20, "#7a99bf", 8);

/* ============================== MOVEMENT ============================== */
function onRoad(x, y) {
  for (const ry of ROADS_H) if (Math.abs(y - ry) < ROAD_W / 2) return true;
  for (const rx of ROADS_V) if (Math.abs(x - rx) < ROAD_W / 2) return true;
  return false;
}
function blockedWorld(x, y, pad) {
  const p2 = pad === undefined ? 14 : pad;
  const solids = PLACES.filter(p => !p.isPark).concat(HOUSES);
  for (const b of solids) if (x > b.x - p2 && x < b.x + b.w + p2 && y > b.y - p2 && y < b.y + b.h + p2) return true;
  return false;
}
function blockedRoom(x, y) {
  if (x < 34 || y < 34 || x > room.w - 34 || y > room.h - 26) return true;
  for (const p of room.props) {
    if (p.walkable) continue;   // water, paths, rink floor and empty lots are walk-on
    if (x > p.x - 16 && x < p.x + p.w + 16 && y > p.y - 8 && y < p.y + p.h + 20) return true;
  }
  return false;
}

function stepCar(dt) {
  const mc = myCar();
  const road = onRoad(car.x, car.y);
  const maxF = road ? mc.top : 1.7 * mc.grip;
  const accel = road ? mc.accel : mc.accel * .55 * mc.grip;
  if (S.fuel <= 0) car.sp *= .94;
  else if (keys.ArrowUp || keys.KeyW) car.sp += accel;
  else if (keys.ArrowDown || keys.KeyS) car.sp -= .26;
  car.sp *= .965;
  car.sp = clamp(car.sp, -2.4, maxF);
  if (Math.abs(car.sp) < .02) car.sp = 0;

  const turn = mc.turn * clamp(Math.abs(car.sp) / 2.6, .3, 1) * (car.sp < 0 ? -1 : 1);
  if (keys.ArrowLeft || keys.KeyA) car.a -= turn;
  if (keys.ArrowRight || keys.KeyD) car.a += turn;

  const nx = car.x + Math.cos(car.a) * car.sp, ny = car.y + Math.sin(car.a) * car.sp;
  if (!blockedWorld(nx, ny)) { car.x = clamp(nx, 22, WORLD.w - 22); car.y = clamp(ny, 22, WORLD.h - 22); }
  else if (!blockedWorld(nx, car.y)) { car.x = clamp(nx, 22, WORLD.w - 22); car.sp *= .82; }
  else if (!blockedWorld(car.x, ny)) { car.y = clamp(ny, 22, WORLD.h - 22); car.sp *= .82; }
  else car.sp *= -.3;

  if (myCar().sidecar && S.pets.length && Math.abs(car.sp) > 2) completeGoal("sidecarRide");
  if (mc.jingle && Math.abs(car.sp) > 1) vanJingle();
  const dist = Math.abs(car.sp);
  if (dist > .1 && S.fuel > 0) {
    S.fuel = Math.max(0, S.fuel - dist * .00042);
    if (S.fuel === 0) toast("Out of gas! Get out and walk to Fuel Up.", "bad");
  }
  advance((dt / 1000) * MIN_PER_SECOND);
}

function stepWalk(dt, inside) {
  let dx = 0, dy = 0;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (inside && blockedRoom(hero.x, hero.y)) {
    // wedged inside something — walk him back out to the doorway rather than
    // leaving him stuck (this is the safety net, not the normal path)
    const e = room.exit;
    hero.x += ((e.x + e.w / 2) - hero.x) * .12 * (dt / 16.7);
    hero.y += ((e.y - 34) - hero.y) * .12 * (dt / 16.7);
    hero.dir = "down";
    return;
  }
  hero.moving = (dx !== 0 || dy !== 0);
  const wet = inside ? waterUnderfoot() : null;
  hero.swim = !!wet;
  if (wet) {
    S.needs.fun = clamp(S.needs.fun + .022 * (dt / 16.7), 0, 100);
    S.needs.clean = clamp(S.needs.clean + .02 * (dt / 16.7), 0, 100);
    if (wet.id === "cove") completeGoal("dolphinSwim");
  }
  if (hero.moving) {
    const len = Math.hypot(dx, dy) || 1;
    const sp = (wet ? 2.3 : 3.1) * (dt / 16.7);
    const nx = hero.x + (dx / len) * sp, ny = hero.y + (dy / len) * sp;
    const bad = inside ? blockedRoom : (x, y) => blockedWorld(x, y, 18);
    if (!bad(nx, ny)) { hero.x = nx; hero.y = ny; }
    else if (!bad(nx, hero.y)) hero.x = nx;
    else if (!bad(hero.x, ny)) hero.y = ny;
    if (!inside) { hero.x = clamp(hero.x, 20, WORLD.w - 20); hero.y = clamp(hero.y, 20, WORLD.h - 20); }
    hero.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    hero.step += .22 * (dt / 16.7);
  } else hero.step = 0;

  // the pet trots after you
  if (petTrail.length !== S.pets.length) syncPets();
  petTrail.forEach((slot, i) => {
    const lead = i === 0 ? hero : petTrail[i - 1];
    const d = Math.hypot(lead.x - slot.x, lead.y - slot.y);
    if (d > (i === 0 ? 44 : 38)) {
      slot.x += (lead.x - slot.x) * .06 * (dt / 16.7);
      slot.y += (lead.y - slot.y) * .06 * (dt / 16.7);
    }
  });
  advance((dt / 1000) * MIN_PER_SECOND * 0.6);
}

/* ============================== FOCUS ============================== */
function updateFocus() {
  focus = null;
  if (mode === "drive") {
    let near = null, bd = 999;
    PLACES.forEach(p => {
      const d = Math.hypot(car.x - p.door.x, car.y - p.door.y);
      if (d < 110 && d < bd) { bd = d; near = p; }
    });
    focus = near
      ? { kind: "park-and-walk", place: near, title: "Park and hop out at " + near.name, chips: [] }
      : { kind: "getout", title: "Get out of the car", chips: [] };
    return;
  }
  if (mode === "walk") {
    let best = null, bd = 999;
    PLACES.forEach(p => {
      const d = Math.hypot(hero.x - p.door.x, hero.y - p.door.y);
      if (d < 60 && d < bd) { bd = d; best = { kind: "enter", place: p, title: "Go inside " + p.name, chips: [] }; }
    });
    // a door you're standing at beats the car parked beside it — you got
    // out to go in. The car only wins when you walk right up to it.
    const dc = Math.hypot(hero.x - car.x, hero.y - car.y);
    if (dc < 56 && dc + 25 < bd) best = { kind: "getin", title: "Get in the car", chips: [{ t: S.fuel.toFixed(1) + " gal", cls: S.fuel < 1 ? "cost" : "" }] };
    focus = best;
    return;
  }
  // inside
  const e = room.exit;
  if (hero.x > e.x - 30 && hero.x < e.x + e.w + 30 && hero.y > e.y - 40 && hero.y < e.y + e.h + 30) {
    focus = { kind: "leave", exit: true, title: "Go back outside", chips: [] };
    return;
  }
  let best = null, bd = 999;
  room.props.forEach(p => {
    if (!p.info) return;
    const cx = clamp(hero.x, p.x, p.x + p.w), cy = clamp(hero.y, p.y, p.y + p.h);
    const d = Math.hypot(hero.x - cx, hero.y - cy);
    if (d < 52 && d < bd) {
      const info = p.info();
      if (info) { bd = d; best = { kind: "use", prop: p, title: info.title, chips: info.chips || [], why: info.why }; }
    }
  });
  focus = best;
}

function interact() {
  if (paused) return;
  if (!focus) { sfxNope(); return; }
  if (focus.kind === "getout" || focus.kind === "park-and-walk") {
    mode = "walk";
    car.sp = 0;
    if (focus.place) { hero.x = focus.place.door.x; hero.y = focus.place.door.y + 34; }
    else {
      hero.x = car.x - Math.sin(car.a) * 36;
      hero.y = car.y + Math.cos(car.a) * 36;
      if (blockedWorld(hero.x, hero.y, 18)) { hero.x = car.x + Math.sin(car.a) * 36; hero.y = car.y - Math.cos(car.a) * 36; }
    }
    syncPets(hero.x - 20, hero.y + 24);
    hero.dir = "down"; beep(420, .09);
    return;
  }
  if (focus.kind === "getin") { mode = "drive"; beep(300, .1); return; }
  if (focus.kind === "enter") {
    room = ROOMS[focus.place.id];
    mode = "inside";
    hero.x = room.spawn.x; hero.y = room.spawn.y; hero.dir = "up";
    syncPets(hero.x - 24, hero.y + 20);
    document.getElementById("banner").textContent = room.name;
    if (room.npc) say("nu", room.npc.says());
    sfxStep();
    return;
  }
  if (focus.kind === "leave") {
    mode = "walk";
    const p = PLACES.find(pl => pl.id === roomId(room));
    hero.x = p.door.x; hero.y = p.door.y + 40;
    document.getElementById("banner").textContent = "Northgate";
    room = null; speech = null;
    sfxStep();
    return;
  }
  if (focus.kind === "use") {
    const info = focus.prop.info();
    if (info && info.why) { toast(info.why, "bad"); sfxNope(); return; }
    focus.prop.use();
    checkGoals();
    save();
  }
}
function roomId(r) { for (const k in ROOMS) if (ROOMS[k] === r) return k; return "home"; }
