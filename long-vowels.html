<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Long Vowel Chart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Long Vowel Chart: one long vowel sound per session, a box for each way to
   spell it. The coach fills her chart on a shared screen; each student fills
   their own. What a student types never leaves their laptop. */
:root{--bg:#f4f2fb;--card:#ffffff;--ink:#231f33;--muted:#615b75;--line:#dcd6ee;--accent:#5b3fc4;--accentInk:#ffffff;--mark:#ffe08a;--markInk:#4a3500;--ok:#1f7a40;--okBg:#e2f4e8;--warn:#8a5a00;--warnBg:#fff3d1;--soft:#ece8f8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15131f;--card:#1f1c2c;--ink:#ece8f7;--muted:#aaa3c0;--line:#352f4a;--accent:#a08bff;--accentInk:#160f2b;--mark:#6b5310;--markInk:#ffe9a8;--ok:#8fe0a6;--okBg:#183a24;--warn:#f4d27a;--warnBg:#3a2f12;--soft:#2a2540;color-scheme:dark}}
:root[data-theme=dark]{--bg:#15131f;--card:#1f1c2c;--ink:#ece8f7;--muted:#aaa3c0;--line:#352f4a;--accent:#a08bff;--accentInk:#160f2b;--mark:#6b5310;--markInk:#ffe9a8;--ok:#8fe0a6;--okBg:#183a24;--warn:#f4d27a;--warnBg:#3a2f12;--soft:#2a2540;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;padding-block:20px 160px;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
main{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h1{font:800 30px/1.1 "Baloo 2",system-ui,sans-serif;margin:0}
.status{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{font:800 20px "Baloo 2",system-ui,sans-serif;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 18px}
.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.sound{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.sound .v{font:800 76px/1 "Baloo 2",system-ui,sans-serif;color:var(--accent)}
.sound .n{font:800 34px/1.1 "Baloo 2",system-ui,sans-serif}
.sound .s{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.box h2{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pat{font:800 40px/1 "Baloo 2",system-ui,sans-serif;color:var(--accent)}
.kw{font-size:17px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1;align-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:12px;padding:4px 6px 4px 12px;font:700 24px/1.2 "Atkinson Hyperlegible",sans-serif}
.chip.check{background:var(--warnBg);outline:2px dashed var(--warn)}
.chip button{border:none;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:8px}
mark{background:var(--mark);color:var(--markInk);border-radius:3px;padding:0}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--bg);color:var(--ink);font-size:22px}
.add button{border:none;border-radius:12px;background:var(--accent);color:var(--accentInk);font-weight:700;font-size:22px;padding:0 14px}
.hint{font-size:15px;color:var(--warn);min-height:0}
.hint:empty{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:700}
.go{border:none;border-radius:999px;padding:12px 26px;background:var(--accent);color:var(--accentInk);font:800 22px "Baloo 2",system-ui,sans-serif}
.go:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.card h2{font:800 28px/1.1 "Baloo 2",system-ui,sans-serif;margin:0}
.write{width:min(420px,100%);font:700 40px "Atkinson Hyperlegible",sans-serif;text-align:center;border:3px solid var(--line);border-radius:16px;padding:8px;background:var(--bg);color:var(--ink)}
.big{font:800 48px/1.15 "Baloo 2",system-ui,sans-serif;overflow-wrap:anywhere}
.result{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.result div{display:flex;flex-direction:column;gap:4px}
.result small{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.yes{color:var(--ok);font:800 26px "Baloo 2",system-ui,sans-serif}
.muted{color:var(--muted)}
.pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick button{font:800 28px "Baloo 2",system-ui,sans-serif;border:3px solid var(--accent);background:var(--card);color:var(--ink);border-radius:18px;padding:10px 20px;min-width:120px}
/* coach screen is shown on Zoom: bigger */
.coach .chip{font-size:30px}
.coach .pat{font-size:48px}
.coach .add input{font-size:26px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Long Vowel Chart 🔤</h1>
    <span class="status" id="status" aria-live="polite"></span>
  </div>
  <div class="tabs" id="tabs" role="group" aria-label="Long vowel sound"></div>

  <section id="pickBox" class="card" hidden>
    <h2>Which sound are we working on?</h2>
    <p class="muted" style="margin:0">Your coach will tell you. Tap it.</p>
    <div class="pick" id="pick"></div>
  </section>

  <section id="chart" hidden>
    <div class="sound" id="sound"></div>
    <p class="muted" id="howto" style="margin:12px 0"></p>
    <div class="grid" id="grid"></div>
    <div class="row" style="margin-top:14px" id="tools"></div>
  </section>

  <section id="practice" class="card" hidden></section>
</main>

<script src="turn-timer.js?v=8"></script>
<script>
(function(){
"use strict";
var T = window.TurnTimer;
var COACH = (location.hash || "").toLowerCase() === "#coach";
if(COACH) document.body.classList.add("coach");
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function store(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

/* Each long vowel sound and the common ways to spell it. "other" catches the
   rest (go, me, hi, baby, they, great...) and is never checked. */
var SOUNDS = {
  a:{name:"Long a", mark:"ā", eg:"cake", pats:[["a_e","cake","🎂"],["ai","rain","🌧️"],["ay","play","🎈"],["eigh","eight","8️⃣"]]},
  e:{name:"Long e", mark:"ē", eg:"tree", pats:[["ee","tree","🌳"],["ea","leaf","🍃"],["e_e","these","👉"],["y","happy","😊"],["ey","key","🔑"],["ie","chief","👑"]]},
  i:{name:"Long i", mark:"ī", eg:"bike", pats:[["i_e","bike","🚲"],["igh","night","🌙"],["y","fly","🦋"],["ie","pie","🥧"]]},
  o:{name:"Long o", mark:"ō", eg:"boat", pats:[["o_e","home","🏠"],["oa","boat","⛵"],["ow","snow","❄️"],["oe","toe","🦶"]]},
  u:{name:"Long u", mark:"ū", eg:"cube", pats:[["u_e","cube","🧊"],["ue","glue","🧴"],["ew","new","🆕"]]}
};
var ORDER = ["a","e","i","o","u"];
function boxes(v){ return SOUNDS[v].pats.concat([["other","","✨"]]); }

/* Which letters in the word make this spelling? Returns their positions, or null. */
function find(word, pat){
  if(pat === "other") return [];
  if(pat.indexOf("_") > 0){
    var m = new RegExp(pat[0] + "[^aeiouy]e").exec(word);
    return m ? [m.index, m.index + 2] : null;
  }
  if(pat === "y") return word.length > 1 && /[^aeiou]y$/.test(word) ? [word.length - 1] : null;
  var k = word.indexOf(pat);
  if(k < 0) return null;
  var out = []; for(var i = 0; i < pat.length; i++) out.push(k + i); return out;
}
function show(word, pat){
  var at = find(word, pat) || [];
  return word.split("").map(function(c, i){ return at.indexOf(i) >= 0 ? "<mark>" + esc(c) + "</mark>" : esc(c); }).join("");
}
function patLabel(p){ return p === "other" ? "Other ways" : p.replace("_", "_"); }
function clean(s){ return String(s || "").toLowerCase().replace(/[^a-z]/g, "").slice(0, 20); }

/* ---------- saved state (this browser only) ---------- */
var KEY = COACH ? "lv-coach" : "lv-student";
var S = store(KEY) || {};
S.cur = S.cur || (COACH ? "a" : "");
S.seen = S.seen || [];           // student: sounds unlocked so far
S.words = S.words || {};         // {e:{ee:["tree"], ...}}
S.key = S.key || {};             // student: the coach's words, for practice
function save(){ store(KEY, S); }
function list(v, p){ S.words[v] = S.words[v] || {}; S.words[v][p] = S.words[v][p] || []; return S.words[v][p]; }

/* ---------- relay: the coach sends today's sound and her words ---------- */
var room = null, roomCode = "", card = null, lastCoach = 0, coachV = "";
function coachRoom(){
  var code = ((T && T.store("tt-coach2")) || {}).code || "";
  if(code === roomCode && room) return;
  if(room) room.close();
  roomCode = code; room = code && T ? T.Room(code, {onStatus:paintStatus}) : null;
  paintStatus();
}
function coachSend(){
  if(!room) return;
  var w = {}; boxes(S.cur).forEach(function(b){ w[b[0]] = (S.words[S.cur] || {})[b[0]] || []; });
  room.send("x", {g:"lv", v:S.cur, w:w}, false);
}
function paintStatus(){
  var el = $("status");
  if(COACH){
    el.textContent = !roomCode ? "Open your Turn Timer coach page first, so students get today's sound." :
      room && room.status === "open" ? "Students' screens show: " + SOUNDS[S.cur].name :
      room && room.status === "blocked" ? "Can't reach the relay. Tell students which sound to tap." : "Connecting…";
  } else {
    var me = card && card.me ? card.me() : "";
    el.textContent = lastCoach ? "Your coach picked today's sound." : me ? me + " Waiting for your coach…" : "";
  }
}

/* ---------- drawing ---------- */
var mode = "chart";
function paintTabs(){
  var vs = COACH ? ORDER : ORDER.filter(function(v){ return S.seen.indexOf(v) >= 0; });
  $("tabs").innerHTML = vs.map(function(v){
    return '<button type="button" data-v="' + v + '" aria-pressed="' + (v === S.cur) + '">' + SOUNDS[v].mark + " " + SOUNDS[v].name + '</button>';
  }).join("");
}
function paint(){
  paintTabs(); paintStatus();
  var none = !S.cur;
  $("pickBox").hidden = !none;
  if(none){
    $("pick").innerHTML = ORDER.map(function(v){ return '<button type="button" data-v="' + v + '">' + SOUNDS[v].mark + "<br>" + SOUNDS[v].name + '</button>'; }).join("");
    $("chart").hidden = $("practice").hidden = true; return;
  }
  $("chart").hidden = mode !== "chart"; $("practice").hidden = mode !== "practice";
  if(mode === "practice") return paintPractice();
  var s = SOUNDS[S.cur];
  $("sound").innerHTML = '<span class="v">' + s.mark + '</span><div><div class="n">' + s.name + '</div><div class="s">Every box is a way to spell this sound.</div></div>';
  $("howto").textContent = COACH ? "Type each word the group thinks of into the box for its spelling." :
    "When your group thinks of a word, type it in the box where it belongs. Your chart stays on your laptop.";
  $("grid").innerHTML = boxes(S.cur).map(function(b){
    var p = b[0], ws = list(S.cur, p);
    return '<div class="box" data-p="' + p + '"><h2><span class="pat">' + esc(patLabel(p)) + '</span><span class="kw">' + b[2] + (b[1] ? " " + show(b[1], p) : "") + '</span></h2>' +
      '<div class="chips">' + ws.map(function(w, i){
        var off = !find(w, p);
        return '<span class="chip' + (off ? " check" : "") + '">' + show(w, p) + '<button type="button" data-del="' + i + '" aria-label="Take out ' + esc(w) + '">×</button></span>';
      }).join("") + '</div>' +
      '<div class="hint" aria-live="polite">' + (ws.some(function(w){ return !find(w, p); }) ? "Look again at the dashed word: is it spelled with " + esc(patLabel(p)) + "?" : "") + '</div>' +
      '<form class="add"><input aria-label="Add a word spelled with ' + esc(patLabel(p)) + '" maxlength="20" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button type="submit" aria-label="Add">+</button></form></div>';
  }).join("");
  var n = practiceWords().length;
  $("tools").innerHTML = (COACH ? "" : '<button type="button" class="go" id="practiceBtn"' + (n ? "" : " disabled") + '>✏️ Practice writing' + (n ? " (" + n + ")" : "") + '</button>') +
    '<button type="button" class="btn" id="clearBtn">Clear this chart</button>';
}

/* ---------- chart taps ---------- */
$("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-v]"); if(!b) return;
  S.cur = b.dataset.v; mode = "chart"; save(); paint(); if(COACH) coachSend();
});
$("pick").addEventListener("click", function(e){
  var b = e.target.closest("button[data-v]"); if(!b) return;
  unlock(b.dataset.v); S.cur = b.dataset.v; save(); paint();
});
$("grid").addEventListener("submit", function(e){
  e.preventDefault();
  var box = e.target.closest(".box"), inp = box.querySelector("input"), w = clean(inp.value), p = box.dataset.p, ws = list(S.cur, p);
  if(w && ws.indexOf(w) < 0) ws.push(w);
  save(); paint(); if(COACH) coachSend();
  var again = $("grid").querySelector('.box[data-p="' + p + '"] input'); if(again) again.focus();
});
$("grid").addEventListener("click", function(e){
  var b = e.target.closest("button[data-del]"); if(!b) return;
  list(S.cur, b.closest(".box").dataset.p).splice(+b.dataset.del, 1); save(); paint(); if(COACH) coachSend();
});
$("tools").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.id === "practiceBtn"){ startPractice(); return; }
  if(b.id === "clearBtn"){
    if(b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "Tap again to clear"; setTimeout(function(){ if(b.isConnected){ b.dataset.sure = ""; b.textContent = "Clear this chart"; } }, 3000); return; }
    S.words[S.cur] = {}; save(); paint(); if(COACH) coachSend();
  }
});

/* ---------- practice writing (students) ---------- */
/* Words come from the coach's chart when it arrived (spelled right), else from the student's own. */
function practiceWords(){
  var src = (S.key[S.cur] && Object.keys(S.key[S.cur]).some(function(p){ return (S.key[S.cur][p] || []).length; })) ? S.key[S.cur] : (S.words[S.cur] || {});
  var out = [];
  Object.keys(src).forEach(function(p){ (src[p] || []).forEach(function(w){ if(p === "other" || find(w, p)) out.push({w:w, p:p}); }); });
  return out;
}
var P = null;
function startPractice(){
  var ws = practiceWords().slice();
  for(var i = ws.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = ws[i]; ws[i] = ws[j]; ws[j] = t; }
  P = {ws:ws, i:0, tried:"", right:0};
  mode = "practice"; paint();
}
function paintPractice(){
  var box = $("practice"), it = P.ws[P.i];
  if(!it){
    box.innerHTML = '<h2>You wrote all ' + P.ws.length + ' words! 🎉</h2><p class="muted" style="margin:0">' + P.right + ' spelled right the first time.</p>' +
      '<div class="row" style="justify-content:center"><button type="button" class="go" data-do="again">Practice again</button><button type="button" class="btn" data-do="back">Back to my chart</button></div>';
    return;
  }
  if(!P.tried){
    box.innerHTML = '<p class="muted" style="margin:0">Word ' + (P.i + 1) + ' of ' + P.ws.length + '</p><h2>Listen, then write the word.</h2>' +
      '<button type="button" class="go" data-do="hear">🔊 Hear it</button>' +
      '<form id="wform" style="display:flex;flex-direction:column;gap:12px;align-items:center;width:100%"><input class="write" id="wIn" aria-label="Write the word" maxlength="20" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button type="submit" class="go">Check</button></form>' +
      '<button type="button" class="btn" data-do="back">Back to my chart</button>';
    $("wIn").focus();
    $("wform").addEventListener("submit", function(e){ e.preventDefault(); var v = clean($("wIn").value); if(!v) return; P.tried = v; if(v === it.w) P.right++; paint(); });
    return;
  }
  var ok = P.tried === it.w;
  box.innerHTML = (ok ? '<div class="yes">✓ You spelled it!</div><div class="big">' + show(it.w, it.p) + '</div>' :
      '<div class="result"><div><small>You wrote</small><span class="big">' + esc(P.tried) + '</span></div><div><small>Our chart</small><span class="big">' + show(it.w, it.p) + '</span></div></div>') +
    '<p class="muted" style="margin:0">' + (it.p === "other" ? "This one is spelled another way." : "The long " + S.cur + " sound is spelled <b>" + esc(patLabel(it.p)) + "</b>.") + '</p>' +
    '<div class="row" style="justify-content:center"><button type="button" class="btn" data-do="hear">🔊 Hear it</button><button type="button" class="go" data-do="next">Next word ▶</button></div>';
}
$("practice").addEventListener("click", function(e){
  var b = e.target.closest("button[data-do]"); if(!b) return;
  var d = b.dataset.do;
  if(d === "hear" && P && P.ws[P.i]) speak(P.ws[P.i].w);
  if(d === "next"){ P.i++; P.tried = ""; paint(); }
  if(d === "again") startPractice();
  if(d === "back"){ mode = "chart"; paint(); }
});
var voice = null;
function pickVoice(){ try{ var vs = speechSynthesis.getVoices(); voice = vs.filter(function(v){ return /en[-_]US/i.test(v.lang); })[0] || vs.filter(function(v){ return /^en/i.test(v.lang); })[0] || null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function speak(w){ try{ speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(w); u.lang = "en-US"; u.rate = 0.8; if(voice) u.voice = voice; speechSynthesis.speak(u); }catch(e){} }

/* ---------- start ---------- */
function unlock(v){ if(S.seen.indexOf(v) < 0) S.seen.push(v); }
if(COACH){
  coachRoom(); paint();
  setInterval(function(){ coachRoom(); coachSend(); }, 3000);
} else {
  card = T ? T.mountStudent(document.body, {float:true}) : null;
  if(T) T.card = card;
  if(card){
    card.onX(function(m){
      if(!m || m.g !== "lv" || !SOUNDS[m.v]) return;
      var changed = m.v !== coachV;      // follow the coach only when she changes the sound, so a student can look back at an old chart
      coachV = m.v; lastCoach = Date.now(); unlock(m.v); S.key[m.v] = m.w || {};
      if(changed && m.v !== S.cur){ S.cur = m.v; mode = "chart"; save(); paint(); }
      else { save(); paintStatus(); if(mode === "chart"){ var pb = $("practiceBtn"), n = practiceWords().length; if(pb){ pb.disabled = !n; pb.textContent = "✏️ Practice writing" + (n ? " (" + n + ")" : ""); } } }
    });
    card.onChange(paintStatus);
  }
  paint();
}
})();
</script>
</body>
</html>
