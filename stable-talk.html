<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stable Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF3E4;
    --paper: #FFFDF8;
    --ink: #2E2118;
    --ink-soft: #5C4A3C;
    --barn: #A63D2F;
    --barn-dark: #7E2B20;
    --hay: #E9B949;
    --hay-soft: #FBEBC0;
    --sage: #3F7D5C;
    --sage-soft: #DDF0E4;
    --sky: #2F6690;
    --sky-soft: #DCEAF5;
    --rose: #B23A48;
    --rose-soft: #F8DDE0;
    --line: #E2D3BC;
    --shoe: #8A8F98;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", Verdana, sans-serif;
    font-size: 20px;
    line-height: 1.5;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 64px; }
  h1, h2, h3 { font-family: "Fredoka", "Trebuchet MS", sans-serif; line-height: 1.2; margin: 0; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding: 8px 0 16px; border-bottom: 3px dashed var(--line); margin-bottom: 20px;
  }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .brand h1 { font-size: 34px; color: var(--barn); }
  .brand small { display: block; font-size: 15px; color: var(--ink-soft); font-family: "Atkinson Hyperlegible", sans-serif; }
  .tally {
    display: flex; align-items: center; gap: 8px; background: var(--paper); border: 2px solid var(--line);
    border-radius: 999px; padding: 6px 16px; font-family: "Fredoka", sans-serif; font-size: 22px; color: var(--ink);
  }
  .shoe { width: 28px; height: 28px; flex: none; }
  .card {
    background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 22px;
    box-shadow: 0 4px 0 var(--line); margin-bottom: 18px;
  }
  .cast { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; }
  .cast div { background: var(--hay-soft); border-radius: 14px; padding: 12px 14px; font-size: 17px; color: var(--ink); }
  .cast b { font-family: "Fredoka", sans-serif; font-size: 20px; color: var(--barn-dark); display: block; }
  .menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .round-btn {
    text-align: left; background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 16px;
    padding: 16px; font: inherit; cursor: pointer; box-shadow: 0 4px 0 var(--line); display: flex; flex-direction: column; gap: 6px;
  }
  .round-btn:hover, .round-btn:focus-visible { border-color: var(--barn); outline: none; }
  .round-btn .num { font-family: "Fredoka", sans-serif; font-size: 15px; color: var(--barn); letter-spacing: .04em; text-transform: uppercase; }
  .round-btn .name { font-family: "Fredoka", sans-serif; font-size: 22px; color: var(--ink); }
  .round-btn .meta { display: flex; align-items: center; gap: 6px; font-size: 16px; color: var(--ink-soft); }
  .round-btn.done { background: var(--sage-soft); border-color: var(--sage); }
  .eyebrow { font-family: "Fredoka", sans-serif; font-size: 16px; text-transform: uppercase; letter-spacing: .05em; color: var(--barn); margin-bottom: 6px; }
  .rule { font-size: 22px; background: var(--hay-soft); border-left: 6px solid var(--hay); padding: 14px 16px; border-radius: 10px; margin: 14px 0; }
  .example { background: var(--sky-soft); border-radius: 12px; padding: 12px 16px; margin: 10px 0; font-size: 20px; color: var(--ink); }
  .example .tag { font-family: "Fredoka", sans-serif; font-size: 15px; color: var(--sky); display: block; }
  .tip { font-size: 18px; color: var(--ink-soft); margin-top: 10px; }
  .btn {
    font-family: "Fredoka", sans-serif; font-size: 21px; border: none; border-radius: 14px; padding: 12px 22px; cursor: pointer;
    background: var(--barn); color: #FFFFFF; box-shadow: 0 4px 0 var(--barn-dark);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--barn-dark); }
  .btn.secondary { background: var(--paper); color: var(--barn-dark); border: 2px solid var(--barn); box-shadow: none; }
  .btn.think { background: var(--sky); box-shadow: 0 4px 0 #1F4766; }
  .btn.reveal { background: var(--hay); color: var(--ink); box-shadow: 0 4px 0 #B88A24; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  .spacer { flex: 1; }
  .progress { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--line); }
  .dot.now { background: var(--hay); }
  .dot.right { background: var(--sage); }
  .dot.wrong { background: var(--rose); }
  .qtype { display: inline-block; font-family: "Fredoka", sans-serif; font-size: 15px; background: var(--sky-soft); color: var(--sky); border-radius: 999px; padding: 3px 12px; margin-bottom: 10px; }
  .stem { font-size: 23px; margin: 0 0 14px; }
  .stem .quote { display: block; background: var(--hay-soft); border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-style: italic; }
  .choices { display: grid; gap: 10px; }
  .choice {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; font: inherit; font-size: 21px;
    background: #FFFFFF; color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer;
  }
  .choice .letter {
    flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--bg); color: var(--barn-dark);
    font-family: "Fredoka", sans-serif; display: grid; place-items: center; font-size: 19px; border: 2px solid var(--line);
  }
  .choice.picked { border-color: var(--sky); background: var(--sky-soft); }
  .choice.picked .letter { background: var(--sky); color: #FFFFFF; border-color: var(--sky); }
  .choice.correct { border-color: var(--sage); background: var(--sage-soft); }
  .choice.correct .letter { background: var(--sage); color: #FFFFFF; border-color: var(--sage); }
  .choice.miss { border-color: var(--rose); background: var(--rose-soft); }
  .choice.miss .letter { background: var(--rose); color: #FFFFFF; border-color: var(--rose); }
  .choice[disabled] { cursor: default; }
  .thinking { background: var(--sky-soft); border: 2px dashed var(--sky); border-radius: 14px; padding: 14px 16px; margin-top: 16px; }
  .thinking h3 { color: var(--sky); font-size: 22px; margin-bottom: 6px; }
  .thinking ul { margin: 6px 0 0; padding-left: 22px; }
  .verdict { border-radius: 14px; padding: 14px 16px; margin-top: 16px; }
  .verdict.good { background: var(--sage-soft); border: 2px solid var(--sage); }
  .verdict.bad { background: var(--rose-soft); border: 2px solid var(--rose); }
  .verdict h3 { font-size: 23px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .verdict.good h3 { color: var(--sage); }
  .verdict.bad h3 { color: var(--rose); }
  .verdict p { margin: 8px 0 0; }
  .verdict .lbl { font-family: "Fredoka", sans-serif; color: var(--ink); }
  textarea {
    width: 100%; min-height: 130px; font: inherit; font-size: 21px; color: var(--ink); background: #FFFFFF;
    border: 2px solid var(--line); border-radius: 14px; padding: 12px; resize: vertical;
  }
  textarea:focus { outline: 3px solid var(--hay); border-color: var(--hay); }
  .diary { background: #FFFDF2; border: 2px solid var(--hay); border-radius: 14px; padding: 16px;
    background-image: repeating-linear-gradient(transparent, transparent 34px, #EADFC6 34px, #EADFC6 35px); }
  .big-shoes { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .big-shoes .shoe { width: 40px; height: 40px; }
  .shoe.empty { opacity: .2; }
  .hint { font-size: 17px; color: var(--ink-soft); }
  .footer-note { font-size: 16px; color: var(--ink-soft); text-align: center; margin-top: 24px; }
  @media (max-width: 560px) {
    body { font-size: 18px; }
    .brand h1 { font-size: 28px; }
    .stem { font-size: 20px; }
    .choice { font-size: 19px; }
    .rule { font-size: 19px; }
    .card { padding: 16px; }
    .btn { font-size: 19px; padding: 11px 16px; }
  }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand" id="homeLink" role="button" tabindex="0" aria-label="Back to the stable menu">
      <svg class="shoe" style="width:44px;height:44px"><use href="#hs"/></svg>
      <div><h1>Stable Talk</h1><small>Grade 6 Language, straight from the barn</small></div>

    <div class="tally" aria-live="polite"><svg class="shoe"><use href="#hs"/></svg><span id="tally">0</span></div>
  </header>
  <main id="app"></main>
  <p class="footer-note">Coach tip: let her pick and explain first. Press Reveal only after she has said her thinking out loud.</p>

<script>
(function () {
  "use strict";

  var ROUNDS = [
    {
      id: "case", name: "Pronoun Case",
      rule: "Use a <b>subject</b> pronoun (I, he, she, we, they, who) for whoever does the action, an <b>object</b> pronoun (me, him, her, us, them, whom) after an action word or a word like <i>to, for, with, at</i>, and a <b>possessive</b> pronoun (mine, hers, its, theirs, whose) to show ownership. Possessive pronouns never get an apostrophe.",
      examples: [
        ["Subject", "Duchess and <b>I</b> polished the trophy she has never actually won."],
        ["Object", "Pickles the barn cat left a ‘present’ on the doormat for Pewter and <b>me</b>."]
      ],
      tip: "Trick: cover up the other person. “Pickles and me hid” becomes “me hid.” Sounds wrong, so it’s I.",
      write: "Write a diary sentence about you and a horse doing something together. Use “and I” or “and me” correctly, then tell your coach which one you used and why.",
      items: [
        { type: "Pick the correct sentence", stem: "Which sentence is written correctly?",
          choices: ["Pickles and me hid in the hayloft during the thunderstorm.", "Pickles and I hid in the hayloft during the thunderstorm.", "Me and Pickles hid in the hayloft during the thunderstorm.", "Pickles and myself hid in the hayloft during the thunderstorm."],
          answer: 1, trap: 0,
          why: "Pickles and I are the ones doing the hiding, so we need the subject pronoun I. Cover Pickles: “I hid” works.",
          trapWhy: "“Pickles and me” is how lots of people talk, but cover Pickles and you get “me hid,” which no pony would say." },
        { type: "Fill the blank", stem: "The farrier said the loudest snoring in the whole barn belonged to Pewter and ___.",
          choices: ["I", "me", "myself", "my"], answer: 1, trap: 0,
          why: "The pronoun comes after “to,” so it is an object: “belonged to me.” Me it is (sadly, the snoring is yours).",
          trapWhy: "“Pewter and I” sounds fancy, but fancy is not the test. “Belonged to I” is wrong, so “Pewter and I” is wrong here too." },
        { type: "Fix the error", stem: "Duchess insists the blue ribbon is ___, even though the judge clearly handed it to a goat.",
          choices: ["her's", "hers", "she's", "her"], answer: 1, trap: 0,
          why: "Hers is a possessive pronoun, and possessive pronouns (hers, its, theirs, ours) never use an apostrophe.",
          trapWhy: "Her’s looks like “the pony’s,” but pronouns already show ownership on their own. The apostrophe is a trap." },
        { type: "Fill the blank", stem: "The pony ___ the judges laughed at still bowed grandly to the crowd.",
          choices: ["who", "whom", "whose", "which"], answer: 1, trap: 0,
          why: "The judges laughed at <i>her</i>. Her is an object, and the object partner of who is whom. Quick test: if him or her fits, use whom.",
          trapWhy: "Who is for the one doing the action. Duchess isn’t doing the laughing here; the judges are." }
      ]
    },
    {
      id: "intensive", name: "Intensive Pronouns",
      rule: "An <b>intensive pronoun</b> is a -self or -selves word that adds <b>emphasis</b> right after the noun it points back to. Test: delete it, and the sentence still works. Never use one as the subject (“Myself went”), and “hisself” and “theirselves” are not words.",
      examples: [
        ["Emphasis", "Pewter <b>himself</b> admitted that the carrot cake was delicious."],
        ["Emphasis", "We cleaned the tack room <b>ourselves</b>, without a single grown-up."]
      ],
      tip: "If deleting the -self word breaks the sentence (“Duchess admired in the mirror”), it is reflexive, not intensive.",
      write: "Write a sentence where a stable animal does something surprising, and use an intensive pronoun to show how surprising it is (for example: “The barn cat herself...”).",
      items: [
        { type: "Identify", stem: "Which sentence uses an intensive pronoun?",
          choices: ["Duchess admired herself in the water trough for an hour.", "The stable owner herself came out to watch the pony’s ‘victory lap.’", "Pickles washed herself after the mud incident.", "The kids made themselves a feeding chart."],
          answer: 1, trap: 0,
          why: "Delete herself: “The stable owner came out to watch...” still works. Herself is only there for emphasis, so it is intensive.",
          trapWhy: "Delete herself from “Duchess admired herself” and you get “Duchess admired in the water trough.” The sentence breaks, so that one is reflexive." },
        { type: "Fill the blank", stem: "The twins groomed the grumpy gray horse ___ and refused all help.",
          choices: ["theirselves", "themselves", "themself", "them"], answer: 1, trap: 0,
          why: "Two people means the plural form themselves. It adds emphasis: they did it with no help.",
          trapWhy: "Theirselves sounds logical, but it is not a standard English word. Same for hisself." },
        { type: "Pick the correct sentence", stem: "Which sentence is correct?",
          choices: ["Myself and the barn cat will guard the oats.", "The barn cat and myself will guard the oats.", "I myself will guard the oats from the barn cat.", "The barn cat will guard the oats with myself."],
          answer: 2, trap: 1,
          why: "I is the subject, and myself sits right after it for emphasis. Delete myself and “I will guard the oats” still works.",
          trapWhy: "Myself can’t be a subject. Cover the barn cat: “Myself will guard the oats” sounds like a robot pony." }
      ]
    },
    {
      id: "shift", name: "Pronoun Shifts",
      rule: "Once you choose a pronoun’s <b>person</b> (I/we, you, he/she/they) and <b>number</b> (one or more than one), stay with it. Don’t switch from “a rider” to “you,” or from “ponies” to “it.”",
      examples: [
        ["Person", "Shift: “When riders enter the ring, you should smile.” Fixed: “When riders enter the ring, <b>they</b> should smile.”"],
        ["Number", "Shift: “The ponies tossed its manes.” Fixed: “The ponies tossed <b>their</b> manes.”"]
      ],
      tip: "Underline the first person or animal named, then check that every pronoun after it matches.",
      write: "Write two sentences of advice for someone visiting the stable. Pick “you” or “visitors” and keep the same pronoun all the way through.",
      items: [
        { type: "Find the error", stem: "Which sentence has an unnecessary shift in pronoun?",
          choices: ["When I clean the stalls, you always find a missing sock.", "When I clean the stalls, I always find a missing sock.", "When we clean the stalls, we always find a missing sock.", "When they clean the stalls, they always find a missing sock."],
          answer: 0, trap: 2,
          why: "It starts with I and then jumps to you. The person cleaning and the person finding the sock should be the same.",
          trapWhy: "We and we match, so that sentence is steady. The shift only happens when the pronoun changes partway through." },
        { type: "Best revision", stem: "Choose the best revision.<span class=\"quote\">If a person wants to befriend Pewter, you have to bring at least six carrots.</span>",
          choices: ["If a person wants to befriend Pewter, they has to bring at least six carrots.", "If you want to befriend Pewter, you have to bring at least six carrots.", "If a person wants to befriend Pewter, we have to bring at least six carrots.", "No change is needed."],
          answer: 1, trap: 3,
          why: "Now it’s “you” and “you” from start to finish. No shift.",
          trapWhy: "The original starts with “a person” (third person) and switches to “you” (second person). That switch is the error." },
        { type: "Pick the correct sentence", stem: "Which sentence keeps the pronoun number consistent?",
          choices: ["The ponies trotted into the arena, and it bowed to the crowd.", "The ponies trotted into the arena, and she bowed to the crowd.", "The ponies trotted into the arena, and they bowed to the crowd.", "The ponies trotted into the arena, and he bowed to the crowd."],
          answer: 2, trap: 0,
          why: "Ponies is plural (more than one), so the pronoun must be plural too: they.",
          trapWhy: "It is singular. One “it” can’t stand for a whole line of bowing ponies." }
      ]
    },
    {
      id: "vague", name: "Vague Pronouns",
      rule: "A pronoun must point to <b>one clear noun</b>. If a reader could ask “Who?” or “Which one?”, swap the pronoun for the noun. Also skip a mystery “they” or “it” that points to nobody.",
      examples: [
        ["Unclear who", "Vague: “When Duchess bumped into the new mare, she sneezed.” Clear: “<b>Duchess</b> sneezed when she bumped into the new mare.”"],
        ["Mystery it", "Vague: “On the feed bag, it says to give two scoops.” Clear: “<b>The feed bag</b> says to give two scoops.”"]
      ],
      tip: "Ask: could this pronoun mean two different characters? If yes, it’s vague.",
      write: "Write a sentence with two animals in it where it is crystal clear who does what. Then try writing a vague version on purpose and see if your coach can spot the problem.",
      items: [
        { type: "Find the error", stem: "Which sentence has a vague pronoun?",
          choices: ["When Duchess met the new mare, she tossed her mane.", "Duchess tossed her mane proudly when the new mare arrived.", "The new mare arrived, and Pewter ignored her completely.", "Pickles knocked a brush off the shelf, then acted as if she had never seen a brush before."],
          answer: 0, trap: 2,
          why: "Two female horses, one “she.” Did Duchess toss her mane, or did the new mare? The reader can’t tell.",
          trapWhy: "Her in “Pewter ignored her” can only mean the new mare, because Pewter is the one doing the ignoring. Clear." },
        { type: "Best revision", stem: "Choose the clearest revision.<span class=\"quote\">Pewter told the donkey that his blanket smelled like old cheese.</span>",
          choices: ["Pewter told the donkey that the blanket smelled like old cheese.", "Pewter told the donkey, “Your blanket smells like old cheese.”", "He told him that his blanket smelled like old cheese.", "Pewter told the donkey that his own blanket smelled like old cheese."],
          answer: 1, trap: 3,
          why: "Turning it into Pewter’s exact words makes it clear: “your” means the donkey. Rude, but clear.",
          trapWhy: "“His own” still could be Pewter’s or the donkey’s. Adding “own” doesn’t tell us whose blanket stinks." },
        { type: "Best revision", stem: "Choose the best revision.<span class=\"quote\">In the riding manual, they say a pony should never eat dessert first.</span>",
          choices: ["In the riding manual, it says a pony should never eat dessert first.", "The riding manual says a pony should never eat dessert first.", "They say in the riding manual a pony should never eat dessert first.", "In the riding manual, they all say a pony should never eat dessert first."],
          answer: 1, trap: 0,
          why: "Who is “they”? Nobody. Making the manual the subject removes the mystery pronoun.",
          trapWhy: "Swapping they for it just trades one mystery pronoun for another. The fix is to name the manual." }
      ]
    },
    {
      id: "nonres", name: "Commas, Dashes, Parentheses",
      rule: "Extra (nonrestrictive) information that the sentence could live without gets a <b>matching pair</b> of marks around it: two commas (normal voice), two dashes (drama!), or parentheses (a whisper). Information needed to tell <b>which one</b> gets no marks at all.",
      examples: [
        ["Commas", "Pewter<b>,</b> the grumpiest horse in the county<b>,</b> refuses to wear a bow."],
        ["Dashes", "Duchess entered the big race <b>—</b> a race for toddlers on ponies <b>—</b> and called it her comeback."]
      ],
      tip: "Read the sentence without the extra part. If it still makes sense, the extra part needs a pair of marks.",
      write: "Write a sentence about one of the stable characters with an extra detail tucked inside. Choose commas, dashes, or parentheses, and tell your coach why that mark fits the mood.",
      items: [
        { type: "Pick the correct sentence", stem: "Which sentence is punctuated correctly?",
          choices: ["Pickles, the barn cat sleeps on the saddle every afternoon.", "Pickles the barn cat, sleeps on the saddle every afternoon.", "Pickles, the barn cat, sleeps on the saddle every afternoon.", "Pickles, the barn cat sleeps, on the saddle every afternoon."],
          answer: 2, trap: 0,
          why: "“The barn cat” is extra information about Pickles, so it needs a comma on both sides.",
          trapWhy: "Only one comma means the extra part never gets closed off. Commas around extra information come in pairs." },
        { type: "Fill the blanks", stem: "Duchess finally won a prize ___ a ribbon for “Most Enthusiastic Snort” ___ and has not stopped talking about it.",
          choices: ["— and —", "— and ,", ", and —", "( and ,"],
          answer: 0, trap: 1,
          why: "The marks have to match: dash with dash. The dashes add drama, which a snort ribbon clearly deserves.",
          trapWhy: "Starting with a dash and ending with a comma is a mismatched pair, like wearing one boot and one sneaker." },
        { type: "Pick the correct sentence", stem: "Which sentence is punctuated correctly?",
          choices: ["The horse, that ate my homework, lives in stall four.", "The horse that ate my homework lives in stall four.", "The horse that ate my homework, lives in stall four.", "The horse that, ate my homework lives in stall four."],
          answer: 1, trap: 0,
          why: "“That ate my homework” tells us which horse. Without it, we don’t know which horse lives in stall four, so it is needed and gets no commas.",
          trapWhy: "Commas would mean the detail is extra. But this detail is the whole point: it’s the homework-eating horse." },
        { type: "Pick the correct sentence", stem: "Which sentence uses parentheses correctly?",
          choices: ["Pewter (who is twenty-six years old) still bites anyone who sings off-key.", "Pewter (who is twenty-six years old still bites) anyone who sings off-key.", "Pewter (who is twenty-six) years old still bites anyone who sings off-key.", "Pewter who is (twenty-six years old,) still bites anyone who sings off-key."],
          answer: 0, trap: 2,
          why: "The parentheses wrap the whole extra detail. Remove it and you get “Pewter still bites anyone who sings off-key.”",
          trapWhy: "This closes the parentheses too early and leaves “years old” stranded outside. Remove the parentheses part and the sentence falls apart." }
      ]
    },
    {
      id: "spell", name: "Spelling",

      var redo = el("button", "btn secondary", "Redo round"); redo.type = "button";
      redo.addEventListener("click", function () {
        ROUNDS[r].items.forEach(function (_, i) { delete state.results[key(r, i)]; });
        save(); updateTally(); renderItem(r, 0);
      });
      row.insertBefore(redo, go);
    }
    c.appendChild(row);
    app.appendChild(c);
    top();
  }
  function firstOpen(r) {
    for (var i = 0; i < ROUNDS[r].items.length; i++) {
      if (typeof state.results[key(r, i)] !== "boolean") return i;
    }
    return 0;
  }

  /* ---------- Practice item ---------- */
  function renderItem(r, i) {
    var R = ROUNDS[r], Q = R.items[i];
    var picked = null, stage = "pick";
    app.innerHTML = "";
    var c = el("section", "card");

    var prog = el("div", "progress");
    R.items.forEach(function (_, j) {
      var d = el("span", "dot");
      var res = state.results[key(r, j)];
      if (j === i) d.classList.add("now");
      else if (res === true) d.classList.add("right");
      else if (res === false) d.classList.add("wrong");
      prog.appendChild(d);
    });
    c.appendChild(prog);
    c.appendChild(el("div", "eyebrow", "Round " + (r + 1) + " &middot; " + R.name + " &middot; Question " + (i + 1) + " of " + R.items.length));
    c.appendChild(el("span", "qtype", Q.type));
    c.appendChild(el("p", "stem", Q.stem));

    var list = el("div", "choices");
    var btns = Q.choices.map(function (txt, k) {
      var b = el("button", "choice");
      b.type = "button";
      b.innerHTML = '<span class="letter">' + LETTERS[k] + '</span><span></span>';
      b.lastChild.textContent = txt;
      b.addEventListener("click", function () {
        if (stage === "revealed") return;
        picked = k;
        btns.forEach(function (x, m) { x.classList.toggle("picked", m === k); });
        thinkBtn.disabled = false;
      });
      list.appendChild(b);
      return b;
    });
    c.appendChild(list);

    var area = el("div");
    c.appendChild(area);

    var row = el("div", "row");
    var menuBtn = el("button", "btn secondary", "Menu"); menuBtn.type = "button";
    menuBtn.addEventListener("click", renderHome);
    var thinkBtn = el("button", "btn think", "Show me your thinking"); thinkBtn.type = "button";
    thinkBtn.disabled = true;
    var revealBtn = el("button", "btn reveal", "Reveal"); revealBtn.type = "button";
    revealBtn.style.display = "none";
    var nextBtn = el("button", "btn", "Next"); nextBtn.type = "button";
    nextBtn.style.display = "none";
    row.appendChild(menuBtn); row.appendChild(el("div", "spacer"));
    row.appendChild(thinkBtn); row.appendChild(revealBtn); row.appendChild(nextBtn);
    c.appendChild(row);

    thinkBtn.addEventListener("click", function () {
      stage = "thinking";
      area.innerHTML =
        '<div class="thinking"><h3>Show me your thinking</h3>' +
        '<p style="margin:0">Say it out loud to your coach before anyone presses Reveal:</p>' +
        '<ul><li>Why did you pick <b>' + LETTERS[picked] + '</b>?</li>' +
        '<li>Which word or mark in the sentence gave you the clue?</li>' +
        '<li>Pick one other choice and tell why it is wrong.</li></ul>' +
        '<p class="hint" style="margin:8px 0 0">Changed your mind while explaining? Tap a different answer. That is good thinking, not cheating.</p></div>';
      thinkBtn.style.display = "none";
      revealBtn.style.display = "";
    });

    revealBtn.addEventListener("click", function () {
      if (picked === null) return;
      stage = "revealed";
      var right = picked === Q.answer;
      state.results[key(r, i)] = right; save(); updateTally();
      btns.forEach(function (b, k) {
        b.disabled = true;
        b.classList.remove("picked");
        if (k === Q.answer) b.classList.add("correct");
        else if (k === picked) b.classList.add("miss");
      });
      var trapIdx = (!right) ? picked : Q.trap;
      var trapLabel = (!right && picked === Q.trap) ? "The trap you stepped in (" + LETTERS[Q.trap] + ")"
        : (!right ? "Why " + LETTERS[picked] + " doesn’t work" : "The trap: " + LETTERS[Q.trap]);
      var trapText = (trapIdx === Q.trap) ? Q.trapWhy
        : "Try it in the sentence and compare it with " + LETTERS[Q.answer] + ". " + Q.why.split(". ")[0] + ".";
      area.innerHTML =
        '<div class="verdict ' + (right ? "good" : "bad") + '">' +
        '<h3>' + (right ? shoeSvg() + " Horseshoe earned!" : "Not this time. " + LETTERS[Q.answer] + " is the one.") + '</h3>' +
        '<p><span class="lbl">Why ' + LETTERS[Q.answer] + ' is right:</span> ' + Q.why + '</p>' +
        '<p><span class="lbl">' + trapLabel + ':</span> ' + trapText + '</p></div>';
      revealBtn.style.display = "none";
      nextBtn.style.display = "";
      nextBtn.focus();
    });

    nextBtn.addEventListener("click", function () {
      for (var j = i + 1; j < R.items.length; j++) {
        if (state.results[key(r, j)] !== true) { renderItem(r, j); return; }
      }
      renderWrite(r);
    });

    app.appendChild(c);
    top();
  }

  /* ---------- Say it your way ---------- */
  function renderWrite(r) {
    var R = ROUNDS[r];
    app.innerHTML = "";
    var c = el("section", "card");
    c.innerHTML = '<div class="eyebrow">Round ' + (r + 1) + ' &middot; Say it your way</div>' +
      '<h2 style="font-size:28px;color:var(--ink)">Your turn to write</h2>' +
      '<p style="margin:10px 0 14px">' + R.write + '</p>';
    var box = el("div", "diary");
    var ta = el("textarea");
    ta.setAttribute("aria-label", "Your sentence");
    ta.placeholder = "Dear Diary, today at the barn...";
    ta.value = state.writes[R.id] || "";
    var t = null;
    ta.addEventListener("input", function () {
      clearTimeout(t);
      t = setTimeout(function () { state.writes[R.id] = ta.value; save(); }, 300);
    });
    box.appendChild(ta);
    c.appendChild(box);
    c.appendChild(el("p", "hint", "Coach: ask her to point to the exact word or mark that shows the skill."));
    var row = el("div", "row");
    var back = el("button", "btn secondary", "Back to question 1"); back.type = "button";
    back.addEventListener("click", function () { renderItem(r, 0); });
    var done = el("button", "btn", "Finish round"); done.type = "button";
    done.addEventListener("click", function () { state.writes[R.id] = ta.value; save(); renderDone(r); });
    row.appendChild(back); row.appendChild(el("div", "spacer")); row.appendChild(done);
    c.appendChild(row);
    app.appendChild(c);
    top();
    try { ta.focus(); } catch (e) { /* ignore */ }
  }

  /* ---------- Round done ---------- */
  var CHEERS = [
    "Pewter almost smiled. Almost.",
    "Duchess is calling it a world record.",
    "Pickles opened one eye. That is basically applause.",
    "The stable kid is writing this in the diary right now."
  ];
  function renderDone(r) {
    var R = ROUNDS[r];
    var got = roundShoes(r);
    app.innerHTML = "";
    var c = el("section", "card");
    var shoes = "";
    for (var k = 0; k < R.items.length; k++) shoes += shoeSvg(k < got ? "" : "empty");
    c.innerHTML = '<div class="eyebrow">Round ' + (r + 1) + ' complete</div>' +
      '<h2 style="font-size:30px;color:var(--ink)">' + R.name + '</h2>' +
      '<div class="big-shoes">' + shoes + '</div>' +
      '<p style="font-size:24px;margin:6px 0">' + got + ' of ' + R.items.length + ' horseshoes</p>' +
      '<p style="margin:6px 0 0;color:var(--ink-soft)">' + CHEERS[(r + got) % CHEERS.length] + '</p>';
    var row = el("div", "row");
    var home = el("button", "btn secondary", "Back to the barn"); home.type = "button";
    home.addEventListener("click", renderHome);
    row.appendChild(home); row.appendChild(el("div", "spacer"));
    if (got < R.items.length) {
      var again = el("button", "btn secondary", "Try the misses again"); again.type = "button";
      again.addEventListener("click", function () {
        var first = -1;
        R.items.forEach(function (_, i) {
          if (state.results[key(r, i)] !== true) { delete state.results[key(r, i)]; if (first < 0) first = i; }
        });
        save(); updateTally(); renderItem(r, first < 0 ? 0 : first);
      });
      row.appendChild(again);
    }
    if (r + 1 < ROUNDS.length) {
      var next = el("button", "btn", "Next round"); next.type = "button";
      next.addEventListener("click", function () { renderLearn(r + 1); });
      row.appendChild(next);
    }
    c.appendChild(row);
    app.appendChild(c);
    top();
  }

  var home = document.getElementById("homeLink");
  home.addEventListener("click", renderHome);
  home.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); renderHome(); } });

  renderHome();
})();
</script>
</body>
</html>
