<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chunk It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Chunk It: long words, one chunk at a time. Reveal a chunk, say it, reveal the next, then put it together. Silent unless tapped. */
:root{--bg:#f6f4fb;--card:#fff;--ink:#231f33;--muted:#615a76;--line:#e0dbee;--plum:#6b3fa0;--plum-soft:#efe6fa;--mint:#2e7d63;--mint-soft:#e1f3ec;--sun:#d9822b;--sun-soft:#fcecd9;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#16131f;--card:#201b2c;--ink:#ece8f6;--muted:#aaa3bf;--line:#342d45;--plum:#c3a2ef;--plum-soft:#2d2340;--mint:#86d3b5;--mint-soft:#1b3129;--sun:#f0b06a;--sun-soft:#3a2b1b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.5 var(--body);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 56px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);color:var(--plum);font-size:2.2rem;margin:0}
p{margin:0}.small{font-size:.9rem;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;font-size:.95rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.tab[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft);color:var(--plum)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.word{font-family:var(--display);font-size:3.4rem;line-height:1.1;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:4.2rem}
.chunk{padding:0 12px;border-radius:14px;background:var(--plum-soft);color:var(--plum)}
.chunk.hidden{background:var(--line);color:transparent;min-width:2.5ch}
.chunk.now{outline:4px solid var(--sun)}
.whole{font-family:var(--display);font-size:3.4rem;color:var(--mint)}
.tip{background:var(--sun-soft);border-radius:14px;padding:8px 14px;font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;border:2px solid var(--plum);background:var(--plum);color:var(--card)}
.btn.ghost{background:none;color:var(--plum)}
.btn.mint{border-color:var(--mint);background:var(--mint)}
.btn.sun{border-color:var(--sun);background:var(--sun)}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.count{font-weight:700;color:var(--muted)}
.tricky{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tricky .list{display:flex;gap:8px;flex-wrap:wrap}
.tricky .list span{background:var(--sun-soft);border-radius:10px;padding:2px 10px;font-weight:700}
</style>
</head>
<body>
<main>
  <header style="display:flex;flex-direction:column;gap:6px">
    <h1>Chunk It</h1>
    <p>Big words are just small chunks stuck together. Open one chunk at a time, read it, then put the word back together.</p>
  </header>
  <div class="tabs" id="tabs" role="group" aria-label="Choose a level"></div>
  <section class="card" id="card" aria-live="polite"></section>
  <section class="tricky" id="tricky"></section>
</main>
<script>
(function(){
"use strict";
var LEVELS=[
 {name:"Level 1: two short chunks", tip:"Each chunk has a short vowel, like the a in cat.", words:[["nap","kin"],["rab","bit"],["sun","set"],["muf","fin"],["pic","nic"],["kit","ten"],["bas","ket"],["hel","met"],["cac","tus"],["mag","net"]]},
 {name:"Level 2: endings", tip:"Read the main word first, then add the ending.", words:[["jump","ing"],["sing","er"],["quick","ly"],["help","ful"],["kind","ness"],["slow","est"],["paint","ed"],["hope","less"]]},
 {name:"Level 3: beginnings", tip:"Find the beginning chunk first: un, re, pre, mis, dis.", words:[["un","lock"],["re","do"],["pre","heat"],["mis","spell"],["dis","like"],["un","hap","py"],["re","build"]]},
 {name:"Level 4: three chunks", tip:"Say each chunk, then say it again faster until it sounds like a real word.", words:[["fan","tas","tic"],["im","por","tant"],["bas","ket","ball"],["but","ter","fly"],["an","i","mal"],["el","e","phant"],["to","ma","to"],["ba","nan","a"],["hos","pi","tal"],["cu","cum","ber"]]},
 {name:"Level 5: long words", tip:"Take your time. One chunk, then the next. Then blend.", words:[["cel","e","bra","tion"],["in","for","ma","tion"],["ad","ven","ture"],["ter","ri","ble"],["vol","ca","no"],["cal","cu","la","tor"],["en","thu","si","as","tic"],["in","vis","i","ble"],["mys","te","ri","ous"],["re","mem","ber"]]}
];
var lv=0, wi=0, shown=0, together=false, tricky=[];
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function say(t){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.rate=.85; speechSynthesis.speak(u);}catch(e){} }
function tabs(){
  var t=$("tabs"); t.innerHTML="";
  LEVELS.forEach(function(L,i){ var b=document.createElement("button"); b.type="button"; b.className="tab"; b.textContent="Level "+(i+1); b.title=L.name; b.setAttribute("aria-pressed",String(i===lv));
    b.addEventListener("click",function(){ lv=i; wi=0; shown=0; together=false; render(); }); t.appendChild(b); });
}
function render(){
  tabs();
  var L=LEVELS[lv], w=L.words[wi], c=$("card");
  var chunks=w.map(function(ch,i){ var cls="chunk"+(i>=shown?" hidden":"")+(i===shown-1&&!together?" now":""); return '<span class="'+cls+'">'+(i<shown?esc(ch):"&nbsp;")+'</span>'; }).join("");
  var h='<p class="count">'+esc(L.name)+' · word '+(wi+1)+' of '+L.words.length+'</p><p class="tip">'+esc(L.tip)+'</p>';
  h+= together ? '<div class="whole">'+esc(w.join(""))+'</div><div class="word" style="font-size:1.6rem;min-height:0">'+w.map(esc).join(" · ")+'</div>' : '<div class="word">'+chunks+'</div>';
  h+='<div class="row">';
  if(!together && shown<w.length) h+='<button class="btn" type="button" id="b-open">'+(shown===0?"Open the first chunk":"Open the next chunk")+'</button>';
  if(!together && shown===w.length) h+='<button class="btn mint" type="button" id="b-join">Put it together</button>';
  if(together) h+='<button class="btn ghost" type="button" id="b-hear">🔊 Check it</button><button class="btn mint" type="button" id="b-got">✓ I read it</button><button class="btn sun" type="button" id="b-tricky">Tricky, practice again</button>';
  h+='</div><p class="small">'+(together?'Read the whole word out loud, then tap 🔊 to check.':'Read each chunk out loud before you open the next one.')+'</p>';
  c.innerHTML=h;
  var o=$("b-open"), j=$("b-join"), hr=$("b-hear"), g=$("b-got"), tk=$("b-tricky");
  if(o) o.addEventListener("click",function(){ shown++; render(); });
  if(j) j.addEventListener("click",function(){ together=true; render(); });
  if(hr) hr.addEventListener("click",function(){ say(w.join("")); });
  if(g) g.addEventListener("click",next);
  if(tk) tk.addEventListener("click",function(){ var word=w.join(""); if(tricky.indexOf(word)<0) tricky.push(word); renderTricky(); next(); });
}
function next(){ var L=LEVELS[lv]; wi=(wi+1)%L.words.length; shown=0; together=false; render(); }
function renderTricky(){
  var t=$("tricky");
  t.innerHTML='<b>Words to practice again</b>'+(tricky.length?'<div class="list">'+tricky.map(function(x){return '<span>'+esc(x)+'</span>';}).join("")+'</div><div class="row" style="justify-content:flex-start"><button class="btn ghost" type="button" id="b-copy">Copy this list</button></div>':'<p class="small">None yet. Tap "Tricky" on any word you want to come back to.</p>');
  var cp=$("b-copy"); if(cp) cp.addEventListener("click",function(){ var txt="Chunk It, tricky words: "+tricky.join(", "); if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){cp.textContent="Copied!";}).catch(function(){cp.textContent=txt;}); else cp.textContent=txt; });
}
render(); renderTricky();
})();
</script>
</body>
</html>
