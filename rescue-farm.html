<html lang="en">
<head>

<title>Grandma and Grandpa's Land Rescue</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Grandma and Grandpa's Land Rescue. Tools are earned in Read the Signs (every 3 first-try right answers = 1 tool, key rescue-tools.v1).
   Tap-based, plays alone on any computer. No names, no timer, no sound. Animal facts checked 27 Nov 2026. */
:root{--bg:#f4f1e8;--card:#fffdf7;--ink:#2b2a22;--muted:#6a6656;--line:#e2dccb;--accent:#3f7a3a;--accent-ink:#fff;
  --good:#2f7a45;--good-soft:#e2f2e5;--warn:#9a5b12;--warn-soft:#fbeedb;--lock:#b9b3a2;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"Lexend","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#191a15;--card:#24251e;--ink:#eeeadb;--muted:#b4ae9a;--line:#3a3b31;--accent:#7cc173;--accent-ink:#13200f;
  --good:#8fd6a0;--good-soft:#1e3324;--warn:#f0b56a;--warn-soft:#3a2c18;--lock:#5c5a4e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
[hidden]{display:none!important}
main{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:2.2rem;margin:0;line-height:1.1}
h2{font-family:var(--display);font-size:1.5rem;margin:0;line-height:1.2}
p{margin:0}
.small{font-size:.88rem;color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.pack{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tool{font:inherit;font-size:.82rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;line-height:1.15}
.tool .ic{font-size:1.9rem;line-height:1.1;height:2.1rem;display:flex;align-items:center}
.tool.off{opacity:.45;border-style:dashed}
.tool.off .ic{filter:grayscale(1)}
button.tool{cursor:pointer}
button.tool:disabled{cursor:default}
button.tool.picked-bad{border-color:var(--warn);background:var(--warn-soft)}
button.tool.picked-good{border-color:var(--good);background:var(--good-soft)}
.mapwrap{border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#cfe3a6}
.mapwrap svg{display:block;width:100%;height:auto}
.spot{cursor:pointer}
.spot:focus{outline:none}
.spot:focus-visible .spotlabel rect{stroke:#9a5b12;stroke-width:4}
.badge{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.badge{animation:none}}
.scene{border-radius:20px;overflow:hidden;border:2px solid var(--line)}
.scene svg{display:block;width:100%;height:auto}
.blanket{transition:opacity .6s}
.door{transition:transform .9s ease}
.door.up{transform:translateY(-78px)}
.walker{transition:transform 1.4s ease}
.walker.out{transform:translateX(112px)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{font:inherit;text-align:left;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;cursor:pointer}
.choice.bad{border-color:var(--warn);background:var(--warn-soft)}
.choice.good{border-color:var(--good);background:var(--good-soft)}
.fb{font-weight:600;border-radius:14px;padding:10px 14px}
.fb.good{background:var(--good-soft);color:var(--ink);border-left:6px solid var(--good)}
.fb.bad{background:var(--warn-soft);color:var(--ink);border-left:6px solid var(--warn)}
.fact{border-left:6px solid var(--accent);padding:8px 12px;background:var(--bg);border-radius:10px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.pip{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 10px;border:2px solid var(--line);color:var(--muted)}
.pip.now{border-color:var(--accent);color:var(--ink)}
.pip.done{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.chk{cursor:pointer}
.chk circle.ring{fill:rgba(255,230,120,.35);stroke:#e0a400;stroke-width:3}
.chk.done circle.ring{fill:rgba(120,200,140,.4);stroke:#2f7a45}
.drawbox{display:flex;flex-direction:column;gap:10px}
canvas{width:100%;max-width:640px;aspect-ratio:4/3;background:#fffef6;border:2px solid var(--line);border-radius:16px;touch-action:none;cursor:crosshair}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.1)}
.safety{font-size:.9rem;border:2px dashed var(--warn);border-radius:14px;padding:8px 12px;background:var(--warn-soft)}
.homes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.home{border:2px solid var(--line);border-radius:16px;padding:8px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.9rem;font-weight:600}
.home img{width:100%;border-radius:10px;border:1px solid var(--line)}
@media (max-width:560px){.pack{grid-template-columns:repeat(3,1fr)}h1{font-size:1.8rem}}
</style>
</head>

function animalById(id){ for(var i=0;i<ANIMALS.length;i++) if(ANIMALS[i].id===id) return ANIMALS[i]; }

/* ---------- land map ---------- */

/* ---------- pack ---------- */
function packHtml(pickable, state){
  var n=toolInfo().earned;
  return '<div class="pack">'+TOOLS.map(function(T,i){
    var on=i<n, cls='tool'+(on?'':' off')+(state&&state[T.id]?' '+state[T.id]:'');

    return '<div class="'+cls+'">'+inner+'</div>'; }).join('')+'</div>';
}
function nextToolLine(){
  var ti=toolInfo();
  if(ti.earned>=TOOLS.length) return 'Your pack is full!';
  var left=PER_TOOL-(ti.rights%PER_TOOL); if(left<=0||left>PER_TOOL) left=PER_TOOL;
  return 'Next tool: <b>'+left+' more</b> right on the first try in <a href="read-the-signs.html#pick">Read the Signs</a>, game 2.';
}

function finish(pic){ S.done[R.a.id]={home:R.home, pic:pic||null}; save(); home(); }

  Array.prototype.forEach.call(document.querySelectorAll("[data-tool]"),function(b){ b.addEventListener("click",function(){

    else { R.picked[id]="picked-bad"; R.fb={ok:false,t:(s==="calm")?CALM.bad:("Hmm, not the "+toolById(id).name.toLowerCase()+" this time. "+(A.tool.hint||"Think about what this rescue needs."))}; }
    scene(); }); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-opt]"),function(b){ b.addEventListener("click",function(){
    var O=(s==="open")?A.open:A.flop, i=+b.getAttribute("data-opt"), o=O.opts[i];

    if(R.justOpened){ R.justOpened=false; setTimeout(function(){ var w=document.querySelector(".walker"), d=document.querySelector(".door"); if(d) d.classList.add("up"); setTimeout(function(){ if(w) w.classList.add("out"); },500); },60); }
    if(o.ok&&s==="flop"){ R.flopDone=true; }
  }); });

    function hit(){ R.checked[g.getAttribute("data-chk")]=true; scene(); }
    g.addEventListener("click",hit); g.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); hit(); } }); });

  var sk=$("skipdraw"); if(sk) sk.addEventListener("click",function(){ finish(null); });

}

/* ---------- drawing pad (mouse, pen or finger) ---------- */
function drawPad(){
  var cv=$("cv"), ctx=cv.getContext("2d"), color="#3f7a3a", size=8, drawing=false, last=null, marks=0;
  ctx.fillStyle="#fffef6"; ctx.fillRect(0,0,cv.width,cv.height); ctx.lineCap="round"; ctx.lineJoin="round";
  var COLORS=["#3f7a3a","#8a5a3b","#2b2a22","#6fb3d9","#e9a41b","#d9534f","#9b59b6","#ffffff"];
  $("sw").innerHTML=COLORS.map(function(c){ return '<button type="button" class="swatch" data-c="'+c+'" aria-label="Color" aria-pressed="'+(c===color)+'" style="background:'+c+'"></button>'; }).join('');
  Array.prototype.forEach.call(document.querySelectorAll(".swatch"),function(b){ b.addEventListener("click",function(){ color=b.getAttribute("data-c");
    Array.prototype.forEach.call(document.querySelectorAll(".swatch"),function(x){ x.setAttribute("aria-pressed",String(x===b)); }); }); });
  function pt(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; }
  function dot(p){ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(p[0],p[1],size/2,0,Math.PI*2); ctx.fill(); }
  cv.addEventListener("pointerdown",function(e){ drawing=true; last=pt(e); dot(last); marks++; try{cv.setPointerCapture(e.pointerId);}catch(x){} });
  cv.addEventListener("pointermove",function(e){ if(!drawing) return; var p=pt(e); ctx.strokeStyle=color; ctx.lineWidth=size; ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){ cv.addEventListener(ev,function(){ drawing=false; }); });
  $("thin").addEventListener("click",function(){ size=4; }); $("thick").addEventListener("click",function(){ size=16; });
  $("clear").addEventListener("click",function(){ ctx.fillStyle="#fffef6"; ctx.fillRect(0,0,cv.width,cv.height); marks=0; });
