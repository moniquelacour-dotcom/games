<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Echo's Trick School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap">
<style>
/* Echo's Trick School: teach a cheeky dog tricks. Every instruction is read aloud.
   Light, optional reading: tap the word for the trick. No timer, no names sent anywhere;
   the trainer name, treats and best streak stay in this browser only. */
:root{--sky:#bfe6ff;--grass:#8fd16a;--grass2:#6fb84c;--ink:#22303c;--card:#ffffff;--accent:#ff8a3d;--accent2:#e86f1f;--good:#2fa35b;--soft:#fff3e8;--muted:#5b6b78;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(var(--sky) 0 62%,var(--grass) 62% 100%);background-color:var(--sky);color:var(--ink);
  font:22px/1.35 "Lexend","Atkinson Hyperlegible",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
main{max-width:860px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-weight:800;font-size:clamp(30px,6vw,46px);text-align:center;letter-spacing:.01em}
button{font:inherit;cursor:pointer}
.say{border:none;background:var(--card);border-radius:999px;width:52px;height:52px;font-size:26px;box-shadow:0 3px 0 #0002;flex:none}
.say:active{transform:translateY(2px);box-shadow:0 1px 0 #0002}
.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.chip{background:#ffffffd9;border-radius:999px;padding:6px 14px;font-weight:600;font-size:20px;display:flex;align-items:center;gap:6px}
.stage{position:relative;height:300px;display:flex;align-items:flex-end;justify-content:center}
#dog{width:min(340px,86vw);height:auto;overflow:visible}
.bubble{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--card);border-radius:20px;padding:8px 18px;font-weight:800;font-size:26px;box-shadow:0 4px 0 #0002;white-space:nowrap;opacity:0;transition:opacity .25s}
.bubble.on{opacity:1}
.card{background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:0 5px 0 #0001;display:flex;flex-direction:column;gap:12px;align-items:center}
.ask{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;font-weight:600}
.ask .word{font-size:44px;font-weight:800;color:var(--accent2);letter-spacing:.04em}
.cmds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;width:100%}
.cmd{border:none;border-radius:18px;background:var(--soft);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:28px;box-shadow:0 4px 0 #e2c3a8;color:var(--ink)}
.cmd .ic{font-size:34px;line-height:1}
.cmd:active{transform:translateY(3px);box-shadow:0 1px 0 #e2c3a8}
.cmd.locked{opacity:.35;cursor:default}
.words .cmd .ic{display:none}
.words .ask .ic{display:none}
.big{border:none;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;font-size:28px;padding:12px 30px;box-shadow:0 5px 0 var(--accent2)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent2)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.toggle{border:2px solid #fff;background:#ffffff99;border-radius:999px;padding:6px 14px;font-size:18px;font-weight:600}
.toggle[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
input{font:inherit;font-size:28px;font-weight:600;border:3px solid #e2c3a8;border-radius:16px;padding:8px 14px;width:min(320px,80vw);text-align:center}
.msg{font-weight:800;font-size:28px;text-align:center;min-height:1.4em}
[hidden]{display:none!important}
.unlock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;z-index:9}
.unlock .card{font-size:30px;text-align:center;padding:24px}
.fly{position:fixed;font-size:30px;pointer-events:none;z-index:8;animation:fly 1.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}
/* ---- Echo's moves ---- */
#dog .tail{transform-origin:62px 112px;animation:wag .5s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
#dog .whole{transform-origin:160px 190px;transition:transform .45s ease}
#dog .legs-back,#dog .legs-front,#dog .head{transition:transform .45s ease}
#dog .legs-back{transform-origin:95px 150px} #dog .legs-front{transform-origin:200px 150px} #dog .head{transform-origin:215px 110px}
#dog .paw{transform-origin:208px 150px;transition:transform .3s ease}
#dog .ball{opacity:0;transition:transform .7s ease,opacity .2s}
#dog .zzz{opacity:0}
#dog.sit .whole{transform:rotate(-14deg) translateY(10px)} #dog.sit .legs-back{transform:scaleY(.45)}
#dog.down .whole{transform:translateY(34px)} #dog.down .legs-back,#dog.down .legs-front{transform:scaleY(.15)}
#dog.stay .whole{transform:rotate(-14deg) translateY(10px)} #dog.stay .legs-back{transform:scaleY(.45)} #dog.stay .tail{animation:none}
#dog.shake .whole{transform:rotate(-14deg) translateY(10px)} #dog.shake .legs-back{transform:scaleY(.45)} #dog.shake .paw{transform:rotate(-70deg)}
#dog.spin .whole{animation:spin .9s ease-in-out}
#dog.jump .whole{animation:jump .8s ease-in-out}
#dog.roll .whole{animation:roll 1.1s ease-in-out}
#dog.fetch .whole{animation:fetch 1.8s ease-in-out} #dog.fetch .ball{opacity:1;animation:ballf 1.8s ease-in-out}
#dog.tailchase .whole{animation:spin .45s linear 3}
#dog.yawn .whole{transform:translateY(34px)} #dog.yawn .legs-back,#dog.yawn .legs-front{transform:scaleY(.15)} #dog.yawn .head{transform:rotate(18deg)} #dog.yawn .zzz{opacity:1}
#dog.runoff .whole{animation:runoff 1.8s ease-in-out}
#dog.sniff .head{transform:rotate(35deg)} #dog.sniff .whole{animation:sniffs 1.2s ease-in-out}
#dog.tilt .head{transform:rotate(-22deg)}
#dog .book,#dog .bush{opacity:0;transition:opacity .3s}
#dog.read .book{opacity:1} #dog.read .whole{transform:rotate(-14deg) translateY(10px)} #dog.read .legs-back{transform:scaleY(.45)} #dog.read .head{transform:rotate(14deg)}
#dog.hide .bush{opacity:1} #dog.hide .whole{transform:translate(-60px,40px) scale(.8)} #dog.hide .tail{animation:wag .25s ease-in-out infinite alternate}
#dog.dance .whole{animation:dance .9s ease-in-out 2}
@keyframes dance{25%{transform:translateY(-24px) rotate(-10deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-24px) rotate(10deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes jump{40%{transform:translateY(-90px)}60%{transform:translateY(-90px)}}
@keyframes roll{0%{transform:translateY(34px) rotate(0)}100%{transform:translateY(34px) rotate(360deg)}}
@keyframes fetch{35%{transform:translateX(260px) scaleX(1)}50%{transform:translateX(260px) scaleX(-1)}85%{transform:translateX(0) scaleX(-1)}100%{transform:none}}
@keyframes ballf{0%{transform:translate(0,0)}30%{transform:translate(250px,-40px)}100%{transform:translate(0,0)}}
@keyframes runoff{40%{transform:translateX(-420px)}60%{transform:translateX(-420px) scaleX(-1)}100%{transform:none}}
@keyframes sniffs{50%{transform:translateX(30px)}}
@media (prefers-reduced-motion:reduce){#dog *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Echo's Trick School</h1>

  <div class="bar" id="hud" hidden>
    <span class="chip" id="hName"></span>
    <span class="chip">🦴 <b id="hTreats">0</b></span>
    <span class="chip">🔥 <b id="hStreak">0</b></span>
    <span class="chip">🏆 <b id="hBest">0</b></span>
  </div>

  <div class="stage">
    <div class="bubble" id="bubble"></div>
    <svg id="dog" viewBox="0 0 330 210" role="img" aria-label="Echo the dog">
      <g class="whole">
        <path class="tail" d="M66 112 C40 98 34 74 46 60" stroke="#8a5528" stroke-width="12" fill="none" stroke-linecap="round"/>
        <g class="legs-back"><rect x="82" y="128" width="20" height="58" rx="9" fill="#9a6232"/><rect x="108" y="128" width="20" height="58" rx="9" fill="#a8703c"/></g>
        <g class="legs-front"><rect x="178" y="128" width="20" height="58" rx="9" fill="#a8703c"/><g class="paw"><rect x="200" y="128" width="20" height="58" rx="9" fill="#9a6232"/></g></g>
        <ellipse cx="148" cy="122" rx="82" ry="40" fill="#b77a41"/>
        <ellipse cx="150" cy="134" rx="50" ry="18" fill="#e6c49a"/>
        <g class="head">
          <ellipse cx="236" cy="86" rx="40" ry="36" fill="#b77a41"/>
          <path d="M210 60 C196 70 194 102 206 112 C216 96 218 74 210 60Z" fill="#7a4720"/>
          <ellipse cx="268" cy="98" rx="22" ry="16" fill="#e6c49a"/>
          <circle cx="248" cy="78" r="6" fill="#22303c"/><circle cx="250" cy="76" r="2" fill="#fff"/>
          <ellipse cx="284" cy="92" rx="8" ry="6" fill="#22303c"/>
          <path d="M268 106 Q276 114 286 106" stroke="#22303c" stroke-width="3" fill="none" stroke-linecap="round"/>
          <rect x="214" y="112" width="40" height="9" rx="4" fill="#3d7be0"/>
          <text class="zzz" x="270" y="40" font-size="26" font-weight="800" fill="#22303c">z z</text>
        </g>
        <circle class="ball" cx="300" cy="150" r="12" fill="#c7ea46" stroke="#8bb31d" stroke-width="3"/>
      </g>
      <g class="book"><rect x="250" y="160" width="62" height="40" rx="4" fill="#ff8a3d"/><rect x="280" y="160" width="3" height="40" fill="#e86f1f"/><path d="M256 170h20M256 178h20M287 170h20M287 178h20" stroke="#fff" stroke-width="3"/></g>
      <g class="bush"><ellipse cx="130" cy="170" rx="95" ry="42" fill="#4f9a3a"/><ellipse cx="80" cy="150" rx="50" ry="40" fill="#5fae47"/><ellipse cx="175" cy="148" rx="55" ry="42" fill="#5fae47"/><circle cx="214" cy="104" r="0" fill="none"/></g>
    </svg>
  </div>

  <!-- start -->
  <section class="card" id="start">
    <div class="ask">Echo is a cheeky dog. Teach him tricks! <button class="say" data-say="Echo is a cheeky dog. Teach him tricks! Type your trainer name, then press Start." aria-label="Hear it">🔊</button></div>
    <input id="tName" maxlength="20" placeholder="Trainer name" aria-label="Your trainer name">
    <button class="big" id="go">Start ▶</button>
  </section>

  <!-- play -->
  <section class="card" id="play" hidden>
    <div class="ask"><span>Tell Echo:</span><span class="ic" id="aIc"></span><span class="word" id="aWord"></span><button class="say" id="aSay" aria-label="Hear the trick">🔊</button></div>
    <div class="cmds" id="cmds"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="row" id="after"></div>
    <div class="row"><button class="toggle" id="wordMode" aria-pressed="false">📖 Words only</button><button class="toggle" id="sound" aria-pressed="true">🔊 Voice on</button></div>
  </section>
</main>

<div class="unlock" id="unlock" hidden><div class="card"><div id="uText"></div><button class="big" id="uOk">OK!</button></div></div>

<script>
(function(){
"use strict";
var TRICKS = [
  {id:"sit",  word:"sit",       ic:"⬇️", at:0,  pose:"sit"},
  {id:"down", word:"down",      ic:"🛏️", at:2,  pose:"down"},
  {id:"shake",word:"shake",     ic:"🤝", at:4,  pose:"shake"},
  {id:"spin", word:"spin",      ic:"🌀", at:6,  pose:"spin"},
  {id:"stay", word:"stay",      ic:"✋", at:8,  pose:"stay"},
  {id:"jump", word:"jump",      ic:"⬆️", at:10, pose:"jump"},
  {id:"fetch",word:"fetch",     ic:"🎾", at:13, pose:"fetch"},
  {id:"dance",word:"dance",     ic:"🕺", at:16, pose:"dance"},
  {id:"roll", word:"roll over", ic:"🔄", at:19, pose:"roll"},
  {id:"read", word:"read",      ic:"📖", at:22, pose:"read"}
];
var CHEEKY = [
  {pose:"tailchase", line:"Ha! Echo chased his tail!"},
  {pose:"yawn",      line:"Echo did a big yawn!"},
  {pose:"runoff",    line:"Echo ran off!"},
  {pose:"sniff",     line:"Echo is sniffing the grass!"},
  {pose:"tilt",      line:"Woof! Echo just barked!"},
  {pose:"hide",      line:"Where is Echo? He is hiding!"},
  {pose:"hide",      line:"Sneaky Echo! He hid in the bush!"}
];
var KEY = "echo-tricks.v1";
var S = {name:"", treats:0, best:0, words:false, voice:true};
try{ var sv = JSON.parse(localStorage.getItem(KEY) || "null"); if(sv) for(var k in sv) S[k] = sv[k]; }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
var streak = 0, target = null, seen = {}, busy = false, unlockedCount = 0;
var $ = function(id){ return document.getElementById(id); };
var dog = $("dog");

/* ---- voice and sounds ---- */
function speak(t, slow){
  if(!S.voice || !window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.rate = slow ? 0.65 : 0.9; u.pitch = 1.05; speechSynthesis.speak(u); }catch(e){}
}
var AC = null;
function ding(ok){
  try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var notes = ok ? [523, 659, 784] : [330, 262], t = AC.currentTime;
    notes.forEach(function(f, i){ var o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; o.type = "triangle";
      g.gain.setValueAtTime(0.0001, t + i * 0.11); g.gain.exponentialRampToValueAtTime(0.18, t + i * 0.11 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.11 + 0.25);
      o.connect(g); g.connect(AC.destination); o.start(t + i * 0.11); o.stop(t + i * 0.11 + 0.3); });
  }catch(e){}
}
function bubble(t){ var b = $("bubble"); b.textContent = t; b.classList.add("on"); clearTimeout(bubble.t); bubble.t = setTimeout(function(){ b.classList.remove("on"); }, 1800); }
function pose(p, ms, cb){ dog.setAttribute("class", ""); void dog.getBoundingClientRect(); dog.setAttribute("class", p); setTimeout(function(){ if(cb) cb(); }, ms || 1300); }
function bones(n){
  var r = dog.getBoundingClientRect();
  for(var i = 0; i < n; i++){ var s = document.createElement("span"); s.className = "fly"; s.textContent = "🦴";
    s.style.left = (r.left + r.width / 2) + "px"; s.style.top = (r.top + r.height / 3) + "px";
    var a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 90; s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d - 60 + "px");
    document.body.appendChild(s); setTimeout(function(x){ return function(){ x.remove(); }; }(s), 1300); }
}

/* ---- screens ---- */
function unlocked(){ return TRICKS.filter(function(t){ return S.treats >= t.at; }); }
function hud(){ $("hName").textContent = "🧢 " + (S.name || "Trainer"); $("hTreats").textContent = S.treats; $("hStreak").textContent = streak; $("hBest").textContent = S.best; }
function renderCmds(){
  $("cmds").innerHTML = TRICKS.map(function(t){
    var on = S.treats >= t.at;
    return '<button class="cmd' + (on ? "" : " locked") + '" data-id="' + t.id + '"' + (on ? "" : ' aria-disabled="true" aria-label="Locked trick"') + '><span class="ic">' + (on ? t.ic : "🔒") + '</span><span>' + (on ? t.word : "?") + '</span></button>';
  }).join("");
  document.body.classList.toggle("words", !!S.words);
}
function next(){
  var list = unlocked(), pick;
  do { pick = list[Math.floor(Math.random() * list.length)]; } while(list.length > 1 && target && pick.id === target.id);
  target = pick; busy = false;
  $("aWord").textContent = target.word; $("aIc").textContent = target.ic; $("msg").textContent = ""; $("after").innerHTML = "";
  pose("", 10);
  setTimeout(function(){ speak("Tell Echo: " + target.word); }, 250);
}
function correct(){
  busy = true;
  var cheeky = !seen[target.id] || Math.random() < 0.3;
  seen[target.id] = true;
  if(cheeky){
    var c = CHEEKY[Math.floor(Math.random() * CHEEKY.length)];
    if(c.pose === "tilt") bubble("Woof!");
    pose(c.pose, 1500, function(){
      $("msg").textContent = c.line; speak(c.line + " Show him a treat.");
      $("after").innerHTML = '<button class="big" id="treat">🦴 Show a treat</button>';
      $("treat").onclick = function(){ $("after").innerHTML = ""; doTrick(); };
    });
  } else doTrick();
}
function doTrick(){
  var ms = target.pose === "fetch" ? 1900 : target.pose === "dance" ? 1900 : target.pose === "roll" ? 1200 : 1100;
  if(target.pose === "read") bubble("Echo loves a story!");
  pose(target.pose, ms, function(){
    var before = unlocked().length;
    S.treats++; streak++; if(streak > S.best) S.best = streak; save(); hud();
    ding(true); bones(6);
    var praise = ["Good boy, Echo!", "Yes! Nice work, " + (S.name || "trainer") + "!", "Echo did it!", "Great trick!"][Math.floor(Math.random() * 4)];
    $("msg").textContent = praise + " 🦴"; speak(praise);
    var now = unlocked();
    if(now.length > before){ var t = now[now.length - 1]; renderCmds(); setTimeout(function(){ showUnlock(t); }, 1200); }
    else setTimeout(next, 1700);
  });
}
function wrong(t){
  ding(false); pose("tilt", 900);
  $("msg").textContent = "Echo tilts his head. That says " + t.word + ".";
  speak("That says " + t.word + ". Find " + target.word + ".");
}
function showUnlock(t){
  $("uText").innerHTML = 'New trick!<br><span style="font-size:60px">' + t.ic + '</span><br><b style="font-size:44px">' + t.word + '</b>';
  $("unlock").hidden = false; speak("New trick! " + t.word);
}
$("uOk").onclick = function(){ $("unlock").hidden = true; next(); };

$("cmds").addEventListener("click", function(e){
  var b = e.target.closest(".cmd"); if(!b || busy || b.classList.contains("locked")) return;
  var t = TRICKS.filter(function(x){ return x.id === b.dataset.id; })[0];
  if(t.id === target.id){ speak(t.word); correct(); } else { streak = 0; hud(); wrong(t); }
});
$("aSay").onclick = function(){ speak(target.word + ". " + target.word, true); };
$("wordMode").onclick = function(){ S.words = !S.words; save(); this.setAttribute("aria-pressed", S.words); renderCmds(); speak(S.words ? "Words only. Read the word, then tap it." : "Pictures and words."); };
$("sound").onclick = function(){ S.voice = !S.voice; save(); this.setAttribute("aria-pressed", S.voice); this.textContent = S.voice ? "🔊 Voice on" : "🔇 Voice off"; if(S.voice) speak("Voice on."); };
document.querySelectorAll("[data-say]").forEach(function(b){ b.onclick = function(){ speak(b.dataset.say); }; });
$("tName").value = S.name || "";
$("go").onclick = function(){
  S.name = $("tName").value.trim().slice(0, 20); save();
  $("start").hidden = true; $("play").hidden = false; $("hud").hidden = false;
  $("wordMode").setAttribute("aria-pressed", !!S.words);
  $("sound").setAttribute("aria-pressed", !!S.voice); $("sound").textContent = S.voice ? "🔊 Voice on" : "🔇 Voice off";
  hud(); renderCmds(); speak("Hi " + (S.name || "trainer") + "! Let's teach Echo."); setTimeout(next, 1600);
};
})();
</script>
</body>
</html>
