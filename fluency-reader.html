<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fluency Reader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@600&display=swap">
<style>
:root{--paper:#f6f8f4;--card:#fff;--ink:#1d2a26;--muted:#5e6d68;--line:#c9d4cf;--accent:#1f6f62;--accent-ink:#fff;
 --row1:#bfdcff;--row1e:#2f7fd6;--row2:#ffe08a;--row2e:#d49a00;--row3:#bdeab3;--row3e:#2e9a3e;--f-read:"Andika","Atkinson Hyperlegible",Verdana,system-ui,sans-serif;--f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--paper:#121a18;--card:#1a2422;--ink:#e8efec;--muted:#9fb0aa;--line:#34443f;--accent:#5cc3ad;--accent-ink:#0d1a17;--row1:#1f4a78;--row1e:#6fb2ff;--row2:#6b5310;--row2e:#ffcc33;--row3:#24572c;--row3e:#6fdc7e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-read)}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0}
select,button{font:inherit;font-size:18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--f-display);font-size:24px;padding:14px 32px}
.box{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 20px}
h2{font-size:26px;text-align:center;margin:0 0 8px}
.text{position:relative;font-size:clamp(22px,3.4vw,30px);line-height:1.9;height:calc(1.9em * 4.5);overflow-y:auto;scrollbar-gutter:stable;padding-right:6px}
.ln{display:block;padding:1px 12px;border-radius:8px}
.text{display:flex;flex-direction:column;gap:3px}
.ln:nth-child(3n+1){background:var(--row1);border-left:8px solid var(--row1e)}.ln:nth-child(3n+2){background:var(--row2);border-left:8px solid var(--row2e)}.ln:nth-child(3n){background:var(--row3);border-left:8px solid var(--row3e)}
.cover{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 0;text-align:center;font-size:20px}
.tip{color:var(--muted);text-align:center;font-size:17px}
</style></head><body><div class="wrap">
<div class="top"><h1>Fluency Reader</h1>
<label>Story <select id="pick"></select></label></div>
<div class="box">
 <div class="cover" id="cover"><p>Wait for your coach to say go.</p><button class="go" type="button" id="go">Start reading</button></div>
 <div id="story" hidden><h2 id="title"></h2><div class="text" id="text" tabindex="0"></div></div>
</div>
<p class="tip">Scroll down to see more. Keep your finger or mouse on the line you are reading.</p>
</div>
<script>
const P=[{"id":"g2-kite","title":"The Lost Kite","text":"Sam had a red kite with a long tail. On a windy day, he ran to the top of the hill with his kite. The kite went up and up until it was just a small dot in the sky. Then the string slipped out of his hand, and Sam yelled and ran after it. The kite drifted over the pond and landed in a tall oak tree. Sam's sister Jen came to help. She stood on a big rock and reached up with a long stick, but she still could not get it. Then a bird landed on the branch, and the kite fell down into the grass. Sam picked it up and checked the tail. It was a little bent, but it still worked. This time they tied the string to Sam's wrist, and the kite flew all afternoon."},{"id":"g2-pond","title":"Rain Day at the Pond","text":"It rained all morning, so Mia put on her green boots and her yellow coat. She walked down the path to the pond. She wanted to see what was out. Frogs were jumping from rock to rock. A duck and her six ducklings swam in a line near the shore, and Mia counted them twice to be sure. Under a flat stone, she found a fat brown toad. It blinked at her and did not hop away. Mia sat on a log and watched the drops make rings on the water. When the rain stopped, the sun came out and a rainbow stretched across the sky. Mia ran home to tell her dad. He said it was the best kind of day for a walk."},{"id":"g2-fort","title":"Max Builds a Fort","text":"Max wanted to build a fort in the back yard. He found three old boxes, a blanket, and some rope in the shed. First he stacked the boxes to make the walls, and then he threw the blanket over the top for a roof. The wind kept blowing the blanket off, so he tied the corners down with rope. Max made a sign. It said Keep Out, but cats can come in. His cat Pepper walked right in and curled up on a pillow. Max brought a flashlight, a snack, and his best book. He read until the sun went down and the stars came out. Mom called him in for dinner. Max said the fort was the best place in the whole world."},{"id":"g2-moon","title":"A Trip to the Moon","text":"Ava and her brother made a rocket out of a big box. They painted it gray and drew round windows on the sides. Ava was the pilot. Ben was in charge of the map. They counted down from ten and shouted blast off. In their game, the rocket zoomed past clouds and shooting stars. They landed on the moon with a soft bump. Ava stepped out and left a footprint in the gray dust. Ben planted a flag that he made from a straw and a bit of paper. They looked back and saw the Earth, blue and white and far away. Then it was time to fly home, because lunch was ready."},{"id":"g2-soccer","title":"The Big Game","text":"Luis had a soccer game on Saturday morning. He put on his blue shirt and laced up his cleats. His team was called the Sharks, and the other team wore orange and ran very fast. At first, the Sharks could not get the ball past them, and Luis felt his cheeks get hot. At halftime, the coach told them to pass more and to keep their heads up. In the second half, Luis passed the ball to his friend Nora. Nora kicked it hard, and it sailed right into the net. The Sharks cheered and jumped up and down. The game ended in a tie, but Luis did not mind at all. He had made the pass that helped his team score."},{"id":"g2-cookies","title":"Baking with Grandpa","text":"On Sunday, Grandpa and Ella baked cookies. First, they washed their hands and put on their aprons. Ella cracked two eggs into the bowl. A bit of shell fell in. Grandpa helped her fish it out with a spoon. Then they put in the butter, the sugar, and the flour. Ella stirred until her arm got tired. Grandpa let her pour in the chips, and she ate three of them. They rolled the dough into balls and set them on a pan. As they baked, the whole house smelled sweet and warm. When the timer rang, Grandpa took the pan out of the oven. They let the cookies cool, and then they shared them with the kids next door."},{"id":"g2-hamster","title":"The Class Hamster","text":"Our class has a hamster named Peanut. He is tan and white and has a pink nose. Every week, a different kid gets to take care of him. This week, it was my turn. I filled his water bottle and gave him fresh seeds. I also cleaned his cage with help from my teacher. Peanut likes to run on his wheel at night, and in the morning, he sleeps in a little ball of fluff. One day Peanut got out of his cage. We looked under every desk and behind every shelf. At last, we found him in the art bin, sitting on top of a pile of paper. He was chewing a crayon. We put him back and made sure the door was shut tight."},{"id":"g2-snow","title":"Snow Day","text":"When Jake woke up, the yard was covered in snow. School was closed, so he got to play outside all day. He pulled on his snow pants, his boots, and his thick red mittens. First he made a snow angel by lying down and flapping his arms. Then he rolled three big balls of snow to build a snowman. He used rocks for the eyes and a carrot for the nose. His little sister gave it her old striped scarf. Next they went sledding down the hill behind their house. The sled went so fast that they tipped over at the bottom. They laughed and climbed back up again and again. When their toes got cold, they went inside for hot cocoa."},{"id":"g2-camping","title":"A Night in the Tent","text":"Our family went camping by a lake. Dad and I set up the tent while Mom made a fire. The poles kept falling down, but we did not give up. When the tent was finally up, I put my sleeping bag inside. For dinner we cooked hot dogs on long sticks. After that we made s'mores with melted marshmallows. When it got dark, we heard an owl hooting in the trees. The sky was full of stars, more than I had ever seen. Dad showed me the Big Dipper. Later, something scratched on the side of the tent. I held my breath. Mom shined her flashlight outside. It was just a raccoon looking for our snacks."},{"id":"g2-firehouse","title":"A Visit to the Fire Station","text":"Our class took a trip to the fire station. A firefighter named Rosa met us at the door. She showed us the big red truck with its long ladder. We got to sit in the front seat and ring the bell. Rosa told us that firefighters must be ready to go at any time. Their boots and pants wait right next to the truck, so they can get dressed fast. She put on all of her gear to show us. With her mask and air tank, she looked like a deep sea diver. Rosa said that a firefighter in full gear might look scary. If we ever see one in a fire, we should not hide. We should call out so they can find us and help."},{"id":"g2-lemonade","title":"The Lemonade Stand","text":"Kayla and Omar wanted to earn money for a new ball. They made a plan to sell lemonade. They squeezed lemons into a big jug. Then they put in sugar and water and stirred it. Omar made a sign that said Cold Lemonade, Fifty Cents. They set up a table at the end of the driveway. At first, no one came by. Then a man walking his dog stopped and bought a cup. Next came two kids on bikes. By noon, the sun was hot, and lots of people were thirsty. Soon the jug was empty. Kayla counted the coins and found they had six dollars. They needed two more, so they made more the next day."},{"id":"g2-robot","title":"The Science Fair Robot","text":"For the science fair, Priya wanted to build a robot that could pick up trash. She used a small toy car, a cup, and two craft sticks for arms. Her mom helped her add a motor and a switch. The first time Priya tried it, the robot spun in circles. The second time, its arms fell off. Priya did not quit. She used stronger tape and moved the motor to the middle. On the third try, the robot rolled forward and scooped up a paper ball. Priya clapped and yelled for her mom. At the fair, lots of kids lined up to watch it work. Priya did not win first place, but she was proud of her robot."},{"id":"g2-puppy","title":"The Lost Puppy","text":"On the way home from school, Ty heard a small whine behind a fence. He peeked through a gap. He saw a brown puppy with floppy ears. The puppy had a red collar but no tag. Ty did not want to leave it alone. He ran home and told his mom. They went back together with a bowl of water. The puppy drank it all and licked Ty's hand. Mom took a picture and put it online so the owner could see. That night, a girl named Nora called them. She said the puppy was named Biscuit and had dug under her fence. When Nora came to get Biscuit, she hugged him and thanked Ty again and again."},{"id":"g2-dino","title":"The Dinosaur Museum","text":"Zoe loves the dinosaur museum. When you walk in, a giant skeleton stands in the hall. It is so tall that Zoe has to tip her head all the way back to see the top. The sign says it ate plants. It also had a very long neck. In the next room, there is a small dinosaur with sharp teeth. Zoe pressed her face to the glass to look at its claws. There was a sand pit too. Kids could dig for bones with brushes. Zoe found a plastic tooth and felt like a real scientist. Before they left, she got a card with a T rex on it. She hung it over her bed that night."},{"id":"g2-garden","title":"Growing a Garden","text":"In the spring, Grandma helped Noah plant seeds. They dug rows in the dirt with a small shovel. Noah dropped in seeds for beans, carrots, and big sunflowers, and then he gave each row a drink from the hose. Each day, he checked to see if the seeds had come up. For a whole week, he saw only dirt. Then tiny green shoots poked out of the ground. Noah pulled the weeds and kept the soil wet. By summer, the beans were climbing up the fence, and the sunflowers were taller than Grandpa. In the fall, Noah pulled up a carrot. It was bumpy and a bit bent. But it was the best carrot he had ever eaten."},{"id":"g2-bike","title":"Learning to Ride","text":"Mila got a new bike for her birthday. It was purple with silver stripes and a bell. The only problem was that she did not know how to ride without training wheels. Her dad took her to the park, where the path was flat and smooth. He held the back of the seat while she pushed the pedals. Mila wobbled and almost fell. Dad said to look straight ahead instead of at her feet. They tried again and again. On the tenth try, Mila looked back and saw that Dad had let go. She was riding all by herself! She rang her bell as loud as she could. By the end of the day, she could ride all the way around the park."},{"id":"g2-tidepool","title":"Tide Pools","text":"At low tide, Eli and his mom walked out on the wet rocks by the sea. Small pools of water were left in the rocks. Eli knelt down to look. He saw a purple sea star stuck to the side of a rock. Green sea anemones waved their arms in the water. They look like plants, but they are animals. When Eli touched one gently, it closed up like a fist. A small crab ran sideways and hid under some seaweed. Mom said to be careful where they stepped, because the pools were home to lots of sea life. They did not take a thing with them. They just looked and took pictures. When the waves started to come back in, they walked back to the sand."},{"id":"g2-beaver","title":"The Busy Beaver","text":"A beaver lives by the river behind our school. You can tell it is there because of the trees. Some of them have been chewed into points. Beavers have strong front teeth that never stop growing. They use them to cut down small trees. Then they drag the wood into the water and pile it up with mud and rocks. This makes a dam. The dam slows down the river and makes a pond. In the middle of the pond, the beaver builds a home called a lodge. The door is under the water, so other animals cannot get in. We have never seen the beaver, but we see more of its work each week."},{"id":"g2-storm","title":"Storm in the Back Yard","text":"Ruby and Finn were playing in the back yard when the sky turned dark. Big drops started to fall. Then thunder rumbled, and the wind shook the trees. \"When thunder roars, go indoors,\" Ruby said. They ran inside right away and shut the door. Mom gave them a quilt. They sat by the window to listen to the rain. Finn counted the seconds between each flash and each boom. The numbers got bigger and bigger. That meant the storm was moving away. After a while, the rain slowed down. The sun peeked out, and the wet leaves dripped and sparkled. They waited a bit longer to be safe, and then they went back out to play."},{"id":"g2-market","title":"Saturday at the Market","text":"On Saturdays, Ming and her mom go to the farmers market. Lots of tents are set up in a big lot. One farmer sells red apples and fresh corn. A man sells honey in tall jars. He has a real beehive in a glass box. Ming likes to watch the bees crawl around inside. Her mom gives her five dollars to spend. This week, Ming chose a box of plump blueberries. She also tried a free taste of peach jam on a cracker. A man played a fiddle, and some kids danced. When they got home, Ming and her mom made blueberry pancakes. Ming said the berries tasted like summer."}];
const $=id=>document.getElementById(id);
P.forEach((p,i)=>{const o=document.createElement("option");o.value=p.id;o.textContent=(i+1)+". "+p.title;$("pick").appendChild(o);});
function show(id){const p=P.find(x=>x.id===id)||P[0];$("pick").value=p.id;$("title").textContent=p.title;
 const t=$("text");t.innerHTML="";const one=document.createElement("span");one.className="ln";p.text.split(" ").forEach((x,k)=>{const w=document.createElement("span");w.className="w";w.textContent=x;one.appendChild(w);one.appendChild(document.createTextNode(" "));});t.appendChild(one);t.scrollTop=0;
 $("story").hidden=true;$("cover").hidden=false;}
$("pick").onchange=e=>{show(e.target.value);try{history.replaceState(null,"","#"+e.target.value)}catch(_){}};
function fit(){const t=$("text");if($("story").hidden)return;const ws=[...t.querySelectorAll(".w")];if(!ws.length)return;
 const one=document.createElement("span");one.className="ln";ws.forEach(w=>{one.appendChild(w);one.appendChild(document.createTextNode(" "));});t.innerHTML="";t.appendChild(one);
 const tops=ws.map(w=>w.offsetTop);const rows=[];let g=[];ws.forEach((w,k)=>{if(g.length&&tops[k]>tops[k-1]+5){rows.push(g);g=[];}g.push(w);});if(g.length)rows.push(g);
 t.innerHTML="";rows.forEach(g=>{const d=document.createElement("span");d.className="ln";g.forEach(w=>{d.appendChild(w);d.appendChild(document.createTextNode(" "));});t.appendChild(d);});}
let fT;window.addEventListener("resize",()=>{clearTimeout(fT);fT=setTimeout(fit,150);});
$("go").onclick=()=>{$("cover").hidden=true;$("story").hidden=false;fit();try{document.fonts.ready.then(fit)}catch(e){}$("text").focus();};
show(location.hash.slice(1));
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
</script></body></html>
