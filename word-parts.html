<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Word Parts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Word Parts: partners take turns adding parts to build a word, then each
   gets one move in a game they chose. Taps only, no sound, no typing. */
:root{--bg:#f2f7f4;--card:#ffffff;--ink:#1f2a24;--muted:#5d6b63;--line:#d6e3db;--pre:#d9534f;--preBg:#fbe7e6;--base:#2f6fb5;--baseBg:#e3eefa;--suf:#7a4fb8;--sufBg:#efe7fa;--go:#237a43;--goBg:#e2f4e8;--slot:#e9efeb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121915;--card:#1b241f;--ink:#e8f0eb;--muted:#a8b8ae;--line:#2c3a32;--pre:#f19a95;--preBg:#3a2221;--base:#8fbaf0;--baseBg:#1d2b3d;--suf:#c4a5f2;--sufBg:#2c2240;--go:#8fe0a6;--goBg:#183a24;--slot:#23302a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121915;--card:#1b241f;--ink:#e8f0eb;--muted:#a8b8ae;--line:#2c3a32;--pre:#f19a95;--preBg:#3a2221;--base:#8fbaf0;--baseBg:#1d2b3d;--suf:#c4a5f2;--sufBg:#2c2240;--go:#8fe0a6;--goBg:#183a24;--slot:#23302a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;padding-block:20px 140px;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:800 36px/1.1 "Baloo 2",system-ui,sans-serif;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.who{font-size:28px;font-weight:700}
.status{color:var(--muted);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.clue{font:800 26px/1.25 "Baloo 2",system-ui,sans-serif;text-align:center;text-wrap:balance}
.clue small{display:block;font:700 14px "Atkinson Hyperlegible",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.turn{text-align:center;font:800 22px/1.2 "Baloo 2",system-ui,sans-serif;border-radius:14px;padding:8px 12px;background:var(--slot)}
.turn.me{background:var(--goBg);color:var(--go)}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slot{min-width:120px;min-height:76px;border:3px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 14px}
.slot b{font:800 32px/1.1 "Baloo 2",system-ui,sans-serif}
.slot span{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.slot em{font-style:normal;font-size:18px}
.slot.pre.on{border-style:solid;border-color:var(--pre);background:var(--preBg)}
.slot.base.on{border-style:solid;border-color:var(--base);background:var(--baseBg)}
.slot.suf.on{border-style:solid;border-color:var(--suf);background:var(--sufBg)}
.label{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{font:800 28px/1 "Baloo 2",system-ui,sans-serif;border-radius:14px;padding:14px 20px;border:3px solid;min-width:96px}
.tile.pre{color:var(--pre);border-color:var(--pre);background:var(--preBg)}
.tile.base{color:var(--base);border-color:var(--base);background:var(--baseBg)}
.tile.suf{color:var(--suf);border-color:var(--suf);background:var(--sufBg)}
.tile:disabled{opacity:.35;cursor:default}
.tile.no{animation:no .4s}
@keyframes no{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint{text-align:center;color:var(--muted);min-height:1.5em}
.done{background:var(--goBg);border-color:var(--go);text-align:center}
.big{font:800 52px/1.1 "Baloo 2",system-ui,sans-serif;color:var(--go);overflow-wrap:anywhere}
.big i{font-style:normal;color:var(--muted)}
.go{font:800 22px "Baloo 2",system-ui,sans-serif;border:none;border-radius:999px;padding:12px 28px;background:var(--go);color:var(--card);align-self:center}
.go:disabled{opacity:.35;cursor:not-allowed}
.alt{background:none;border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:700;align-self:center}
.count{text-align:center;color:var(--muted)}
.picks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.picks button{font:800 20px "Baloo 2",system-ui,sans-serif;border:3px solid var(--go);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 18px;min-width:150px}
.picks button:disabled{opacity:.4;cursor:default}
.board{display:flex;justify-content:center}
.ttt{display:grid;grid-template-columns:repeat(3,72px);grid-auto-rows:72px;gap:6px}
.ttt button{font-size:40px;line-height:1;border:2px solid var(--line);background:var(--card);border-radius:14px}
.four{display:grid;grid-template-columns:repeat(7,40px);grid-auto-rows:40px;gap:4px;background:var(--base);padding:6px;border-radius:12px}
.four button{font-size:24px;line-height:1;border:none;background:var(--card);border-radius:50%;padding:0}
.mem{display:grid;grid-template-columns:repeat(4,64px);grid-auto-rows:64px;gap:8px}
.mem button{font-size:32px;line-height:1;border:2px solid var(--line);background:var(--suf);border-radius:12px;position:relative}
.mem button.up{background:var(--card)}
.mem button.won{background:var(--goBg);border-color:var(--go)}
.mem button sup{position:absolute;top:2px;right:4px;font-size:14px}
.board button:disabled{cursor:default}
.board button.win{background:var(--goBg);outline:3px solid var(--go)}
.score{text-align:center;font-weight:700;font-size:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Word Parts 🧩</h1><div><div class="who" id="who"></div><div class="status" id="status"></div></div></div>

  <section class="card" id="gate">
    <p class="clue">Play with your partner: type your coach's room code in the timer box in the bottom-right corner, then tap your animal.</p>
    <button class="go" id="joinBtn" type="button">Show the room code box</button>
    <button class="alt" id="solo" type="button">Practice on my own</button>
  </section>

  <section class="card" id="start" hidden>
    <div class="clue"><small>Before you build</small>Pick the game you want to play between words!</div>
    <div class="picks" id="startPicks"></div>
    <div class="turn" id="startNote" aria-live="polite"></div>
  </section>

  <section class="card" id="play" hidden>
    <div class="clue" id="clue"></div>
    <div class="turn" id="buildTurn" aria-live="polite"></div>
    <div class="slots" id="slots"></div>
    <div class="label">Word parts</div>
    <div class="tiles" id="tiles"></div>
    <div class="hint" id="hint" aria-live="polite"></div>
  </section>

  <section class="card done" id="done" hidden>
    <div class="big" id="bigWord"></div>
    <div class="clue" id="readIt"></div>
    <div class="turn" id="gameTurn" aria-live="polite"></div>
    <div class="board" id="board"></div>
    <div class="score" id="score"></div>
    <button class="go" id="next" type="button">Next word ▶</button>
  </section>
  <button class="alt" id="both" type="button" hidden>Partner not here? Play both sides</button>

  <div class="count" id="count"></div>
</main>

<script src="turn-timer.js?v=7" data-float></script>
<script>
(function(){
"use strict";
var WORDS = [
  ["un","break","able","not able to be broken"],
  ["re","read","ing","reading something again"],
  ["dis","agree","ment","when people do not agree"],
  ["pre","heat","ed","heated before"],
  ["mis","spell","ed","spelled the wrong way"],
  ["re","fill","able","able to be filled again"],
  ["un","help","ful","not helpful"],
  ["un","fair","ness","the feeling of something not being fair"],
  ["dis","honest","ly","in a way that is not honest"],
  ["over","cook","ed","cooked for too long"],
  ["under","water","","below the water"],
  ["non","stop","","without stopping"],
  ["in","complete","","not complete"],
  ["dis","appear","ing","going out of sight"],
  ["pre","pay","ment","paying ahead of time"],
  ["un","cover","ed","found after being hidden"],
  ["re","play","ed","played again"],
  ["mis","read","ing","reading something the wrong way"],
  ["un","kind","ness","the act of not being kind"],
  ["re","view","ed","looked at again"]
];
var PRE = ["un","re","dis","pre","mis","non","over","under","in"];
var SUF = ["able","ed","ing","ful","ness","ment","ly","less"];
var BASE = WORDS.map(function(w){ return w[1]; }).filter(function(b, i, a){ return a.indexOf(b) === i; });
var GAMES = {tic:{name:"Tic-Tac-Toe", icon:"⭕"}, four:{name:"Four in a Row", icon:"🔴"}, mem:{name:"Memory Match", icon:"🃏"}};
var CARDS = ["🍎","🚀","🌈","⚽","🎸","🐙"];
var LINES3 = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var ROBOT = "🤖";
var $ = function(id){ return document.getElementById(id); };
var TT = window.TurnTimer, card = TT && TT.card, esc = TT ? TT.esc : function(s){ return String(s); };
var AV = (TT && TT.AVATARS) || [];

function rng(seed){ var h = 2166136261; for(var i = 0; i < seed.length; i++){ h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); } return function(){ h += 0x6D2B79F5; var t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(a, r){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pickOthers(pool, not, k, r){ return shuffle(pool.filter(function(x){ return x !== not; }), r).slice(0, k); }

var me = "", partner = "", soloMode = false, bothMode = false, key = "", G = null, lastHeard = 0, robotTimer = 0;
function blank(r){ return {r:r || 0, f:{pre:"", base:"", suf:""}, n:0, sq:0, ch:{}, q:[], qi:0, gm:"", b:null, mv:0, w:"", s:{}, t:Date.now()}; }
function norm(g){ var b = blank(g.r); for(var k in b) if(g[k] === undefined) g[k] = b[k]; return g; }
function load(k){
  try{ var g = JSON.parse(localStorage.getItem("wp3-" + k) || "null"); return g && Date.now() - (g.t || 0) < 3 * 3600000 ? g : null; }catch(e){ return null; }   // a new session starts fresh
}
function keep(){ G.t = Date.now(); try{ localStorage.setItem("wp3-" + key, JSON.stringify(G)); }catch(e){} }
function ready(){ return G.q && G.q.length > 0; }

/* both partners pick a game before building. Same pick: play it. Different picks: take turns, one game each. */
function maybeStart(){
  var need = soloMode || !partner ? [me] : players();
  if(!need.every(function(a){ return G.ch[a]; })) return false;
  var picks = need.map(function(a){ return G.ch[a]; });
  G.q = picks.length === 1 || picks[0] === picks[1] ? [picks[0]] : picks;
  G.qi = 0; G.gm = G.q[0]; G.b = newBoard(G.gm, 0); G.mv = 0; G.w = "";
  return true;
}
function order(){ return shuffle(WORDS.map(function(w, i){ return i; }), rng("order|" + key)); }
function word(){ var o = order(); return WORDS[o[G.r % o.length]]; }

/* the two players, in a fixed order both screens agree on */
function players(){
  if(soloMode || !partner) return [me, ROBOT];
  return [me, partner].sort(function(a, b){ return AV.indexOf(a) - AV.indexOf(b); });
}
function canAct(who){ return who === me || (bothMode && who !== ROBOT); }

/* ---------- building: partners alternate, one part each ---------- */
function filled(){ return ["pre", "base", "suf"].filter(function(p){ return G.f[p]; }).length; }
function builder(){ if(soloMode || !partner) return me; return players()[(G.r + filled()) % 2]; }
function complete(){ var w = word(); return !!(G.f.pre && G.f.base && (G.f.suf || !w[2])); }
function tiles(){
  var w = word(), r = rng("tiles|" + key + "|" + G.r), out = [];
  out = out.concat([w[0]].concat(pickOthers(PRE, w[0], 2, r)).map(function(t){ return {t:t, p:"pre"}; }));
  out = out.concat([w[1]].concat(pickOthers(BASE, w[1], 1, r)).map(function(t){ return {t:t, p:"base"}; }));
  out = out.concat((w[2] ? [w[2]] : []).concat(pickOthers(SUF, w[2], 1, r)).map(function(t){ return {t:t, p:"suf"}; }));
  return shuffle(out, r);
}

/* ---------- the games between words ---------- */
function mover(){ return players()[(G.r + G.mv) % 2]; }
function newBoard(gm, qi){
  if(gm === "tic") return {c:Array(9).fill("")};
  if(gm === "four") return {c:Array(42).fill("")};
  var deck = shuffle(CARDS.concat(CARDS), rng("deck|" + key + "|" + qi));      // same deck on both screens
  return {deck:deck, won:Array(12).fill(""), up:[], show:[]};
}
function winLine(){
  var c = G.b && G.b.c; if(!c) return null;
  if(G.gm === "tic"){ for(var i = 0; i < LINES3.length; i++){ var L = LINES3[i]; if(c[L[0]] && c[L[0]] === c[L[1]] && c[L[1]] === c[L[2]]) return L; } return null; }
  var dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for(var r = 0; r < 6; r++) for(var col = 0; col < 7; col++){
    var v = c[r * 7 + col]; if(!v) continue;
    for(var d = 0; d < 4; d++){
      var cells = [r * 7 + col], ok = true;
      for(var s = 1; s < 4; s++){ var rr = r + dirs[d][0] * s, cc = col + dirs[d][1] * s; if(rr < 0 || rr > 5 || cc < 0 || cc > 6 || c[rr * 7 + cc] !== v){ ok = false; break; } cells.push(rr * 7 + cc); }
      if(ok) return cells;
    }
  }
  return null;
}
function settle(who){
  if(G.gm === "mem"){
    if(G.b.won.every(function(x){ return x; })){
      var p = players(), a = G.b.won.filter(function(x){ return x === p[0]; }).length, b = G.b.won.filter(function(x){ return x === p[1]; }).length;
      G.w = a === b ? "draw" : (a > b ? p[0] : p[1]);
      if(G.w !== "draw") G.s[G.w] = (G.s[G.w] || 0) + 1;
    }
    return;
  }
  if(winLine()){ G.w = who; G.s[who] = (G.s[who] || 0) + 1; }
  else if(G.b.c.every(function(x){ return x; })) G.w = "draw";
}
function movesLeft(){ return !G.w && G.mv < 2; }
function play(i, who){
  if(!G.gm || !movesLeft()) return;
  if(G.gm === "tic"){ if(G.b.c[i]) return; G.b.c[i] = who; G.mv++; settle(who); }
  else if(G.gm === "four"){
    var col = i % 7, spot = -1;
    for(var r = 5; r >= 0; r--){ if(!G.b.c[r * 7 + col]){ spot = r * 7 + col; break; } }
    if(spot < 0) return;
    G.b.c[spot] = who; G.mv++; settle(who);
  } else {
    var m = G.b;
    if(m.won[i] || m.up.indexOf(i) >= 0) return;
    if(m.up.length === 0){ m.up = [i]; m.show = []; }
    else {
      var a = m.up[0];
      if(m.deck[a] === m.deck[i]){ m.won[a] = m.won[i] = who; }
      m.show = [a, i]; m.up = []; G.mv++; settle(who);
    }
  }
  commit();
}
function robotMove(){
  robotTimer = 0;
  if(!G || !G.gm || !movesLeft() || mover() !== ROBOT || !complete()) return;
  var open = [];
  if(G.gm === "mem"){ G.b.won.forEach(function(x, i){ if(!x && G.b.up.indexOf(i) < 0) open.push(i); }); }
  else if(G.gm === "four"){ for(var c = 0; c < 7; c++) if(!G.b.c[c]) open.push(c); }
  else G.b.c.forEach(function(x, i){ if(!x) open.push(i); });
  if(open.length) play(open[Math.floor(Math.random() * open.length)], ROBOT);
}
function scheduleRobot(){
  if(robotTimer || !(soloMode || !partner) || !G || !G.gm || !complete() || !movesLeft() || mover() !== ROBOT) return;
  robotTimer = setTimeout(robotMove, 800);
}

/* ---------- sharing state with the partner ---------- */
function commit(){ G.sq++; keep(); say(); paint(); scheduleRobot(); }
function say(){ if(card && partner && !soloMode) card.sendX({g:"wp2", k:key, s:G}); }

function setup(){
  var nextMe = card ? card.me() : "", ps = card ? card.partners() : [];
  var nextPartner = ps[0] || "";
  if(soloMode){ nextMe = nextMe || "🙂"; nextPartner = ""; }
  if(!nextMe){ $("gate").hidden = false; $("play").hidden = $("done").hidden = $("both").hidden = true; $("who").textContent = $("status").textContent = $("count").textContent = ""; return; }
  var nextKey = soloMode || !nextPartner ? "solo|" + nextMe : [nextMe, nextPartner].sort().join("");
  if(nextKey !== key || nextMe !== me || nextPartner !== partner){
    me = nextMe; partner = nextPartner; key = nextKey;
    G = norm(load(key) || blank(0));
    say();
  }
  $("gate").hidden = true;
  paint(); scheduleRobot();
}
if(card){
  card.onChange(setup);
  card.onX(function(m){
    if(!m || m.g !== "wp2" || m.k !== key || !G || !m.s) return;
    lastHeard = Date.now(); bothMode = false;
    var s = m.s, old = G;
    if(s.r > G.r || (s.r === G.r && s.sq > G.sq)) G = norm(s);
    else if(s.r < G.r || s.sq < G.sq) say();        // they're behind: catch them up
    if(!ready()){                                   // game picks can cross in the mail: keep both
      [old.ch || {}, s.ch || {}].forEach(function(o){ Object.keys(o).forEach(function(a){ if(!G.ch[a]) G.ch[a] = o[a]; }); });
      if(maybeStart()){ G.sq = Math.max(G.sq, s.sq) + 1; say(); }
    }
    keep(); paint();
  });
  setInterval(function(){ say(); paint(); }, 4000);
}
$("solo").addEventListener("click", function(){ soloMode = true; setup(); });
$("joinBtn").addEventListener("click", function(){ if(card && card.open) card.open(); });
$("both").addEventListener("click", function(){ bothMode = true; paint(); });

/* ---------- taps ---------- */
$("tiles").addEventListener("click", function(e){
  var b = e.target.closest(".tile"); if(!b || b.disabled) return;
  if(!canAct(builder())) return;
  var w = word(), p = b.dataset.p, t = b.dataset.t;
  var right = (p === "pre" && t === w[0]) || (p === "base" && t === w[1]) || (p === "suf" && t === w[2]);
  if(!right){
    b.classList.remove("no"); void b.offsetWidth; b.classList.add("no");
    $("hint").dataset.busy = "1"; $("hint").textContent = "Hmm, does that part fit the meaning? Try another.";
    setTimeout(function(){ $("hint").dataset.busy = ""; paint(); }, 1800);
    return;
  }
  G.f[p] = t; G.f[p + "By"] = builder();
  if(complete()) G.n += 1;
  commit();
});
$("startPicks").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b || b.disabled || ready()) return;
  var g = b.dataset.g;
  G.ch[me] = g;
  if(bothMode && partner && !G.ch[partner]) G.ch[partner] = g;
  maybeStart();
  commit();
});
$("board").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b || b.disabled) return;
  var who = mover(); if(!canAct(who)) return;
  play(+b.dataset.i, who);
});
$("next").addEventListener("click", function(){
  if(!G.gm || movesLeft()) return;
  var over = !!G.w, qi = over ? G.qi + 1 : G.qi, gm = G.q[qi % G.q.length];
  var n = {r:G.r + 1, f:{pre:"", base:"", suf:""}, n:G.n, sq:G.sq + 1, ch:G.ch, q:G.q, qi:qi, gm:gm, b:over ? newBoard(gm, qi) : G.b, mv:0, w:"", s:G.s};
  if(n.b && n.gm === "mem") n.b.show = [];
  G = n; keep(); say(); paint(); scheduleRobot();
});

/* ---------- drawing ---------- */
function setHTML(el, html){ if(el.dataset.html !== html){ el.dataset.html = html; el.innerHTML = html; } }   // redraw only on a change, so taps never land mid-redraw
function turnText(who, verb){ return who === me ? "Your turn" + verb : who === ROBOT ? "🤖 is thinking…" : bothMode ? who + "'s turn" + verb + " (you're playing both sides)" : who + "'s turn. Watch and get ready!"; }

function paint(){
  if(!G || !me) return;
  var w = word(), done = complete(), duo = partner && !soloMode;
  var heard = Date.now() - lastHeard < 10000;
  $("who").textContent = duo ? "You " + me + " + " + partner : "You " + me;
  $("both").hidden = !duo || bothMode || heard;
  $("status").textContent = soloMode ? "Practicing on your own" : !partner ? "No partner this round: you build every part." : bothMode ? "Playing both sides until " + partner + " is here" : heard ? partner + " is here!" : "Waiting for " + partner + "…";
  $("count").textContent = "Words built" + (duo ? " together" : "") + ": " + G.n;
  var go = ready();
  $("start").hidden = go; $("play").hidden = !go || done; $("done").hidden = !go || !done;
  if(!go){
    var picked = G.ch[me];
    setHTML($("startPicks"), Object.keys(GAMES).map(function(k){
      return '<button type="button" data-g="' + k + '"' + (picked ? " disabled" : "") + (picked === k ? ' aria-pressed="true"' : "") + '>' + GAMES[k].icon + " " + GAMES[k].name + (picked === k ? " ✓" : "") + '</button>';
    }).join(""));
    var sn = $("startNote");
    sn.textContent = !picked ? (duo ? "You and " + partner + " each pick one. If you pick different games, you'll take turns playing both!" : "Pick one to play against 🤖.") :
      partner && G.ch[partner] ? "Starting…" : "You picked " + GAMES[picked].name + ". Waiting for " + partner + " to pick…";
    sn.className = "turn" + (picked ? "" : " me");
    return;
  }

  if(!done){
    var bt = builder();
    $("clue").innerHTML = "<small>Build a word that means</small>" + esc(w[3]);
    var bEl = $("buildTurn");
    bEl.textContent = duo ? turnText(bt, ": add one part!") : "Tap the parts to build the word.";
    bEl.className = "turn" + (canAct(bt) ? " me" : "");
    setHTML($("slots"), [["pre", "beginning"], ["base", "root"]].concat(w[2] ? [["suf", "ending"]] : []).map(function(s){
      var by = G.f[s[0] + "By"];
      return '<div class="slot ' + s[0] + (G.f[s[0]] ? " on" : "") + '"><b>' + (G.f[s[0]] ? esc(G.f[s[0]]) : "&nbsp;") + '</b><span>' + s[1] + (duo && by ? ' <em>' + by + '</em>' : '') + '</span></div>';
    }).join(""));
    var mine = canAct(bt);
    setHTML($("tiles"), tiles().map(function(t){
      var used = !!G.f[t.p];
      return '<button type="button" class="tile ' + t.p + '" data-t="' + esc(t.t) + '" data-p="' + t.p + '"' + (used || !mine ? " disabled" : "") + '>' + esc(t.t) + '</button>';
    }).join(""));
    if(!$("hint").dataset.busy) $("hint").textContent = "";
    return;
  }

  var parts = [w[0], w[1]].concat(w[2] ? [w[2]] : []);
  $("bigWord").innerHTML = parts.map(esc).join("<i>·</i>");
  $("readIt").textContent = duo ? "Whisper-read it to " + partner + ": " + parts.join("") + "!" : "Whisper-read it: " + parts.join("") + "!";
  var gt = $("gameTurn"), p = players();

  {
    var mv = mover(), L = winLine() || [], act = movesLeft() && canAct(mv);
    var upNext = G.q[(G.qi + 1) % G.q.length], whose = "";
    if(G.q.length > 1){ var owner = players().filter(function(a){ return G.ch[a] === upNext; })[0]; whose = owner ? owner + "'s pick, " : ""; }
    var nextLine = "Next word starts " + whose + GAMES[upNext].name + ".";
    gt.textContent = GAMES[G.gm].icon + " " + GAMES[G.gm].name + ": " + (
      G.w === "draw" ? "It's a tie! " + nextLine :
      G.w ? G.w + " wins! 🎉 " + nextLine :
      G.mv >= 2 ? "Both moves done. Tap Next word!" :
      turnText(mv, G.gm === "mem" ? ": flip two cards!" : ": make one move!"));
    gt.className = "turn" + (act ? " me" : "");
    var html = "";
    if(G.gm === "tic") html = '<div class="ttt">' + G.b.c.map(function(x, i){ return '<button type="button" data-i="' + i + '" class="' + (L.indexOf(i) >= 0 ? "win" : "") + '"' + (x || !act ? " disabled" : "") + ' aria-label="Square ' + (i + 1) + (x ? ", " + x : "") + '">' + (x || "") + '</button>'; }).join("") + '</div>';
    else if(G.gm === "four") html = '<div class="four">' + G.b.c.map(function(x, i){ var colFull = !!G.b.c[i % 7]; return '<button type="button" data-i="' + i + '" class="' + (L.indexOf(i) >= 0 ? "win" : "") + '"' + (!act || colFull ? " disabled" : "") + ' aria-label="Column ' + (i % 7 + 1) + '">' + (x || "") + '</button>'; }).join("") + '</div>';
    else html = '<div class="mem">' + G.b.deck.map(function(face, i){
      var won = G.b.won[i], up = G.b.up.indexOf(i) >= 0 || G.b.show.indexOf(i) >= 0;
      return '<button type="button" data-i="' + i + '" class="' + (won ? "won" : up ? "up" : "") + '"' + (won || G.b.up.indexOf(i) >= 0 || !act ? " disabled" : "") + ' aria-label="Card ' + (i + 1) + (won || up ? ", " + face : "") + '">' + (won || up ? face : "") + (won ? "<sup>" + won + "</sup>" : "") + '</button>';
    }).join("") + '</div>';
    setHTML($("board"), html);
    $("next").disabled = movesLeft();
  }
  $("score").textContent = "Games won: " + p.map(function(a){ return a + " " + (G.s[a] || 0); }).join("   ·   ");
}

setup();
if(!card){ $("gate").querySelector(".clue").textContent = "The timer didn't load. You can still practice on your own."; }
})();
</script>
</body>
</html>
