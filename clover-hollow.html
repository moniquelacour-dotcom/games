<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>The Clover Hollow Case Files</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bevan&family=Nunito:wght@400;600;700;900&family=Special+Elite&display=swap">
<style>
:root{
  --soil:#2B2028; --soil-deep:#1B1319; --soil-lift:#3A2C34;
  --lamp:#F5B942; --lamp-dim:#B9822A; --lamp-ghost:rgba(245,185,66,.13);
  --paper:#F3EDDF; --paper-edge:#E2D9C3; --paper-shade:#EAE2CF;
  --ink:#332630; --ink-soft:#6B5A64;
  --clover:#79A257; --clover-deep:#4E7136; --clover-ghost:rgba(121,162,87,.16);
  --velvet:#C26F8A; --berry:#C0453E; --berry-ghost:rgba(192,69,62,.14);
  --ff-display:'Bevan',Georgia,serif;
  --ff-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ff-mono:'Special Elite','Courier New',monospace;
  --r:16px;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--soil-deep);
  background-image:
    radial-gradient(120% 80% at 50% -10%, #4A3742 0%, rgba(74,55,66,0) 62%),
    radial-gradient(70% 50% at 50% 108%, #221A20 0%, rgba(34,26,32,0) 70%);
  color:var(--paper); font-family:var(--ff-body); font-size:18px; line-height:1.55;
  min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.lamp-drift{animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-.8%,-.5%,0)}to{transform:translate3d(.8%,.8%,0)}}
.shake{animation:sh .32s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 80px}
.crest{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.crest-lamp{width:50px;height:50px;flex:0 0 auto;border-radius:50%;
  background:radial-gradient(circle at 38% 34%, #FFE7A8 0%, var(--lamp) 44%, var(--lamp-dim) 100%);
  box-shadow:0 0 0 5px var(--lamp-ghost), 0 0 44px 12px rgba(245,185,66,.2)}
h1{font-family:var(--ff-display);font-weight:400;font-size:clamp(26px,4.4vw,42px);line-height:1.03;
  margin:0;letter-spacing:.005em;text-wrap:balance}
h1 em{font-style:normal;color:var(--lamp);display:block;font-size:.62em}
.mono{font-family:var(--ff-mono);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--lamp)}
.stage-title{font-family:var(--ff-display);font-weight:400;font-size:clamp(21px,3vw,30px);line-height:1.15;margin:6px 0 10px}
h3{font-family:var(--ff-display);font-weight:400;font-size:21px;margin:0 0 10px;color:var(--paper)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 20px}
.tab{font:inherit;font-weight:700;font-size:15px;padding:9px 16px;border-radius:999px;cursor:pointer;
  background:var(--soil-lift);color:var(--paper);border:2px solid rgba(243,237,223,.16)}
.tab.on{background:var(--lamp);color:var(--soil-deep);border-color:var(--lamp)}
.tab.ghost{background:transparent;color:var(--ink-soft);border-color:rgba(243,237,223,.14)}

.btn{font:inherit;font-weight:800;font-size:16px;padding:12px 22px;border-radius:999px;cursor:pointer;
  background:var(--lamp);color:var(--soil-deep);border:none;box-shadow:0 3px 0 var(--lamp-dim)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lamp-dim)}
.btn.big{font-size:18px;padding:14px 28px}
.btn.ghost{background:transparent;color:var(--paper);border:2px solid rgba(243,237,223,.28);box-shadow:none}
.btn.green{background:var(--clover);color:#12200C;box-shadow:0 3px 0 var(--clover-deep)}
.btn[disabled]{opacity:.42;cursor:default;box-shadow:none}

.paper{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:20px 20px 22px;
  box-shadow:0 16px 34px rgba(0,0,0,.34);border:1px solid var(--paper-edge)}
.paper .mono{color:var(--lamp-dim)}
.paper h3,.paper .stage-title{color:var(--ink)}
.hint{color:var(--ink-soft);font-size:16px;margin:.2em 0 1em}

/* ---------- case files ---------- */
.files{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.file{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:16px 17px;text-align:left;
  border:1px solid var(--paper-edge);cursor:pointer;font:inherit;box-shadow:0 10px 22px rgba(0,0,0,.28)}
.file:hover{transform:translateY(-2px)}
.file.shut{background:var(--soil-lift);color:var(--ink-soft);border-color:rgba(243,237,223,.12);cursor:default}
.file.shut:hover{transform:none}
.file b{display:block;font-family:var(--ff-display);font-weight:400;font-size:20px;line-height:1.2;margin:5px 0 6px;color:var(--ink)}
.file.shut b{color:var(--paper)}
.file small{display:block;font-size:15px;line-height:1.42}
.seal{display:inline-block;font-family:var(--ff-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:5px;background:var(--clover-ghost);color:var(--clover-deep);border:1px solid rgba(78,113,54,.34);margin-top:9px}
.stamp{font-family:var(--ff-mono);font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--lamp);opacity:.82;margin:0 0 2px}
.al{display:block;font-style:italic;margin-top:6px;font-size:15px}

/* ---------- evidence + options ---------- */
.evidence{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:18px 19px;
  border:1px solid var(--paper-edge);border-left:6px solid var(--lamp);box-shadow:0 14px 30px rgba(0,0,0,.3)}
.evidence p{margin:.35em 0 0;font-size:17.5px}
.opts{display:grid;gap:9px;margin:16px 0 4px}
.optrow{display:flex;gap:8px;align-items:stretch}
.opt{flex:1;display:flex;gap:11px;align-items:center;text-align:left;font:inherit;font-size:17px;cursor:pointer;
  background:var(--paper);color:var(--ink);border:2px solid var(--paper-edge);border-radius:13px;padding:12px 14px}
.opt:hover{border-color:var(--lamp)}
.opt .ltr{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--ff-mono);
  font-size:14px;background:var(--soil-lift);color:var(--lamp)}
.opt.wrong{background:var(--soil-lift);color:var(--ink-soft);border-color:rgba(192,69,62,.4);text-decoration:line-through}
.opt.wrong .ltr{background:var(--berry-ghost);color:var(--berry)}
.opt.right{background:#E9F2DE;border-color:var(--clover-deep);font-weight:800}
.opt.right .ltr{background:var(--clover-deep);color:#fff}
.opt.faded{opacity:.4}
.opt.out{background:transparent;color:var(--ink-soft);border-style:dashed;border-color:rgba(243,237,223,.3);
  text-decoration:line-through;padding:7px 14px;font-size:15px}
.opt.out .ltr{height:22px;flex-basis:22px;font-size:12px;background:transparent;border:1px dashed rgba(243,237,223,.4)}
.opt[disabled]{cursor:default}
.rule{flex:0 0 62px;font:inherit;cursor:pointer;border-radius:13px;display:grid;place-content:center;gap:1px;
  background:transparent;color:var(--paper);border:2px dashed rgba(243,237,223,.3)}
.rule b{font-size:17px;line-height:1}
.rule small{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.8}
.rule:hover{border-color:var(--lamp);color:var(--lamp)}
.rule.back{border-style:solid;border-color:var(--lamp);color:var(--lamp)}
.ruleline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  margin:12px 0 0;padding:10px 14px;border-radius:12px;background:rgba(243,237,223,.06);border:1px dashed rgba(243,237,223,.22)}
.ruleline.good{background:var(--clover-ghost);border-color:var(--clover)}
.ruleline.good .mono{color:var(--clover)}
.ruleline.bad{background:var(--berry-ghost);border-color:var(--berry)}
.ruleline.bad .mono{color:#E8908A}

.whisper{margin:14px 0 0;padding:14px 16px;border-radius:13px;background:var(--soil-lift);
  border:1px solid rgba(243,237,223,.14);font-size:17px}
.whisper.good{background:var(--clover-ghost);border-color:var(--clover)}
.whisper .who{display:block;font-family:var(--ff-mono);font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--lamp);margin-bottom:4px}
.footrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

.track{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
.pip{width:34px;height:6px;border-radius:3px;background:rgba(243,237,223,.16)}
.pip.done{background:var(--clover)}
.pip.now{background:var(--lamp)}

/* ---------- bench / gallery ---------- */
.bench{margin-top:22px}
.dets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.det{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:12px 10px 14px;text-align:center;
  border:1px solid var(--paper-edge)}
.det.off{opacity:.5}
.det b{display:block;font-size:16.5px;margin-top:4px}
.det small{display:block;color:var(--ink-soft);font-size:13.5px}
.det .row{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.mini{font:inherit;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer;
  background:var(--soil-lift);color:var(--paper);border:none}
.addbox{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:15px 16px;border:1px solid var(--paper-edge);margin-top:12px}
.addbox input{font:inherit;font-size:17px;padding:10px 13px;border-radius:11px;border:2px solid var(--paper-edge);width:100%;max-width:320px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.chip{font:inherit;font-size:14px;font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer;
  background:#fff;color:var(--ink);border:2px solid var(--paper-edge)}
.chip[aria-pressed="true"]{background:var(--clover);color:#12200C;border-color:var(--clover-deep)}
.swatch{width:19px;height:19px;border-radius:50%;display:inline-block;vertical-align:-4px;margin-right:7px;border:1px solid rgba(0,0,0,.2)}
.fieldlabel{font-family:var(--ff-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp-dim);margin:12px 0 2px}

/* ---------- locker ---------- */
#overlay:empty{display:none}
.veil{position:fixed;inset:0;z-index:60;background:rgba(20,15,19,.82);display:grid;place-items:start center;
  overflow:auto;padding:18px 14px 40px}
.panel{background:var(--paper);color:var(--ink);border-radius:20px;padding:20px;max-width:940px;width:100%;
  border:1px solid var(--paper-edge);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.phead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.lede{color:var(--ink-soft);font-size:16.5px;margin:.4em 0 1em}
.locker{display:flex;flex-direction:column;gap:8px}
.lrow{border-top:1px solid var(--paper-edge);padding-top:11px}
.lname{font-weight:800;font-size:16.5px;margin-bottom:7px}
.lname em{font-style:normal;font-weight:600;font-size:13px;color:var(--ink-soft);margin-left:8px}
.lname em.done{color:var(--clover-deep)}
.lopts{display:flex;gap:8px;flex-wrap:wrap}
.lopt{font:inherit;cursor:pointer;background:#fff;border:2px solid var(--paper-edge);border-radius:13px;
  padding:5px 5px 7px;width:96px;text-align:center;color:var(--ink)}
.lopt small{display:block;font-size:12px;line-height:1.25;margin-top:2px}
.lopt[aria-pressed="true"]{border-color:var(--clover-deep);background:#E9F2DE}
.lopt.fresh{box-shadow:0 0 0 2px var(--lamp)}
.lopt.owns{border-style:solid;border-color:var(--lamp-dim)}
.wardrobe{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;justify-content:center}
.wchip{font:inherit;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;cursor:pointer;
  background:var(--paper-shade);color:var(--ink);border:1px solid var(--paper-edge)}
.wchip[aria-pressed="true"]{background:var(--clover);color:#12200C}

.coach{margin-top:22px;background:var(--soil-lift);border-radius:var(--r);border:1px solid rgba(243,237,223,.14);padding:2px 16px}
.coach summary{cursor:pointer;font-family:var(--ff-mono);font-size:13px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--lamp);padding:12px 0}
.cin{padding-bottom:14px;font-size:16.5px}
.cin p{margin:.5em 0}
.warn{background:var(--berry-ghost);border:1px solid var(--berry);border-radius:12px;padding:10px 14px;font-size:15.5px}
.notesbox{font:inherit;font-size:16px;width:100%;min-height:88px;padding:11px 13px;border-radius:12px;
  border:2px solid var(--paper-edge);background:#fff;color:var(--ink)}
.scene{width:100%;height:auto;border-radius:13px;display:block;background:var(--soil);border:1px solid rgba(243,237,223,.1)}
.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.sus{background:var(--paper);color:var(--ink);border:2px solid var(--paper-edge);border-radius:14px;
  padding:12px;text-align:left;font:inherit;cursor:pointer}
.sus:hover{border-color:var(--lamp)}
.sus b{display:block;font-size:17px}
.sus small{display:block;color:var(--ink-soft);font-size:14px}
.sus i{display:block;font-style:italic;margin-top:6px;font-size:15px}

/* ---------- controls sitting ON a cream card need cream-card colours ----------
   These were inheriting the dark-ground palette, which made the rule-out
   button, the ruled-out rows and Inspector Bramble's explanation unreadable. */
.paper .btn.ghost,.panel .btn.ghost{color:var(--ink);border-color:rgba(51,38,48,.3)}
.paper .btn.ghost:hover,.panel .btn.ghost:hover{border-color:var(--lamp-dim);color:var(--lamp-dim)}
.paper .rule{color:var(--ink-soft);border-color:rgba(51,38,48,.34)}
.paper .rule:hover,.paper .rule.back{border-color:var(--lamp-dim);color:var(--lamp-dim)}
.paper .opt.out{color:var(--ink-soft);border-color:rgba(51,38,48,.3)}
.paper .opt.out .ltr{border-color:rgba(51,38,48,.42);color:var(--ink-soft)}
.paper .opt.wrong{background:transparent;color:var(--ink-soft);border-color:rgba(192,69,62,.45)}
.paper .ruleline{background:rgba(51,38,48,.05);border-color:rgba(51,38,48,.2)}
.paper .ruleline.good{background:var(--clover-ghost);border-color:var(--clover-deep)}
.paper .ruleline.good .mono{color:var(--clover-deep)}
.paper .ruleline.bad{background:var(--berry-ghost);border-color:var(--berry)}
.paper .ruleline.bad .mono{color:var(--berry)}
.paper .whisper{background:var(--paper-shade);border-color:var(--paper-edge);color:var(--ink)}
.paper .whisper .who{color:var(--lamp-dim)}
.paper .whisper.good{background:#E9F2DE;border-color:var(--clover-deep);color:var(--ink)}
.paper .whisper.good .who{color:var(--clover-deep)}
.paper .track .pip{background:rgba(51,38,48,.14)}
.paper .track .pip.done{background:var(--clover-deep)}
.paper .track .pip.now{background:var(--lamp-dim)}
.paper .mini{background:var(--soil-lift);color:var(--paper)}

/* ---------- evidence picture ---------- */
.evidence.haspic{display:grid;gap:18px;grid-template-columns:minmax(0,300px) minmax(0,1fr);align-items:center}
.evpic{min-width:0}
.evpic svg{width:100%;height:auto;display:block;border-radius:12px;border:1px solid rgba(51,38,48,.18);background:#2B2028}
.evtext{min-width:0}
.evtext p{margin:.35em 0 0;font-size:17.5px}
@media (max-width:880px){
  .evidence.haspic{grid-template-columns:1fr}
  .evpic svg{max-width:420px;margin:0 auto}
}
@media (max-height:860px){
  .evidence.haspic{grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:15px}
}

/* ---------- opening picture + case description ---------- */
.opener{display:grid;gap:20px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;margin-bottom:18px}
@media (max-width:900px){.opener{grid-template-columns:1fr}}
.opener .scene{border-radius:14px}
.opentext{min-width:0}
.opentext p{margin:.45em 0 0;font-size:17px;color:var(--ink)}
.opentext .lead{font-weight:800}
</style>

<div class="wrap">
  <header class="crest">
    <div class="crest-lamp" aria-hidden="true"></div>
    <div>
      <p class="stamp">Bureau of Small Mysteries</p>
      <h1>The Clover Hollow Case Files<em>Rabbit Division</em></h1>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab" data-view="files" type="button" onclick="go('files')">Case files</button>
    <button class="tab" data-view="suspects" type="button" onclick="go('suspects')">Suspects</button>
    <button class="tab" data-view="notes" type="button" onclick="go('notes')">Case notes</button>
    <button class="tab" data-view="gallery" type="button" onclick="go('gallery')">The Hollow Irregulars</button>
    <button class="tab ghost" id="reset" type="button" onclick="armReset()">Start over</button>
  </nav>

  <main id="stage" aria-live="polite"></main>
  <p class="warn" id="storewarn" hidden>Nothing is saving in this browser — the burrow will reset when you close the tab.</p>
</div>
<div id="overlay"></div>

<script>

 {id:'oat',      name:'Oat',      c:'#E4D6BE', d:'#B9A585', e:'#F2C9D2'},
 {id:'slate',    name:'Slate',    c:'#9BA6AE', d:'#6E7B84', e:'#F2C9D2'},
 {id:'cocoa',    name:'Cocoa',    c:'#9A7359', d:'#6E4E3A', e:'#E9B6BE'},
 {id:'soot',     name:'Soot',     c:'#5A4F58', d:'#3B3238', e:'#D79AA8'},
 {id:'cream',    name:'Cream',    c:'#F4EADA', d:'#CBBBA1', e:'#F4C3CE'},
 {id:'cinnamon', name:'Cinnamon', c:'#C88A5C', d:'#96603A', e:'#F0BDC4'}
];
const PATS=[
 {id:'plain',   name:'Plain'},
 {id:'blaze',   name:'Nose blaze'},
 {id:'saddle',  name:'Saddle'},
 {id:'patch',   name:'Eye patch'},
 {id:'freckles',name:'Freckles'}
];
const EYES=[

 {id:'amber',   name:'Amber',   c:'#F2B84B',c2:null},
 {id:'moss',    name:'Moss',    c:'#6FA86C',c2:null},

/* each case SETS the breed, exactly like Whisker Street */
const BREEDS=[

 {id:'tufted',  name:'Tufted',    ear:'tuft',  bodyW:1.02, cheek:0, tail:12},
 {id:'longear', name:'Long ear',  ear:'tall',  bodyW:.96,  cheek:0, tail:9},
 {id:'dwarf',   name:'Dwarf',     ear:'short', bodyW:1.12, cheek:1, tail:13},
 {id:'oneup',   name:'One up',    ear:'tilt',  bodyW:1,    cheek:0, tail:11}
];
/* ear path sets: [leftOuter, rightOuter, leftInner, rightInner] on a 120x160 canvas */
const EAR={
 tall: ['M46 40 Q38 -6 52 -8 Q62 -6 55 40 Z','M74 40 Q82 -6 68 -8 Q58 -6 65 40 Z',
        'M48.5 36 Q43 2 51.5 0 Q57 2 52.5 36 Z','M71.5 36 Q77 2 68.5 0 Q63 2 67.5 36 Z'],
 lop:  ['M46 42 Q22 40 14 66 Q10 84 26 84 Q44 78 50 46 Z','M74 42 Q98 40 106 66 Q110 84 94 84 Q76 78 70 46 Z',
        'M46 46 Q28 46 22 66 Q20 76 29 75 Q41 70 47 49 Z','M74 46 Q92 46 98 66 Q100 76 91 75 Q79 70 73 49 Z'],
 tuft: ['M46 40 Q38 2 52 0 Q62 2 55 40 Z M48 6 Q42 -8 51 -6 Q55 -2 53 6 Z','M74 40 Q82 2 68 0 Q58 2 65 40 Z M72 6 Q78 -8 69 -6 Q65 -2 67 6 Z',
        'M48.5 36 Q44 8 51.5 6 Q56 8 52.5 36 Z','M71.5 36 Q76 8 68.5 6 Q64 8 67.5 36 Z'],
 short:['M47 42 Q42 16 53 14 Q62 16 56 42 Z','M73 42 Q78 16 67 14 Q58 16 64 42 Z',
        'M49 38 Q46 21 52.5 20 Q57 21 53.5 38 Z','M71 38 Q74 21 67.5 20 Q63 21 66.5 38 Z'],
 tilt: ['M46 40 Q38 -6 52 -8 Q62 -6 55 40 Z','M74 42 Q98 40 106 66 Q110 84 94 84 Q76 78 70 46 Z',
        'M48.5 36 Q43 2 51.5 0 Q57 2 52.5 36 Z','M74 46 Q92 46 98 66 Q100 76 91 75 Q79 70 73 49 Z']
};

/* ---------- gear ---------- */
const ORDER=['back','body','neck','face','hat','tool','front'];
const SLOTS=[
 {id:'hat',   label:'Detective hat'},
 {id:'face',  label:'Eye gear'},
 {id:'neck',  label:'Neck piece'},
 {id:'coat',  label:'Coat or cape'},
 {id:'tool',  label:'Detective tool'},
 {id:'legend',label:'Legend mark'}
];

function medalBar(d){
  const k=(d.keeps||[]).filter(id=>KEEPS[id]);
  if(!k.length) return '';
  const step=13, x0=60-((k.length-1)*step)/2;
  return '<g><path d="M'+(x0-10).toFixed(1)+' 158 H'+(x0+(k.length-1)*step+10).toFixed(1)+'" stroke="#B9A585" stroke-width="1.8" opacity=".45"/>'
   +k.map((id,i)=>{const K=KEEPS[id],x=x0+i*step;
     return '<g transform="translate('+x.toFixed(1)+' 150)"><circle r="5.8" fill="'+K.c+'"/><circle r="5.8" fill="none" stroke="'+K.r+'" stroke-width="1.6"/>'+K.g+'</g>';}).join('')+'</g>';
}

/* ============================ RABBIT ============================ */
function bunnySVG(d,size,override){
  const f=FUR.find(x=>x.id===d.fur)||FUR[0];
  const ey=EYES.find(x=>x.id===(d.eye||'chestnut'))||EYES[0];
  const br=BREEDS.find(x=>x.id===(d.breed||'lop'))||BREEDS[0];
  const ear=EAR[br.ear]||EAR.lop;
  const irisL=ey.c, irisR=ey.c2||ey.c;
  const g=Object.assign({},d.gear,override||{});
  const bucket={back:'',body:'',neck:'',face:'',hat:'',tool:'',front:''};
  for(const s of SLOTS){
    const pickId=g[s.id]; if(!pickId) continue;
    const item=(GEAR[s.id]||[]).find(x=>x.id===pickId); if(!item) continue;
    bucket[item.layer]+=item.svg(f);
  }
  const P=d.pat||'plain';
  let bodyPat='',headPat='';
  if(P==='saddle') bodyPat='<path d="M36 108 Q60 100 84 108 Q84 124 60 126 Q36 124 36 108 Z" fill="'+f.d+'" opacity=".5"/>';
  if(P==='blaze')  headPat='<path d="M60 40 Q64 56 60 74 Q56 56 60 40 Z" fill="#F6F1E4" opacity=".85"/>';
  if(P==='patch')  headPat='<ellipse cx="47" cy="58" rx="12" ry="10.5" fill="'+f.d+'" opacity=".62"/>';
  if(P==='freckles') headPat='<g fill="'+f.d+'" opacity=".6"><circle cx="46" cy="70" r="1.8"/><circle cx="51" cy="74" r="1.6"/><circle cx="69" cy="70" r="1.8"/><circle cx="74" cy="74" r="1.6"/></g>';
  const bw=br.bodyW;
  const cheeks=br.cheek?'<ellipse cx="41" cy="70" rx="7" ry="5.4" fill="'+f.d+'" opacity=".35"/><ellipse cx="79" cy="70" rx="7" ry="5.4" fill="'+f.d+'" opacity=".35"/>':'';
  return '<svg viewBox="0 -10 120 175" width="'+size+'" height="'+Math.round(size*175/120)+'" role="img" aria-label="'+escAttr(d.name||'detective')+'">'
   +bucket.back
   /* tail tucks in behind */
   +'<circle cx="'+(60-24*bw).toFixed(1)+'" cy="124" r="9.5" fill="'+f.e+'" opacity=".55"/>'
   +'<circle cx="'+(60-24*bw).toFixed(1)+'" cy="124" r="9.5" fill="none" stroke="'+f.d+'" stroke-width="1.6"/>'
   /* ears */
   +'<path d="'+ear[0]+'" fill="'+f.c+'" stroke="'+f.d+'" stroke-width="2"/>'
   +'<path d="'+ear[1]+'" fill="'+f.c+'" stroke="'+f.d+'" stroke-width="2"/>'
   +'<path d="'+ear[2]+'" fill="'+f.e+'"/>'
   +'<path d="'+ear[3]+'" fill="'+f.e+'"/>'
   /* round little body */
   +'<ellipse cx="60" cy="117" rx="'+(26*bw).toFixed(1)+'" ry="27" fill="'+f.c+'" stroke="'+f.d+'" stroke-width="2"/>'
   +'<ellipse cx="60" cy="123" rx="'+(16*bw).toFixed(1)+'" ry="17" fill="'+f.e+'" opacity=".38"/>'
   +bodyPat+bucket.body
   /* back feet, then little front paws */
   +'<ellipse cx="47" cy="140" rx="11" ry="7" fill="'+f.c+'" stroke="'+f.d+'" stroke-width="2"/>'
   +'<ellipse cx="73" cy="140" rx="11" ry="7" fill="'+f.c+'" stroke="'+f.d+'" stroke-width="2"/>'
   +'<circle cx="49" cy="126" r="6" fill="'+f.c+'" stroke="'+f.d+'" stroke-width="1.8"/>'
   +'<circle cx="71" cy="126" r="6" fill="'+f.c+'" stroke="'+f.d+'" stroke-width="1.8"/>'
   /* big round head */
   +'<ellipse cx="60" cy="60" rx="29" ry="27" fill="'+f.c+'" stroke="'+f.d+'" stroke-width="2"/>'
   +cheeks+headPat
   /* eyes — big and shiny */
   +'<ellipse cx="48" cy="60" rx="7.6" ry="8.4" fill="#F6F1E4"/><ellipse cx="72" cy="60" rx="7.6" ry="8.4" fill="#F6F1E4"/>'
   +'<ellipse cx="48" cy="60.8" rx="5.4" ry="6.4" fill="'+irisL+'"/><ellipse cx="72" cy="60.8" rx="5.4" ry="6.4" fill="'+irisR+'"/>'
   +'<circle cx="49.8" cy="57.8" r="2.2" fill="#fff" opacity=".95"/><circle cx="73.8" cy="57.8" r="2.2" fill="#fff" opacity=".95"/>'
   +'<circle cx="46.2" cy="63.4" r="1.1" fill="#fff" opacity=".6"/><circle cx="70.2" cy="63.4" r="1.1" fill="#fff" opacity=".6"/>'
   /* nose + mouth */
   +'<path d="M60 71 Q56.2 71 57.6 74.4 Q60 77.4 62.4 74.4 Q63.8 71 60 71 Z" fill="'+f.e+'" stroke="'+f.d+'" stroke-width="1.1"/>'
   +'<path d="M60 77 v2.6 M60 79.6 Q56.4 82.4 53.8 79.4 M60 79.6 Q63.6 82.4 66.2 79.4" stroke="'+f.d+'" stroke-width="1.8" fill="none" stroke-linecap="round"/>'
   /* whiskers */
   +'<g stroke="'+f.d+'" stroke-width="1.3" opacity=".6"><path d="M36 73 q-8 -1.5 -12 -4M36 78 q-8 1 -12 2.5M84 73 q8 -1.5 12 -4M84 78 q8 1 12 2.5"/></g>'
   +bucket.neck+bucket.face+bucket.hat+bucket.tool
   +medalBar(d)+bucket.front
   +'</svg>';
}

/* ======================= EVIDENCE PICTURES =======================
   One drawing per clue, so the language always has a picture beside it.
   Same idea as Whisker Street: a labelled diagram, not a painting —
   she reads the evidence out, then points at the thing being described. */
const EM='Special Elite, monospace';
function eF(inner){return '<svg viewBox="0 0 320 200" role="img" aria-hidden="true">'+inner+'</svg>';}
function eG(){return '<rect width="320" height="200" fill="#241A21"/><circle cx="160" cy="4" r="152" fill="#4A3742" opacity=".5"/>';}
function eFloor(y){return '<rect x="0" y="'+y+'" width="320" height="'+(200-y)+'" fill="#33262E"/>'
 +'<path d="M0 '+y+' H320" stroke="#4A3A43" stroke-width="2.4"/>';}
function eWood(y){let s='<rect x="0" y="'+y+'" width="320" height="'+(200-y)+'" fill="#5A4436"/>'
 +'<path d="M0 '+y+' H320" stroke="#6B5242" stroke-width="2.4"/><g stroke="#6B5242" stroke-width="1.8">';
 for(let x=32;x<320;x+=36)s+='<path d="M'+x+' '+y+' V200"/>';
 return s+'</g>';}
function eTxt(x,y,t,c,sz,anch){return '<text x="'+x+'" y="'+y+'" font-family="'+EM+'" font-size="'+(sz||11)+'" fill="'+(c||'#B9A585')+'"'
 +(anch?' text-anchor="'+anch+'"':'')+'>'+t+'</text>';}
function eTag(x,y,t,c){
  const w=t.length*6.6+18;
  return '<g><rect x="'+(x-w/2).toFixed(1)+'" y="'+(y-13)+'" width="'+w.toFixed(1)+'" height="22" rx="6" fill="#241A21" stroke="'+c+'" stroke-width="2"/>'
   +eTxt(x,y+3,t,c,11,'middle')+'</g>';}
function eCross(x,y,c){return '<g stroke="'+(c||'#C0453E')+'" stroke-width="4.4" stroke-linecap="round">'
 +'<path d="M'+(x-8)+' '+(y-8)+' l16 16M'+(x+8)+' '+(y-8)+' l-16 16"/></g>';}

const KEY='clover-hollow-v1';
let S={view:'files',caseId:null,stage:'files',dets:[],prog:{},ci:0,solved:0,
       tried:{},out:{},finaleTried:[],finaleOut:[],notes:{},ret:null};

let flash=null, storageOK=true;

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return;
    const p=JSON.parse(raw);
    if(!p)return;
    /* carry the old shape forward: detectives -> dets, marks -> keeps, nothing lost */
    const olds=Array.isArray(p.detectives)?p.detectives:null;
    if(olds){
      const earToBreed={up:'longear',lop:'lop',tilt:'oneup'};
      const keepByName={};Object.keys(KEEPS).forEach(k=>{keepByName[KEEPS[k].name]=k;});
      S.dets=olds.map(d=>{
        const keeps=(d.keepsakes||[]).map(n=>keepByName[n]).filter(Boolean);
        return {name:d.name||'Detective',fur:d.fur||'oat',pat:'plain',eye:'chestnut',
          breed:earToBreed[d.ear]||'lop',gear:{},won:[],keeps:keeps,active:true};
      });
      if(p.cases&&typeof p.cases==='object'){
        Object.keys(p.cases).forEach(id=>{ if(p.cases[id]&&p.cases[id].solved) S.prog[id]={done:true}; });
      }
      if(p.notes&&typeof p.notes==='object')S.notes=p.notes;
    } else {
      S=Object.assign(S,p);
      if(!Array.isArray(S.dets))S.dets=[];
    }
    S.dets.forEach(d=>{ if(!d.gear)d.gear={}; if(!d.won)d.won=[]; if(!d.keeps)d.keeps=[];
      if(d.active===undefined)d.active=true;
      /* anything already worn counts as won */
      Object.keys(d.gear).forEach(k=>{const id=d.gear[k];if(id&&d.won.indexOf(id)<0)d.won.push(id);}); });
    S.view='files';S.stage='files';S.caseId=null;
  }catch(e){ storageOK=false; }
}
function save(){
  if(!storageOK)return;
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ storageOK=false; const w=$('storewarn'); if(w)w.hidden=false; }
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const escAttr=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function CUR(){return CASES.find(c=>c.id===S.caseId)||CASES[0];}
function activeDets(){return S.dets.filter(d=>d.active!==false);}
function done(id){return !!(S.prog[id]&&S.prog[id].done);}
function caseBreed(){const b=CUR().breed;return BREEDS.find(x=>x.id===b)||BREEDS[0];}
function applyCaseBreed(){const b=caseBreed().id;S.dets.forEach(d=>{if(d.active!==false)d.breed=b;});draft.breed=b;}
function seenCases(){ return CASES.filter(c=>done(c.id)||c.id===S.caseId).map(c=>c.id); }
function gearFor(slot){ const seen=seenCases(); return (GEAR[slot]||[]).filter(it=>!it.c||seen.indexOf(it.c)>-1); }
function findGear(id){ for(const sl of SLOTS){const it=(GEAR[sl.id]||[]).find(x=>x.id===id);if(it)return{slot:sl.id,item:it,label:sl.label};} return null; }
function wonCount(d){return (d.won||[]).length;}

function go(view){
  if(view==='case'&&!S.caseId)view='files';
  if(view==='case'){ S.view='case'; if(S.stage==='files')S.stage=S.dets.length?'brief':'setup'; }
  else { S.view=view; if(view==='files'){S.stage='files';S.caseId=null;} }
  flash=null; shut(); save(); render();
}
function enterCase(id){
  if(!S.dets.length){ openSetup(); return; }   /* the case files already block this */
  S.caseId=id; S.stage='brief';
  S.ci=0;S.solved=0;S.tried={};S.out={};S.finaleTried=[];S.finaleOut=[];flash=null;
  applyCaseBreed(); S.view='case'; save(); render();
}
function replayCase(id){
  if(S.prog[id])delete S.prog[id];
  enterCase(id);
}

/* ============================ RENDER ============================ */
function render(){
  document.querySelectorAll('.tab[data-view]').forEach(t=>{
    const on=t.dataset.view===S.view||(S.view==='case'&&t.dataset.view==='files');
    t.classList.toggle('on',on);
  });
  const st=$('stage');
  if(S.view==='gallery'){ st.innerHTML=viewGallery(); return; }
  if(S.view==='suspects'){ st.innerHTML=viewSuspects(); return; }
  if(S.view==='notes'){ st.innerHTML=viewNotes(); return; }
  if(S.view==='case'){
    if(S.stage==='setup'){ st.innerHTML=viewSetup(); refocus(); return; }
    if(S.stage==='brief'){ st.innerHTML=viewBrief(); return; }
    if(S.stage==='clue'){ st.innerHTML=viewClue(false); return; }
    if(S.stage==='accuse'){ st.innerHTML=viewClue(true); return; }
    if(S.stage==='closed'){ st.innerHTML=viewClosed(); return; }
  }
  st.innerHTML=viewFiles();
}

function setDraft(k,v){draft[k]=v;render();}
function openSetup(){editing=null;draft={name:'',fur:'oat',pat:'plain',eye:'chestnut',breed:S.caseId?caseBreed().id:'lop'};
  S.ret={view:S.view,stage:S.stage};S.view='case';S.stage='setup';if(S.caseId)applyCaseBreed();save();render();}
function editDet(i){
  const d=S.dets[i]; if(!d)return;
  editing=i;
  draft={name:d.name||'',fur:d.fur||'oat',pat:d.pat||'plain',eye:d.eye||'chestnut',breed:d.breed||'lop'};
  S.ret={view:S.view,stage:S.stage};S.view='case';S.stage='setup';save();render();refocus();
}
function saveDet(){
  if(editing===null)return addDet();
  const d=S.dets[editing];
  if(d){
    d.name=(draft.name||'').trim()||d.name;
    d.fur=draft.fur; d.pat=draft.pat; d.eye=draft.eye;
  }
  editing=null;save();leaveSetup();
}
function cancelEdit(){editing=null;leaveSetup();}
function leaveSetup(){
  editing=null;
  const r=S.ret;S.ret=null;
  const backIntoCase = S.caseId && r && r.view==='case' && r.stage && r.stage!=='files' && r.stage!=='setup';
  if(backIntoCase){ S.view='case'; S.stage=r.stage; }
  else { S.view='files'; S.stage='files'; S.caseId=null; }
  save();render();
}
const SPARE=['Inspector Clover','Detective Thistle','Sergeant Nibbles','Constable Pip','Agent Sorrel','Inspector Bramble'];
function addDet(){
  const nm=(draft.name||'').trim()||SPARE[S.dets.length%SPARE.length];
  S.dets.push({name:nm,fur:draft.fur,pat:draft.pat,eye:draft.eye,
    breed:S.caseId?caseBreed().id:draft.breed,gear:{},won:[],keeps:[],active:true});
  draft.name='';save();render();refocus();
}
function dropDet(i){S.dets.splice(i,1);save();render();}
function toggleActive(i){const d=S.dets[i];d.active=(d.active===false);save();render();}
function refocus(){const el=$('nm');if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}

function viewBrief(){
  const c=CUR();
  let h='<div class="paper"><span class="mono">'+c.no+'</span><h2 class="stage-title">'+c.title+'</h2>'
   +c.scene()
   +c.brief.map(p=>'<p>'+p+'</p>').join('')
   +'<h3 style="margin-top:18px">Four rabbits were in the Hollow that night</h3><div class="grid">'
   +c.suspects.map(s=>'<div class="sus"><b>'+s.name+'</b><small>'+s.role+'</small><i>'+s.alibi+'</i></div>').join('')
   +'</div>'
   +'<p class="hint" style="margin-top:16px"><b>How it plays.</b> Five pieces of evidence. Read each one out loud, talk about it, cross off what cannot be true, then tap what you agree on. A wrong tap costs nothing — Inspector Bramble says why it does not fit and you go again. Every solved clue opens the gear locker.</p>';
  if(S.dets.length){
    h+='<h3 style="margin-top:20px">On the case</h3><div class="dets">'
     +S.dets.map(d=>'<div class="det">'+bunnySVG(d,104)+'<b>'+esc(d.name)+'</b>'
       +'<small>ears for this case: '+caseBreed().name.toLowerCase()+'</small></div>').join('')
     +'</div>';
  }
  h+='<div class="footrow"><button class="btn big" onclick="startClues()">Open the first evidence &#8594;</button>'
   +'<button class="btn ghost" onclick="openSetup()">Build a different bunny</button></div>'
   +'</div>'+coachPanel(c);
  return h;
}
function startClues(){S.stage='clue';S.ci=0;flash=null;save();render();}

function drawTrack(){
  const n=CUR().clues.length;let h='<div class="track">';
  for(let i=0;i<n;i++)h+='<div class="pip'+(S.ci>i?' done':(S.ci===i?' now':''))+'"></div>';
  return h+'</div>';
}
function viewClue(isFinal){
  const c=isFinal?CUR().finale:CUR().clues[S.ci];
  const key=isFinal?'F':String(S.ci);
  const tried=isFinal?S.finaleTried:(S.tried[key]||[]);
  const out=isFinal?S.finaleOut:(S.out[key]||[]);
  const solvedNow=flash&&flash.ok;
  const letters='ABCDE';
  const pic=clueArt(isFinal);
  let h='<div class="paper"><div class="evidence lamp-drift'+(pic?' haspic':'')+'">'
   +(pic?'<div class="evpic">'+pic+'</div>':'')
   +'<div class="evtext"><span class="mono">'+c.tag+'</span>'
   +'<h2 class="stage-title">'+c.title+'</h2><p>'+c.text+'</p></div></div>';
  if(!isFinal)h+=drawTrack();
  h+='<div class="opts">';
  c.opts.forEach((o,i)=>{
    const isWrong=tried.indexOf(i)>-1;
    const isOut=!isWrong&&out.indexOf(i)>-1;
    const isRight=solvedNow&&o.ok;
    const cls='opt'+(isWrong?' wrong':'')+(isOut?' out':'')+(isRight?' right':'')
      +(solvedNow&&!o.ok?' faded':'')+(flash&&flash.i===i&&!flash.ok?' shake':'');
    h+='<div class="optrow"><button class="'+cls+'" '+(isWrong||isOut||solvedNow?'disabled':'')
      +' onclick="pick('+i+','+(isFinal?'true':'false')+')">'
      +'<span class="ltr">'+letters[i]+'</span><span class="txt">'+o.t+'</span></button>'
      +(solvedNow||isWrong?'':'<button class="rule'+(isOut?' back':'')+'" onclick="ruleOut('+i+','+(isFinal?'true':'false')+')" aria-label="'
        +(isOut?'Bring option '+letters[i]+' back':'Rule out option '+letters[i])+'"><b>'
        +(isOut?'&#8617;':'&#10005;')+'</b><small>'+(isOut?'back':'rule out')+'</small></button>')
      +'</div>';
  });
  h+='</div>';
  const standing=c.opts.filter((o,i)=>tried.indexOf(i)<0&&out.indexOf(i)<0).length;
  if(!solvedNow&&out.length){
    let msg=out.length+' ruled out',cls='';
    if(standing===1){msg='One left standing — check it against every clue';cls=' good';}
    else if(standing===0){msg='Everything is crossed out, and one of them has to be right';cls=' bad';}
    h+='<div class="ruleline'+cls+'"><span class="mono">'+msg+'</span>'
      +'<button class="btn ghost" onclick="clearOut('+(isFinal?'true':'false')+')">Bring '+(out.length>1?'them all':'it')+' back</button></div>';
  }
  if(flash){
    if(flash.ok){
      h+='<div class="whisper good"><div><span class="who">Inspector Bramble</span>'
       +(isFinal?'That is the whole story. Case closed, detectives.':'That is it. Write it down: <b>'+c.note+'</b>')+'</div></div>'
       +'<div class="footrow"><button class="btn big" onclick="advance('+(isFinal?'true':'false')+')">'
       +(isFinal?'Award the keepsake &#8594;':'Claim your gear &#8594;')+'</button></div>';
    } else {
      h+='<div class="whisper"><div><span class="who">Inspector Bramble</span>'+c.opts[flash.i].hint+' Have another go.</div></div>';
    }
  }
  h+=notesBox();
  return h+'</div>';
}
function pick(i,isFinal){
  const c=isFinal?CUR().finale:CUR().clues[S.ci];
  if(c.opts[i].ok){ flash={i:i,ok:true}; }
  else{
    if(isFinal){ if(S.finaleTried.indexOf(i)<0)S.finaleTried.push(i); }
    else{ const k=String(S.ci); if(!S.tried[k])S.tried[k]=[]; if(S.tried[k].indexOf(i)<0)S.tried[k].push(i); }
    flash={i:i,ok:false};
  }
  save();render();
}
function ruleOut(i,isFinal){
  let arr;
  if(isFinal)arr=S.finaleOut;
  else{ const k=String(S.ci); if(!S.out[k])S.out[k]=[]; arr=S.out[k]; }
  const at=arr.indexOf(i);
  if(at>-1)arr.splice(at,1); else arr.push(i);
  save();render();
}
function clearOut(isFinal){ if(isFinal)S.finaleOut=[];else S.out[String(S.ci)]=[]; save();render(); }
function advance(isFinal){
  if(isFinal){
    const k=CUR().keep;
    activeDets().forEach(d=>{if(!d.keeps)d.keeps=[];if(d.keeps.indexOf(k)<0)d.keeps.push(k);});
    S.prog[S.caseId]={done:true};
    S.stage='closed';flash=null;save();render();return;
  }
  S.solved=S.ci+1;save();render();
  openLocker(CUR().clues[S.ci].reward);
}

/* ============================ GEAR LOCKER ============================ */
function lockerHTML(slot){
  let h='<div class="locker">';
  if(!S.dets.length)h+='<p class="lede">No detectives yet — add one and the gear is theirs.</p>';
  S.dets.forEach((d,di)=>{
    h+='<div class="lrow"><div class="lname">'+esc(d.name)
     +(d.gear[slot]?'<em class="done">&#10003; chosen</em>':'<em>pick one</em>')+'</div><div class="lopts">';
    gearFor(slot).forEach(item=>{
      const ov={};ov[slot]=item.id;
      const owns=(d.won||[]).indexOf(item.id)>-1;
      h+='<button class="lopt'+(item.c&&item.c===S.caseId?' fresh':'')+(owns?' owns':'')+'" aria-pressed="'
        +(d.gear[slot]===item.id)+'" onclick="setGear('+di+',\''+slot+'\',\''+item.id+'\')">'
        +bunnySVG(d,74,ov)+'<small>'+item.name+'</small></button>';
    });
    h+='</div></div>';
  });
  return h+'</div>';
}
function allPicked(slot){return S.dets.length&&S.dets.every(d=>d.gear[slot]);}
function commitWon(slot){
  if(!slot)return;
  S.dets.forEach(d=>{
    if(d.active===false)return;
    if(!d.won)d.won=[];
    const id=d.gear[slot];
    if(id&&d.won.indexOf(id)<0)d.won.push(id);
  });
}
function setGear(di,slot,id){
  const d=S.dets[di];
  d.gear[slot]=(d.gear[slot]===id)?undefined:id;
  if(!d.gear[slot])delete d.gear[slot];
  if(slot==='legend')commitWon('legend');
  save();
  if(openSlot)openLocker(openSlot,lockerMode); else render();
}
function wear(i,slot,id){
  const d=S.dets[i];
  d.gear[slot]=(d.gear[slot]===id)?undefined:id;
  if(!d.gear[slot])delete d.gear[slot];
  save();render();
}
function openLocker(slot,mode){
  openSlot=slot;lockerMode=mode||'advance';
  const s=SLOTS.find(x=>x.id===slot);
  const fresh=gearFor(slot).some(it=>it.c===S.caseId);
  const allHave=activeDets().length&&activeDets().every(d=>d.gear[slot]);
  const eyebrow=slot==='legend'?'Case closed':'Gear locker — clue '+S.solved+' of '+CUR().clues.length;
  let title,lede;
  if(slot==='legend'){
    title='Pick the mark you want to be remembered by';
    lede='One per detective. It follows you into every case after this one.';
  } else if(fresh){
    title='New '+s.label.toLowerCase()+' from this case';
    lede='This case brought new gear with it. The new pieces are ringed in gold — take one, or keep what you are already wearing.';
  } else if(allHave){
    title='Change your '+s.label.toLowerCase();
    lede='You already have one of these. Swap it if you fancy a change, or leave it exactly as it is.';
  } else {
    title='Every detective earns a '+s.label.toLowerCase();
    lede='Tap the version of your own bunny you want to keep. Tap it again to take it back off.';
  }
  const label=allPicked(slot)?(slot==='legend'?'Done':'On to the next clue'):'Skip for now';
  const btn='<button class="btn" onclick="closeLocker()">'+label+' &#8594;</button>';
  $('overlay').innerHTML='<div class="veil" onclick="if(event.target===this)closeLocker()"><div class="panel">'
   +'<div class="phead"><div><span class="mono">'+eyebrow+'</span><h2 class="stage-title">'+title+'</h2></div>'+btn+'</div>'
   +'<p class="lede">'+lede+'</p>'+lockerHTML(slot)
   +'<div class="footrow">'+btn+'</div></div></div>';
}
function closeLocker(){
  const slot=openSlot;
  openSlot=null;$('overlay').innerHTML='';
  commitWon(slot);
  if(slot==='legend'){ save();render(); return; }
  flash=null;S.ci++;
  if(S.ci>=CUR().clues.length)S.stage='accuse';
  save();render();
}
function shut(){openSlot=null;const o=$('overlay');if(o)o.innerHTML='';}

   +'<p class="hint">Tap each one to hear what they say. Nobody is out yet.</p><div class="grid">'
   +c.suspects.map((s,i)=>'<button class="sus" type="button" aria-pressed="false" onclick="var a=this.querySelector(\'.al\');var on=this.getAttribute(\'aria-pressed\')===\'true\';this.setAttribute(\'aria-pressed\',on?\'false\':\'true\');a.hidden=on;">'
     +'<b>'+s.name+'</b><small>'+s.role+'</small><span class="al" hidden>'+s.alibi+'</span></button>').join('')
   +'</div><div class="footrow"><button class="btn" onclick="go(\'case\')">Back to the case</button></div></div>';
}
function viewNotes(){
  if(!S.caseId){
    return '<div class="paper"><span class="mono">Case notes</span><h2 class="stage-title">Nothing on the desk</h2>'
     +'<p>Open a case file first.</p>'
     +'<div class="footrow"><button class="btn" onclick="go(\'files\')">Go to the case files</button></div></div>';
  }
  const c=CUR();
  let h='<div class="paper"><span class="mono">Case notes</span><h2 class="stage-title">'+c.title+'</h2>'
   +'<h3>What we know</h3>'+c.brief.map(p=>'<p>'+p+'</p>').join('')
   +'<h3>Evidence settled so far</h3>';
  const got=c.clues.slice(0,S.solved);
  if(!got.length)h+='<p class="hint">None yet.</p>';
  else h+=got.map(cl=>'<p><b>'+cl.note+'</b></p>').join('');
  h+='<h3>Detective’s note</h3><p class="hint">Optional. Say it out loud instead if you would rather.</p>'
   +notesBox()
   +'<div class="footrow"><button class="btn" onclick="go(\'case\')">Back to the case</button></div></div>';
  return h;
}

/* ============================ BOOT ============================ */
load();
render();
if(!storageOK){const w=$('storewarn');if(w)w.hidden=false;}
</script>
