<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>My Dream Camper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">

<style>
:root{
  --paper:#F1EEF9; --card:#FFFFFF; --sunk:#E5E0F2;
  --ink:#231B3D; --ink-2:#544A72; --ink-3:#8B81A6;
  --rule:#D6CEE8;
  --plum:#5A3A86; --plum-soft:#EBE2F6;
  --gold:#9A6B0F; --gold-soft:#FAEECF;
  --coral:#CE4E3A; --coral-soft:#FBE2DC;
  --moss:#2C6349; --moss-soft:#DCEDE4;
  --ff-d:'Baloo 2',system-ui,sans-serif;
  --ff-b:'Figtree',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14101F; --card:#1C1730; --sunk:#241D3C;
    --ink:#EFEAF9; --ink-2:#BCB1D4; --ink-3:#847AA0;
    --rule:#352B4E;
    --plum:#C3A4E6; --plum-soft:#2A1D40;
    --gold:#E2B45E; --gold-soft:#332811;
    --coral:#F0947F; --coral-soft:#3A1E17;
    --moss:#7FC8A0; --moss-soft:#14291F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14101F; --card:#1C1730; --sunk:#241D3C;
  --ink:#EFEAF9; --ink-2:#BCB1D4; --ink-3:#847AA0;
  --rule:#352B4E;
  --plum:#C3A4E6; --plum-soft:#2A1D40;
  --gold:#E2B45E; --gold-soft:#332811;
  --coral:#F0947F; --coral-soft:#3A1E17;
  --moss:#7FC8A0; --moss-soft:#14291F;
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:var(--ff-b);
  font-size:18px; line-height:1.5; -webkit-font-smoothing:antialiased}
button{font-family:var(--ff-b); color:inherit; background:none; border:0; cursor:pointer; text-align:left}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

.wrap{max-width:960px; margin:0 auto; padding:16px 16px 90px}
.brand{font-family:var(--ff-d); font-weight:800; font-size:14px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:9px}

/* chapters */
.chhead{display:flex; align-items:baseline; gap:10px; margin-bottom:7px}
.chlabel{font-family:var(--ff-d); font-weight:800; font-size:13px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-3)}
.savedot{margin-left:auto; font-size:12px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--moss)}
.chstrip{display:flex; gap:6px; flex-wrap:wrap}
.ch{display:flex; align-items:center; gap:7px; border:2px solid var(--rule); background:var(--card);
  border-radius:999px; padding:6px 14px 6px 8px; font-size:14.5px; font-weight:700; color:var(--ink-2)}
.ch:hover{border-color:var(--plum); color:var(--plum)}
.ch .chn{display:grid; place-items:center; width:21px; height:21px; border-radius:99px;
  background:var(--sunk); font-size:12px; font-weight:800; color:var(--ink-3)}
.ch.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.ch.on .chn{background:rgba(255,255,255,.2); color:var(--paper)}
.ch.done{border-color:var(--moss); color:var(--moss)}
.ch.done .chn{background:var(--moss-soft); color:var(--moss)}
.ch.going{border-style:dashed}
.chsub{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.pg{border:2px solid var(--rule); background:var(--card); border-radius:999px;
  padding:4px 13px; font-size:13.5px; font-weight:700; color:var(--ink-3)}
.pg.on{background:var(--plum); color:var(--paper); border-color:var(--plum)}
.pg.done{border-color:var(--moss); color:var(--moss)}

/* the dream leader bar — always visible, never hidden behind a toggle */
.dlbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:13px 0 4px;
  background:var(--plum-soft); border:2px solid var(--plum); border-radius:15px; padding:10px 14px}
.dltag{font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--plum)}
.dlname{font-family:var(--ff-d); font-weight:800; font-size:21px; color:var(--ink)}
.dlspin{font-family:var(--ff-d); font-weight:800; font-size:16px; background:var(--plum);
  color:var(--paper); border-radius:999px; padding:8px 18px}
.dlspin:hover{filter:brightness(1.12)}
.dledit{font-size:13px; font-weight:700; color:var(--plum); border:2px solid var(--plum);
  border-radius:999px; padding:6px 13px; background:transparent}
.dlnames{flex:1 1 100%; display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:4px}
.dlnames input{flex:1 1 220px; font-size:16px; font-weight:600; color:var(--ink);
  background:var(--card); border:2px solid var(--rule); border-radius:11px; padding:9px 12px}
.dlnames input:focus{outline:none; border-color:var(--plum)}
.dlled{flex:1 1 100%; font-size:13.5px; color:var(--ink-2); line-height:1.45}

h1{font-family:var(--ff-d); font-weight:800; font-size:clamp(26px,4.4vw,40px);
  line-height:1; letter-spacing:-.02em; color:var(--plum); margin-bottom:2px}
.chnow{font-family:var(--ff-d); font-weight:800; font-size:14px; letter-spacing:.04em;
  text-transform:uppercase; color:var(--gold); margin-bottom:1px}
.sub{font-size:16.5px; color:var(--ink-2); margin-bottom:14px}

.mc{background:var(--gold-soft); border:3px solid var(--gold); border-radius:18px;
  padding:clamp(15px,2.8vw,24px); margin-bottom:14px}
.mc .tag{display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.14em;
  text-transform:uppercase; color:var(--gold); border:2px solid var(--gold);
  border-radius:99px; padding:3px 11px; margin-bottom:9px}
.mc .say{font-family:var(--ff-d); font-weight:800; color:var(--ink);
  font-size:clamp(21px,3.6vw,32px); line-height:1.16}
.mc .then{font-size:15.5px; color:var(--ink-2); margin-top:8px}

.panel{background:var(--card); border:2px solid var(--rule); border-radius:18px;
  padding:clamp(14px,2.6vw,22px); margin-bottom:13px}
.panel h2{font-family:var(--ff-d); font-weight:700; font-size:clamp(19px,3vw,25px); margin-bottom:8px}
.note{font-size:14.5px; color:var(--ink-3); margin-top:9px}
.pickhint{font-size:14.5px; color:var(--ink-3); margin-bottom:9px}

.cats{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:11px}
.cat{border:2px solid var(--rule); border-radius:999px; padding:6px 14px;
  font-size:14.5px; font-weight:700; color:var(--ink-2); background:var(--card)}
.cat.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(152px,1fr))}
.opt{border:2px solid var(--rule); border-radius:15px; padding:11px 8px; background:var(--card);
  text-align:center; transition:transform .1s; position:relative}
.opt:hover{border-color:var(--plum); transform:translateY(-2px)}
.opt.on{border-color:var(--gold); background:var(--gold-soft)}
.opt.on::after{content:"✓"; position:absolute; top:5px; right:8px; color:var(--gold); font-weight:800; font-size:14px}
.opt .em{display:block; font-size:clamp(30px,5.6vw,39px); line-height:1.05}
.opt b{display:block; font-family:var(--ff-d); font-weight:700; font-size:15.5px; margin-top:3px}
.opt span{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px; line-height:1.27}
.opt.been{border-color:var(--moss); background:var(--moss-soft)}

.chosen{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px}
.chip{display:flex; align-items:center; gap:6px; border:2px solid var(--moss);
  background:var(--moss-soft); border-radius:999px; padding:5px 12px; font-weight:600; font-size:15px}
.chip .e{font-size:20px; line-height:1}
.chip .x{color:var(--ink-3); font-weight:800}
.chip .x:hover{color:var(--coral)}

.ownhead{font-size:14.5px; color:var(--ink-3); margin-top:15px}
.own{margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.own input{flex:1 1 240px; font-family:var(--ff-d); font-weight:700; font-size:19px; color:var(--ink);
  background:var(--sunk); border:2px solid transparent; border-radius:12px; padding:11px 14px}
.own input:focus{outline:none; border-color:var(--plum)}
.own input::placeholder{color:var(--ink-3); font-weight:600; font-family:var(--ff-b); font-size:16.5px}
.yet{font-size:14px; font-weight:700; color:var(--coral); border:2px solid var(--coral-soft);
  background:var(--coral-soft); border-radius:999px; padding:9px 15px}
.yet:hover{border-color:var(--coral)}

.hero{background:linear-gradient(180deg,var(--card),var(--plum-soft)); border-color:var(--plum)}
.heroart{border-radius:14px; overflow:hidden; margin-bottom:14px}
.heroart svg{display:block; width:100%; height:auto}
.quote{text-align:center; margin-bottom:18px}
.qline{font-family:var(--ff-d); font-weight:800; color:var(--plum);
  font-size:clamp(21px,4vw,32px); line-height:1.16; max-width:22ch; margin:0 auto}
.qsub{font-size:16px; color:var(--ink-2); margin-top:7px}

.paints{display:flex; gap:8px; flex-wrap:wrap}
.paint{width:46px; height:46px; border-radius:99px; border:4px solid transparent}
.paint.on{border-color:var(--ink)}
.avs{display:grid; grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:8px; margin-top:11px}
.avs button{font-size:33px; text-align:center; border:2px solid var(--rule);
  border-radius:14px; padding:7px 0; background:var(--card)}
.avs button:hover{border-color:var(--plum)}
.avs button.on{border-color:var(--gold); background:var(--gold-soft)}
.nameline{font-family:var(--ff-d); font-weight:700; font-size:23px; color:var(--ink);
  background:var(--sunk); border:2px solid transparent; border-radius:12px; padding:11px 14px; width:100%}
.nameline:focus{outline:none; border-color:var(--plum)}

/* the camper */
.viewtabs{display:flex; gap:5px; margin-bottom:9px; justify-content:center}
.viewtab{border:2px solid var(--rule); border-radius:999px; padding:5px 15px;
  font-size:14px; font-weight:700; color:var(--ink-2); background:var(--card)}
.viewtab.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.van{position:relative; width:100%; max-width:540px; margin:0 auto 6px}
.van svg{display:block; width:100%; height:auto}
.vancap{max-width:540px; margin:0 auto 12px; text-align:center;
  font-family:var(--ff-d); font-weight:800; font-size:clamp(15px,2.6vw,19px); color:var(--ink)}
.vancap .cl{display:block; font-family:var(--ff-b); font-weight:600; font-size:13px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.room{position:relative; width:100%; max-width:560px; margin:0 auto 6px; aspect-ratio:8/5;
  border-radius:16px; overflow:hidden; border:3px solid var(--rule)}
.room svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.rshelf{position:absolute; left:62.5%; top:14%; width:35.5%; height:35%;
  display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(2,1fr); gap:6% 4%}
.slotbox{display:flex; align-items:center; justify-content:center; border-radius:5px;
  font-size:clamp(12px,2.4vw,20px); line-height:1; background:rgba(255,255,255,.6);
  border:1.5px dashed rgba(35,27,61,.18)}
.slotbox.has{background:rgba(255,255,255,.9); border-style:solid; border-color:rgba(35,27,61,.14)}
.stylepick{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:7px; margin:2px 0 11px}
.sty{border:2px solid var(--rule); border-radius:13px; padding:9px 6px; background:var(--card); text-align:center}
.sty:hover{border-color:var(--plum)}
.sty.on{border-color:var(--gold); background:var(--gold-soft)}
.sty .em{display:block; font-size:25px; line-height:1.1}
.sty b{display:block; font-family:var(--ff-d); font-weight:700; font-size:14.5px; margin-top:2px}
.sty span{display:block; font-size:11.5px; color:var(--ink-3); line-height:1.25; margin-top:1px}

/* map */
.worldmap{margin:0 auto 12px; max-width:600px}
.worldmap svg{display:block; width:100%; height:auto; border-radius:16px; border:3px solid var(--rule)}
.minimap{margin-top:9px}
.minimap svg{display:block; width:100%; height:auto; border-radius:13px;
  border:3px dashed var(--plum); cursor:crosshair}
.custom{margin-top:12px; background:var(--sunk); border-radius:14px; padding:13px 15px}
.pins{display:flex; flex-direction:column; gap:7px; margin-top:10px}
.pin2{display:flex; gap:11px; align-items:center; border:2px solid var(--moss);
  background:var(--moss-soft); border-radius:13px; padding:9px 12px}
.pin2 .pp{font-size:26px; line-height:1}
.pin2 .pb{flex:1; min-width:0}
.pin2 .pm{font-family:var(--ff-d); font-weight:800; font-size:16px}
.pin2 .pw{font-size:14.5px; color:var(--ink-2); line-height:1.3}
.pin2 .x{color:var(--ink-3); font-size:18px; font-weight:800; padding:0 4px}
.pin2 .x:hover{color:var(--coral)}

.areas{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px}
.area{border:2px solid var(--rule); border-radius:14px; padding:11px 10px; background:var(--sunk); text-align:center}
.area .em{display:block; font-size:29px; line-height:1.05}
.area b{display:block; font-family:var(--ff-d); font-weight:700; font-size:15px; margin-top:3px}
.area span{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px; line-height:1.26}

.fillrow{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-top:9px}
.fillk{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); min-width:96px}
.fillrow input{flex:1 1 200px; font-family:var(--ff-d); font-weight:700; font-size:18px;
  color:var(--ink); background:var(--sunk); border:2px solid transparent;
  border-radius:11px; padding:9px 13px}
.fillrow input:focus{outline:none; border-color:var(--plum)}
.needs{font-size:14px; color:var(--coral); font-weight:600; margin-top:9px}

.frames{display:grid; gap:8px}
@media (min-width:640px){.frames{grid-template-columns:1fr 1fr}}
.frame{border:2px solid var(--rule); border-radius:15px; padding:13px 15px; background:var(--card)}
.frame:hover{border-color:var(--plum)}
.frame.on{border-color:var(--gold); background:var(--gold-soft)}
.fline{font-family:var(--ff-d); font-weight:700; font-size:clamp(16px,2.6vw,20px); line-height:1.3}
.blank{display:inline-block; border-bottom:3px solid var(--gold); color:var(--ink-3);
  font-style:italic; padding:0 5px; min-width:56px; margin:0 4px}
.mpreview{margin-top:15px; background:var(--plum-soft); border:2px solid var(--plum);
  border-radius:15px; padding:14px 17px}
.mpreview .k{font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  color:var(--plum); display:block; margin-bottom:5px}
.mline{font-family:var(--ff-d); font-weight:800; font-size:clamp(21px,3.8vw,30px);
  line-height:1.18; color:var(--ink)}
.remind{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  background:var(--sunk); border-radius:12px; padding:10px 14px; margin-bottom:13px}
.remind .k{font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.remind .v{font-family:var(--ff-d); font-weight:700; font-size:17px}

.showcard{background:var(--gold-soft); border:3px solid var(--gold); border-radius:18px;
  padding:clamp(15px,2.8vw,24px); margin-bottom:13px}
.showcard h2{font-family:var(--ff-d); font-weight:800; font-size:clamp(22px,3.6vw,30px); margin-bottom:10px}
.showlist{display:flex; flex-direction:column; gap:9px}
.showrow{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.showrow .k{font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--gold); min-width:118px}
.showrow .v{font-family:var(--ff-d); font-weight:700; font-size:18px; line-height:1.3; flex:1 1 200px}
.showrow .v.none{font-family:var(--ff-b); font-weight:600; font-style:italic; color:var(--ink-3); font-size:16px}
.showrow .v.big{font-size:clamp(20px,3.4vw,26px)}
.mantrarow{border-bottom:2px solid var(--gold); padding-bottom:9px}
.keep{margin-top:16px; border-top:2px solid var(--gold); padding-top:13px}
.keep .k{font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  color:var(--gold); display:block; margin-bottom:4px}
.keep .kl{font-size:15px; color:var(--ink-2); line-height:1.4}
.linkbox{width:100%; margin-top:10px; font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12px; padding:9px 11px; border-radius:10px; border:2px solid var(--rule);
  background:var(--card); color:var(--ink-2); resize:vertical}

.bar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-top:16px}
.btn{font-family:var(--ff-d); font-weight:800; font-size:17px; border-radius:999px;
  padding:11px 24px; background:var(--plum); color:var(--paper); display:inline-block}
.btn:hover{filter:brightness(1.12)}
.btn.big{font-size:21px; padding:14px 32px}
.btn.ghost{background:transparent; color:var(--ink-2); border:2px solid var(--rule)}
.btn.ghost:hover{border-color:var(--plum); color:var(--plum); filter:none}
.btn.sm{font-size:15px; padding:8px 16px}
.btn.off{opacity:.45}
.sendbar{position:fixed; left:0; right:0; bottom:0; z-index:8;
  background:var(--card); border-top:3px solid var(--plum);
  box-shadow:0 -6px 22px rgba(35,27,61,.16);
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px clamp(12px,3vw,22px)}
.sendbar .lbl{font-size:14.5px; color:var(--ink-2); flex:1 1 200px; line-height:1.3}
.sendbar .lbl b{color:var(--ink)}
.sendbar button{font-family:var(--ff-d); font-weight:800; font-size:17px; border-radius:999px;
  padding:11px 22px; background:var(--plum); color:var(--paper); white-space:nowrap}
.sendbar button:hover{filter:brightness(1.12)}
.sendbar.done{border-top-color:var(--moss)}
.sendbar.done button{background:var(--moss)}
.wrap{padding-bottom:104px}
@media (max-width:520px){ .sendbar .lbl{font-size:13.5px} .sendbar button{font-size:16px; padding:10px 18px} }

.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); font-weight:700; font-size:15px;
  padding:11px 20px; border-radius:999px; z-index:9}
</style>

<div class="wrap">
  <div class="brand">🚐 My Dream Camper</div>
  <div id="rail"></div>
  <div id="body"></div>
</div>

<div class="sendbar" id="sendbar">
  <span class="lbl" id="sendlbl">When you are finished, <b>send your camper to your coach</b> so it is never lost.</span>
  <button type="button" id="sendbtn">Copy my link</button>
</div>

<script>
/* =====================================================================
   One camper, one child, her own computer.
   Every page can hold MORE THAN ONE answer — a dream is not one thing.
   ===================================================================== */

var AVATARS=["🦊","🐉","🚀","🐈","🦁","🐢","🦄","🐙","🦉","🐝","🐬","🦖"];
var PAINTS=["#E4572E","#F2A93B","#3C9D6E","#3B7DD8","#8155C6","#D9548C","#2B9EB3","#6B4F3A"];
var MONTHS=["January","February","March","April","May","June",
            "July","August","September","October","November","December"];

var STYLES=[
  {id:"cosy", wood:"#A9703F", tex:"#C8643F", met:"#C9A227", em:"🕯️", n:"Cosy",
   l:"blankets and warm lamps", wall:"#F4E0C6", floor:"#B8875A", glow:"#F2A93B",

function packUp(str){
  try{ return btoa(unescape(encodeURIComponent(str)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }catch(e){ return ""; }
}
function unpack(str){
  try{ return decodeURIComponent(escape(atob(String(str).replace(/-/g,"+").replace(/_/g,"/")))); }
  catch(e){ return ""; }
}
function squeeze(){
  var o={};
  if(me.name) o.n=me.name;
  if(me.av) o.a=me.av;
  if(me.paint) o.p=me.paint;
  if(me.style&&me.style!=="cosy") o.s=me.style;
  MULTI.forEach(function(id,i){
    var v=me[id];
    if(v&&(v.picks.length||(v.text||"").trim())){
      o[["d","l","y","h","w","i"][i]]=[v.picks.map(function(x){ return x.e; }).join(""), v.text||""];
    }
  });
  if((me.allyDoes||"").trim()) o.wd=me.allyDoes;
  if(me.mantra){
    if((me.mantra.own||"").trim()) o.m=["",me.mantra.own];
    else if(me.mantra.frame) o.m=[me.mantra.frame].concat(me.mantra.blanks||[]);
  }
  if(me.pack.length) o.k=me.pack.map(function(x){ return [x.e,x.w]; });
  if(me.trips.length) o.t=me.trips.map(function(t){
    var r=[t.month||"",t.place||"",t.pic||"",KINDC[t.kind]||"",t.win||""];

}

}
function swell(o){
  if(!o||typeof o!=="object") return null;
  if(o.dream&&o.dream.picks) return o;                 /* already full */
  var b=blank();
  if(o.n) b.name=o.n; if(o.a) b.av=o.a;
  if(o.p) b.paint=o.p; if(o.s) b.style=o.s;
  ["d","l","y","h","w","i"].forEach(function(k,i){
    var id=MULTI[i], src=o[k];
    if(src&&src.length){
      b[id]={picks:picksFrom(src[0],LISTS[PAGES[pageIndexOf(id)].list]||[]), text:src[1]||""};
    }
  });
  if(o.wd) b.allyDoes=o.wd;
  if(o.m&&o.m.length){
    b.mantra = o.m[0]==="" ? {frame:"",blanks:[],own:o.m[1]||""}
                           : {frame:o.m[0],blanks:o.m.slice(1),own:""};
  }
  if(o.k&&o.k.length) b.pack=o.k.map(function(x){ return {e:x[0],w:x[1]||""}; });
  if(o.t&&o.t.length) b.trips=o.t.map(function(r){
    var t={month:r[0]||"",place:r[1]||"",pic:r[2]||"",kind:KINDU[r[3]]||"",win:r[4]||""};
    if(r.length>5){ t.x=r[5]; t.y=r[6]; }
    return t;
  });
  return b;
}

function copyText(s, done){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(s).then(done, function(){ copyFallback(s, done); });
      return;
    }
  }catch(e){}
  copyFallback(s, done);
}
function copyFallback(s, done){
  try{
    var ta=document.createElement("textarea");
    ta.value=s; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  }catch(e){ done(true); }
}

  var mt=mantraOf();
  if(mt){
    var mr=el("div","showrow mantrarow");
    mr.appendChild(el("span","k","My mantra"));
    mr.appendChild(el("span","v big",mt));
    list.appendChild(mr);
  }
  [["Heading for","dream"],["What I love","love"],["My days","days"],["The hard bit","hard"]].forEach(function(pr){
    var row=el("div","showrow");
    row.appendChild(el("span","k",pr[0]));
    var t=label(pr[1]);
    row.appendChild(el("span","v"+(t?"":" none"), t||"not yet"));
    list.appendChild(row);
  });
  if(filled("ally")){
    var ar=el("div","showrow");
    ar.appendChild(el("span","k","Riding with me"));
    ar.appendChild(el("span","v",label("ally")+((me.allyDoes||"").trim()?" — "+me.allyDoes.trim():"")));
    list.appendChild(ar);
  }
  if(filled("inspire")){
    var ir=el("div","showrow");
    ir.appendChild(el("span","k","Fills me up"));
    ir.appendChild(el("span","v",label("inspire")));
    list.appendChild(ir);
  }
  var pr2=el("div","showrow");
  pr2.appendChild(el("span","k","Taking with me"));
  pr2.appendChild(el("span","v"+(me.pack.length?"":" none"),
    me.pack.length?me.pack.map(function(x){ return x.e+" "+x.w; }).join("  ·  "):"nothing yet"));
  list.appendChild(pr2);
  if(me.trips.length){
    var tr=el("div","showrow");
    tr.appendChild(el("span","k","Been to"));
    tr.appendChild(el("span","v",me.trips.map(function(t){ return t.pic+" "+t.place; }).join("  ·  ")));
    list.appendChild(tr);
    var wr=el("div","showrow");
    wr.appendChild(el("span","k","Wins so far"));
    wr.appendChild(el("span","v",me.trips.filter(function(t){ return (t.win||"").trim(); })
      .map(function(t){ var a=areaOf(t.kind); return (a?a.e+" ":"")+t.win; }).join("  ·  ")||"none yet"));
    list.appendChild(wr);
  }
  p.appendChild(list);

  var keep=el("div","keep");
  keep.appendChild(el("span","k","Keeping it safe"));
  keep.appendChild(el("p","kl","Your camper saves itself as you go. Send this link to your coach at the end — it is your camper in a link, so you can always get it back."));
  var kb=el("div","bar");
  var cp=el("button","btn sm","Copy my camper link");
  cp.addEventListener("click",function(){
    var link=camperLink();
    function fallback(){
      var ta=document.createElement("textarea");
      ta.className="linkbox"; ta.value=link; ta.rows=3; ta.readOnly=true;
      keep.appendChild(ta); ta.focus(); ta.select(); toast("Copy the text in the box");
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){ toast("Copied — paste it to your coach"); },fallback);
    } else fallback();
  });
  kb.appendChild(cp); keep.appendChild(kb);
  p.appendChild(keep);
  return p;
}

/* ---------------- chrome ---------------- */
function renderRail(){
  var r=document.getElementById("rail"); r.innerHTML="";
  var here=chapterOf(PAGES[page].id);

  var head=el("div","chhead");
  head.appendChild(el("span","chlabel","The chapters of your dream"));
  var d=el("span","savedot", storageWorks?"Saved":"Saved in the link"); d.id="savedot";
  head.appendChild(d); r.appendChild(head);

  var strip=el("div","chstrip");
  CHAPTERS.forEach(function(c,i){
    var b=el("button","ch"+(i===here?" on":(chapterDone(c)?" done":""))+(c.on?" going":""));
    b.appendChild(el("span","chn", c.on?"·":String(i+1)));
    b.appendChild(el("span",null,c.n));
    b.addEventListener("click",function(){ goPage(pageIndexOf(c.pages[0])); });
    strip.appendChild(b);
  });
  r.appendChild(strip);

  var cur=CHAPTERS[here];
  if(cur.pages.length>1){
    var sub=el("div","chsub");
    cur.pages.forEach(function(pid){
      var i=pageIndexOf(pid);
      var b=el("button","pg"+(i===page?" on":(done(pid)?" done":"")),PAGES[i].n);
      b.addEventListener("click",function(){ goPage(i); });
      sub.appendChild(b);
    });
    r.appendChild(sub);
  }

  /* the Dream Leader, always on screen */
  var dl=el("div","dlbar");
  dl.appendChild(el("span","dltag","Dream Leader"));
  dl.appendChild(el("span","dlname", squad.now || "— nobody yet —"));
  var sp=el("button","dlspin","Spin 🎲");
  sp.addEventListener("click",spinLeader);
  dl.appendChild(sp);
  var ed=el("button","dledit", editNames?"Done":"Squad");
  ed.addEventListener("click",function(){ editNames=!editNames; render(); });
  dl.appendChild(ed);
  if(editNames){
    var nb=el("div","dlnames");
    var inp=document.createElement("input");
    inp.value=squad.names.join(", ");
    inp.placeholder="everyone's names, separated by commas";
    inp.addEventListener("input",function(){
      squad.names=inp.value.split(",").map(function(x){ return x.trim(); }).filter(Boolean);
      squad.led=squad.led.filter(function(x){ return squad.names.indexOf(x)>=0; });
      saveSquad();
      var t=document.getElementById("dlled"); if(t) t.textContent=ledText();
    });
    nb.appendChild(inp);
    var rs=el("button","btn ghost sm","New round");
    rs.addEventListener("click",function(){ squad.led=[]; squad.now=""; saveSquad(); render(); });
    nb.appendChild(rs);
    dl.appendChild(nb);
    var ll=el("div","dlled",ledText()); ll.id="dlled";
    dl.appendChild(ll);
  }
  r.appendChild(dl);
}
function ledText(){
  if(!squad.names.length) return "Nobody added yet.";
  var left=squad.names.filter(function(x){ return squad.led.indexOf(x)<0; });
  return "Led so far: "+(squad.led.length?squad.led.join(", "):"nobody")
       +"   ·   Still to lead: "+(left.length?left.join(", "):"everybody has had a turn");
}

function render(){
  renderRail();
  var body=document.getElementById("body"); body.innerHTML="";
  var pg=PAGES[page], ci=chapterOf(pg.id), ch=CHAPTERS[ci];

  body.appendChild(el("p","chnow", ch.on ? ch.n : "Chapter "+(ci+1)+" · "+ch.n));
  body.appendChild(el("h1",null,pg.n));
  body.appendChild(el("p","sub","Page "+(page+1)+" of "+PAGES.length
    +(me.name?"  ·  "+(me.av?me.av+" ":"")+me.name:"")));

  var mc=el("div","mc");
  mc.appendChild(el("span","tag",(squad.now?squad.now+" — ":"Dream Leader — ")+"read this out"));
  mc.appendChild(el("div","say",pg.say));
  mc.appendChild(el("div","then",pg.then));
  body.appendChild(mc);

  body.appendChild(pageBody(pg.id));
  if(pg.id!=="show") body.appendChild(camperView());

  var bar=el("div","bar");
  if(page>0){
    var back=el("button","btn ghost sm","← back");
    back.addEventListener("click",function(){ goPage(page-1); });
    bar.appendChild(back);
  }
  if(page<PAGES.length-1){
    var next=el("button","btn big","Next →");
    next.addEventListener("click",function(){ goPage(page+1); });
    bar.appendChild(next);
  } else {
    var again=el("button","btn ghost sm","Start again");
    again.addEventListener("click",function(){
      if(!confirm("Clear your camper and start again?")) return;
      me=blank(); page=0; save(); render(); window.scrollTo(0,0);
    });
    bar.appendChild(again);
  }
  body.appendChild(bar);
}

if(cameFromLink) save();
render();
</script>

</body></html>
