<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoofbeat Diaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --paper: #FBF3E4;
  --card: #FFFDF8;
  --ink: #2B1D14;
  --muted: #6E5845;
  --saddle: #7A4A28;
  --red: #A63A2B;
  --gold: #D99A1E;
  --gold-soft: #FBE7B8;
  --green: #3F7A3A;
  --green-soft: #DCEFD6;
  --bad-soft: #F7D9D3;
  --line: #E4D3BA;
  --tap: #FFF1C9;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Atkinson Hyperlegible", Verdana, sans-serif;
  font-size: 20px;
  line-height: 1.55;
}
h1, h2, h3, .brand { font-family: "Fredoka", "Trebuchet MS", sans-serif; font-weight: 600; line-height: 1.2; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 4px 0 12px; border-bottom: 2px solid var(--line); margin-bottom: 16px; }
.brand { font-size: 28px; color: var(--saddle); display: flex; align-items: center; gap: 10px; margin: 0; }
.score { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--saddle); background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 4px 14px; }
.shoe { width: 26px; height: 26px; flex: none; }

/* menu */
.intro { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px 20px; margin-bottom: 18px; }
.intro p { margin: 6px 0; }
.rounds { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.round-btn { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; transition: transform .1s, border-color .1s; }
.round-btn:hover, .round-btn:focus-visible { border-color: var(--gold); transform: translateY(-2px); outline: none; }
.round-btn h3 { margin: 0; font-size: 22px; color: var(--saddle); }
.round-btn .blurb { color: var(--muted); font-size: 17px; }
.round-btn .meta { margin-top: auto; font-size: 16px; font-weight: 700; color: var(--saddle); }
.tag { display: inline-block; background: var(--red); color: #fff; font-size: 14px; font-weight: 700; border-radius: 999px; padding: 2px 10px; letter-spacing: .02em; align-self: flex-start; }
.menu-foot { display: flex; justify-content: flex-end; margin-top: 18px; }
.ghost { background: transparent; border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: 16px; color: var(--muted); }
.ghost.armed { border-color: var(--red); color: var(--red); }

/* play layout */
.play { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) {
  .play { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
  .passages { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
  .qcol { order: 2; }
}
.qcol { order: -1; }
@media (min-width: 900px) { .qcol { order: 2; } }
.panel { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px 20px; }
.passage + .passage { margin-top: 18px; padding-top: 18px; border-top: 2px dashed var(--line); }
.kind { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--red); }
.passage h2 { margin: 2px 0 10px; font-size: 24px; color: var(--saddle); }
.passage p { margin: 0 0 12px; }
.stanza { margin: 0 0 16px; }
.stanza .s { display: inline; }
.line { display: block; }
.s { border-radius: 6px; padding: 1px 2px; transition: background .12s; }
.tappable .s { cursor: pointer; background: rgba(217, 154, 30, .10); box-shadow: inset 0 -2px 0 rgba(217, 154, 30, .35); }
.tappable .s:hover { background: var(--tap); }
.s.picked { background: var(--gold-soft) !important; box-shadow: inset 0 0 0 2px var(--gold) !important; }
.s.proof { background: var(--green-soft) !important; box-shadow: inset 0 0 0 2px var(--green) !important; }
.s.picked.wrongproof { background: var(--bad-soft) !important; box-shadow: inset 0 0 0 2px var(--red) !important; }
.credit { font-size: 15px; color: var(--muted); font-style: italic; margin-top: 6px; }

.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.skill { font-size: 15px; font-weight: 700; color: #fff; background: var(--saddle); border-radius: 999px; padding: 3px 12px; }
.count { font-size: 16px; color: var(--muted); font-weight: 700; }
.qtext { font-size: 22px; font-weight: 700; margin: 6px 0 14px; }
.step { font-size: 15px; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 6px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt .letter { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 2px solid var(--line); font-weight: 700; }
.opt.sel { border-color: var(--gold); background: var(--gold-soft); }
.opt.sel .letter { background: var(--gold); border-color: var(--gold); color: #fff; }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.right .letter { background: var(--green); border-color: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--bad-soft); }
.opt.wrong .letter { background: var(--red); border-color: var(--red); color: #fff; }
.opt:disabled { cursor: default; }
.prove { background: var(--paper); border: 2px dashed var(--gold); border-radius: 14px; padding: 12px 14px; }
.prove .picked-text { font-style: italic; margin-top: 6px; }
.think { background: #F3E6FA; border: 2px solid #B48BC9; border-radius: 14px; padding: 14px; margin-top: 14px; }
.think h3 { margin: 0 0 6px; color: #5B2E77; font-size: 21px; }
.think ul { margin: 6px 0 0; padding-left: 22px; }
.btn { border: none; border-radius: 14px; padding: 12px 20px; font-weight: 700; font-size: 19px; }
.btn.main { background: var(--saddle); color: #fff; }
.btn.main:disabled { background: #C9B49E; cursor: not-allowed; }
.btn.alt { background: var(--gold); color: var(--ink); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.result { border-radius: 14px; padding: 14px; margin-top: 14px; border: 2px solid var(--line); background: #fff; }
.result h3 { margin: 0 0 6px; font-size: 21px; }
.result p { margin: 6px 0; }
.result .label { font-weight: 700; }
.earned { display: flex; gap: 6px; align-items: center; font-weight: 700; color: var(--saddle); margin-bottom: 4px; }
.earned .shoe.off { opacity: .25; filter: grayscale(1); }
.done-card { text-align: center; }
.done-card .big { font-size: 46px; font-family: "Fredoka", sans-serif; color: var(--saddle); margin: 6px 0; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.dot.ok2 { background: var(--green); }
.dot.ok1 { background: var(--gold); }
.dot.ok0 { background: var(--red); }
.dot.cur { outline: 3px solid var(--saddle); outline-offset: 1px; }
.hidden { display: none !important; }
@media (max-width: 520px) {
  body { font-size: 19px; }
  .brand { font-size: 24px; }
  .qtext { font-size: 20px; }
  .panel { padding: 14px; }
}
</style>
</head>

  var app = document.getElementById("app");

  var SHOE = '<svg class="shoe" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 4h5v12a4 4 0 0 0 8 0V4h5v12a9 9 0 0 1-18 0z" fill="#D99A1E" stroke="#7A4A28" stroke-width="1.6" stroke-linejoin="round"/><circle cx="9.5" cy="9" r="1.1" fill="#7A4A28"/><circle cx="9.5" cy="14" r="1.1" fill="#7A4A28"/><circle cx="22.5" cy="9" r="1.1" fill="#7A4A28"/><circle cx="22.5" cy="14" r="1.1" fill="#7A4A28"/></svg>';
  document.getElementById("logo").innerHTML = SHOE.replace('class="shoe"', 'class="shoe" style="width:34px;height:34px"');
  document.getElementById("scoreShoe").innerHTML = SHOE;

  /* ---------- storage (optional, never required) ---------- */
  function load() {
    try { var raw = window.localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : {}; }
    catch (e) { return {}; }
  }
  function save() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) { /* ignore */ }
  }
  var progress = load(); // { questionIndex: { a: bool, p: bool } }
  if (!progress || typeof progress !== "object") progress = {};

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function splitSentences(par) {
    return par.split(/(?<=[.!?]["”]?)\s+(?=["“A-Z])/).filter(function (s) { return s.trim(); });
  }
  function qsFor(roundId) {
    var out = [];
    QUESTIONS.forEach(function (q, i) { if (q.r === roundId) out.push(i); });
    return out;
  }
  function shoesFor(i) { var r = progress[i]; return r ? (r.a ? 1 : 0) + (r.p ? 1 : 0) : 0; }
  function totalScore() {
    var t = 0; QUESTIONS.forEach(function (_, i) { t += shoesFor(i); }); return t;
  }
  function updateScore() {
    document.getElementById("scoreNum").textContent = totalScore();
    document.getElementById("scoreMax").textContent = QUESTIONS.length * 2;
  }
  var LETTERS = ["A", "B", "C", "D"];

  /* ---------- passage rendering ---------- */
  function renderPassage(id) {
    var P = PASSAGES[id];
    var html = '<section class="passage" data-pid="' + id + '"><div class="kind">' + esc(P.kind) + '</div><h2>' + esc(P.title) + '</h2>';
    var k = 0;
    if (P.poem) {
      P.text.split(/\n\s*\n/).forEach(function (st) {
        html += '<div class="stanza">';
        st.split("\n").forEach(function (ln) {
          html += '<span class="line"><span class="s" data-k="' + id + ':' + (k++) + '">' + esc(ln) + '</span></span>';
        });
        html += '</div>';
      });
    } else {
      P.text.split("\n").forEach(function (par) {
        html += '<p>' + splitSentences(par).map(function (s) {
          return '<span class="s" data-k="' + id + ':' + (k++) + '">' + esc(s) + '</span>';
        }).join(" ") + '</p>';
      });
    }
    if (P.credit) html += '<div class="credit">' + esc(P.credit) + '</div>';
    return html + '</section>';
  }

  /* ---------- screens ---------- */
  var state = null; // { round, list, pos, choice, proofKey, revealed }

  function showMenu() {
    state = null;
    updateScore();
    var html = '<div class="intro"><p><strong>Welcome to Willow Creek Stables!</strong> Pepper the pony thinks she is a champion racehorse. She keeps a diary. So does the stable kid. A narrator tells the same events, too.</p>' +
      '<p>Every question has two steps: <strong>1. Pick an answer.</strong> <strong>2. Prove it</strong> by tapping the sentence in the story. Then show your thinking before your coach reveals the answer. Each step earns a horseshoe.</p></div>';
    html += '<div class="rounds">';
    ROUNDS.forEach(function (r) {
      var list = qsFor(r.id), got = 0, done = 0;
      list.forEach(function (i) { got += shoesFor(i); if (progress[i]) done++; });
      html += '<button class="round-btn" data-round="' + r.id + '">' +
        (r.extra ? '<span class="tag">Extra practice</span>' : '') +
        '<h3>' + esc(r.name) + '</h3><div class="blurb">' + esc(r.blurb) + '</div>' +
        '<div class="meta">' + list.length + ' questions &middot; ' + done + ' done &middot; ' + got + ' / ' + (list.length * 2) + ' horseshoes</div></button>';
    });
    html += '</div><div class="menu-foot"><button class="ghost" id="resetBtn">Reset all progress</button></div>';
    app.innerHTML = html;
    app.querySelectorAll(".round-btn").forEach(function (b) {
      b.addEventListener("click", function () { startRound(b.getAttribute("data-round")); });
    });
    var rb = document.getElementById("resetBtn");
    rb.addEventListener("click", function () {
      if (!rb.classList.contains("armed")) {
        rb.classList.add("armed"); rb.textContent = "Tap again to erase all horseshoes";
        setTimeout(function () { if (rb.isConnected) { rb.classList.remove("armed"); rb.textContent = "Reset all progress"; } }, 4000);
        return;
      }
      progress = {}; save(); showMenu();
    });
    window.scrollTo(0, 0);
  }

  function startRound(id) {
    var list = qsFor(id);
    var pos = 0;
    for (var j = 0; j < list.length; j++) { if (!progress[list[j]]) { pos = j; break; } }
    state = { round: id, list: list, pos: pos };
    showQuestion();
  }

  function showQuestion() {
    var qi = state.list[state.pos];
    var Q = QUESTIONS[qi];
    var R = ROUNDS.filter(function (r) { return r.id === state.round; })[0];
    state.choice = null; state.proofKey = null; state.revealed = false;

    var dots = state.list.map(function (i, n) {
      var r = progress[i], cls = "dot";
      if (r) cls += " ok" + shoesFor(i);
      if (n === state.pos) cls += " cur";
      return '<span class="' + cls + '"></span>';
    }).join("");

    var html = '<div class="play">';
    html += '<div class="panel passages" id="passages">' + Q.p.map(renderPassage).join("") + '</div>';
    html += '<div class="panel qcol">';
    html += '<div class="qhead"><button class="ghost" id="menuBtn">&larr; Rounds</button><span class="count">' + esc(R.name) + ' &middot; ' + (state.pos + 1) + ' of ' + state.list.length + '</span></div>';
    html += '<div class="dots" style="margin-bottom:10px">' + dots + '</div>';
    html += '<span class="skill">' + esc(Q.skill) + '</span>';
    html += '<div class="step">Step 1 &middot; Pick an answer</div>';
    html += '<div class="qtext">' + esc(Q.q) + '</div><div class="opts">';
    Q.o.forEach(function (o, n) {
      html += '<button class="opt" data-n="' + n + '"><span class="letter">' + LETTERS[n] + '</span><span>' + esc(o) + '</span></button>';
    });
    html += '</div>';
    html += '<div id="proveBox" class="hidden"><div class="step">Step 2 &middot; Prove it</div><div class="prove" id="proveMsg"></div></div>';
    html += '<div id="thinkBox" class="think hidden"><h3>Show me your thinking</h3>' +
      '<ul><li>Why did you pick that answer?</li><li>How does your sentence prove it?</li><li>Which answer was the trickiest to rule out?</li></ul>' +
      '<div class="btn-row"><button class="btn main" id="revealBtn">Coach: Reveal</button></div></div>';
    html += '<div id="resultBox"></div>';
    html += '</div></div>';
    app.innerHTML = html;

    document.getElementById("menuBtn").addEventListener("click", showMenu);
    app.querySelectorAll(".opt").forEach(function (b) {
      b.addEventListener("click", function () { pickOption(parseInt(b.getAttribute("data-n"), 10)); });
    });
    document.getElementById("passages").addEventListener("click", function (e) {
      var s = e.target.closest(".s");
      if (s) pickSentence(s);
    });
    document.getElementById("revealBtn").addEventListener("click", reveal);
    window.scrollTo(0, 0);
  }

  function proveMessage() {
    var Q = QUESTIONS[state.list[state.pos]];
    var hint = Q.hint || (Q.p.length > 1 ? "Tap the sentence in EITHER text that proves your answer." : (PASSAGES[Q.p[0]].poem ? "Tap the line in the poem that proves your answer." : "Tap the sentence in the story that proves your answer."));
    var msg = '<strong>' + esc(hint) + '</strong>';
    if (state.proofKey) {
      var el = document.querySelector('.s[data-k="' + state.proofKey + '"]');
      msg += '<div class="picked-text">Your proof: &ldquo;' + esc(el ? el.textContent : "") + '&rdquo;</div><div style="font-size:16px;color:var(--muted)">Tap a different sentence to change it.</div>';
    }
    document.getElementById("proveMsg").innerHTML = msg;
  }

  function pickOption(n) {
    if (state.revealed) return;
    state.choice = n;
    app.querySelectorAll(".opt").forEach(function (b) { b.classList.toggle("sel", parseInt(b.getAttribute("data-n"), 10) === n); });
    document.getElementById("proveBox").classList.remove("hidden");
    document.getElementById("passages").classList.add("tappable");
    proveMessage();
    updateThink();
    if (narrow() && !state.proofKey) document.getElementById("passages").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function narrow() { return window.innerWidth < 900; }

  function pickSentence(el) {
    if (state.revealed || state.choice === null) return;
    app.querySelectorAll(".s.picked").forEach(function (s) { s.classList.remove("picked"); });
    el.classList.add("picked");
    state.proofKey = el.getAttribute("data-k");
    proveMessage();
    updateThink();
    if (narrow()) document.getElementById("thinkBox").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function updateThink() {
    var box = document.getElementById("thinkBox");
    if (state.choice !== null && state.proofKey) box.classList.remove("hidden");
  }

  function isProof(text, Q) {
    var t = text.replace(/[“”]/g, '"');
    return Q.proof.some(function (p) { return t.indexOf(p) !== -1; });
  }

  function reveal() {
    if (state.revealed) return;
    state.revealed = true;
    var qi = state.list[state.pos], Q = QUESTIONS[qi];
    var ansOk = state.choice === Q.a;
    var pickedEl = state.proofKey ? document.querySelector('.s[data-k="' + state.proofKey + '"]') : null;
    var proofOk = !!(pickedEl && isProof(pickedEl.textContent, Q));

    app.querySelectorAll(".opt").forEach(function (b) {
      var n = parseInt(b.getAttribute("data-n"), 10);
      b.disabled = true; b.classList.remove("sel");
      if (n === Q.a) b.classList.add("right");
      else if (n === state.choice) b.classList.add("wrong");
    });
    var passages = document.getElementById("passages");
    passages.classList.remove("tappable");
    passages.querySelectorAll(".s").forEach(function (s) { if (isProof(s.textContent, Q)) s.classList.add("proof"); });
    if (pickedEl && !proofOk) pickedEl.classList.add("wrongproof");
    document.getElementById("thinkBox").classList.add("hidden");

    var prev = progress[qi];
    // keep the best result if the round is replayed
    progress[qi] = { a: ansOk || !!(prev && prev.a), p: proofOk || !!(prev && prev.p) };
    save(); updateScore();

    var got = (ansOk ? 1 : 0) + (proofOk ? 1 : 0);
    var heads = ["Keep trotting!", "Nice work!", "Double horseshoe!"];
    var shoes = '<span class="shoe-wrap">' + SHOE.replace('class="shoe"', 'class="shoe' + (ansOk ? '' : ' off') + '"') + '</span>' +
      '<span class="shoe-wrap">' + SHOE.replace('class="shoe"', 'class="shoe' + (proofOk ? '' : ' off') + '"') + '</span>';
    var html = '<div class="result"><div class="earned">' + shoes + '<span>' + heads[got] + '</span></div>';
    html += '<p><span class="label">Answer:</span> ' + (ansOk ? 'Yes! ' : 'Not this time. ') + 'The answer is <strong>' + LETTERS[Q.a] + '</strong>.</p>';
    html += '<p><span class="label">Proof:</span> ' + (proofOk ? 'Your sentence proves it. ' : (pickedEl ? 'Your sentence does not prove it. ' : 'No sentence tapped. ')) + 'The green sentence' + (Q.proof.length > 1 ? 's are' : ' is') + ' strong proof.</p>';
    html += '<p><span class="label">Why:</span> ' + esc(Q.why) + '</p>';
    html += '<p><span class="label">The trap:</span> ' + esc(Q.trap) + '</p></div>';
    var last = state.pos === state.list.length - 1;
    html += '<div class="btn-row"><button class="btn main" id="nextBtn">' + (last ? 'Finish round' : 'Next question &rarr;') + '</button>' +
      '<button class="btn alt" id="retryBtn">Try it again</button></div>';
    var rbox = document.getElementById("resultBox");
    rbox.innerHTML = html;
    document.getElementById("nextBtn").addEventListener("click", function () {
      if (last) showRoundDone(); else { state.pos++; showQuestion(); }
    });
    document.getElementById("retryBtn").addEventListener("click", showQuestion);
    rbox.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function showRoundDone() {
    var R = ROUNDS.filter(function (r) { return r.id === state.round; })[0];
    var got = 0;
    state.list.forEach(function (i) { got += shoesFor(i); });
    var max = state.list.length * 2;
    var pct = Math.round(got / max * 100);
    var msg = pct >= 90 ? "Champion level! That is test-out territory." : pct >= 70 ? "Strong ride. Which questions tripped you up? Try those again." : "Every champion practices. Run this round again and hunt for proof first.";
    var idx = ROUNDS.indexOf(R);
    var next = ROUNDS[(idx + 1) % ROUNDS.length];
    app.innerHTML = '<div class="panel done-card"><h2>' + esc(R.name) + ' complete</h2><div class="big">' + got + ' / ' + max + '</div>' +
      '<p>horseshoes (' + pct + '%)</p><p>' + esc(msg) + '</p>' +
      '<div class="btn-row" style="justify-content:center"><button class="btn main" id="nextRound">Next round: ' + esc(next.name) + '</button>' +
      '<button class="btn alt" id="againBtn">Replay this round</button><button class="ghost" id="toMenu">All rounds</button></div></div>';
    document.getElementById("nextRound").addEventListener("click", function () { startRound(next.id); });
    document.getElementById("againBtn").addEventListener("click", function () { state = { round: R.id, list: qsFor(R.id), pos: 0 }; showQuestion(); });
    document.getElementById("toMenu").addEventListener("click", showMenu);
    window.scrollTo(0, 0);
  }

  showMenu();
})();
</script>
</body>
</html>
